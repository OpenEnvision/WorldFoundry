schema_version: paweval.rubric/v1
axis: outcome
scene_id: A17
track: calibration
title_en: Ridge-Instability Ball Release
outcome_question: Which label in ['left_basin', 'right_basin'] is visible as the first
  decisive post-action result?
readout_policy: Read after the requested release has actually occurred. The readout
  does not have to be the final video frame; use the first short readable window
  where the ball has left the ridge, is clearly contained in one basin, and is no
  longer crossing between basins. Later same-basin bounce, brief airborne frames,
  occlusion, or video-end artifacts do not relabel the outcome.
canonical_labels:
- left_basin
- right_basin
label_aliases: {}
unreadable_rules:
- Evidence frames are occluded or cropped such that the canonical label cannot be
  determined.
- Heavy motion blur prevents identifying the canonical label in any qualifying frame.
- None of the canonical labels ['left_basin', 'right_basin'] can be decisively identified
  within the readout window.
- The ball is occluded or goes off-screen before a decisive side / bin / path can
  be identified. If a visible off-support exit is established, use out-of-schema
  instead.
out_of_schema_rules:
- Ball remains stuck on the ridge, oscillates indefinitely over the ridge, or leaves
  the apparatus before committing to either basin; this is out-of-schema, not nearest-legal.
- If disappearance, duplication, or teleportation prevents identifying a canonical label, return `unreadable`; if a readable label is already established, preserve the outcome and leave continuity failure to trustworthiness. Use out-of-schema only for visible events outside this rubric.
priority_rules:
- 'Tie-break: if two labels look equally consistent in the same readout frame, return
  `unreadable` (do NOT coerce to the visually nearest label).'
- 'First-decisive-window rule: use the earliest post-release frame/window where the
  ball has committed to a basin; do not require the terminal frame and do not re-label
  from later same-basin bounce, occlusion, or transient states.'
- If the ball briefly touches or enters a basin but remains in continuous motion
  that carries it to the opposite basin, read the later committed basin rather than
  the transient basin.
- Normal continuous bounce/cross-basin motion before commitment means keep waiting;
  impossible crossing to the opposite basin after commitment belongs to trustworthiness.
notes:
- 'Scene title: Ridge-Instability Ball Release.'
- 'Calibration support: canonical labels are the reference-probability-bearing support
  of the intended experiment. Visibly stuck, exited, outside-region, or no-committed-region
  terminal states are out-of-schema/invalid rather than extra outcome labels.'
geometry_policy: Left_basin and right_basin are the two basins either side of the
  ridge. Basin is decided at the first frame/window where the ball has left the ridge
  and committed to one basin.
