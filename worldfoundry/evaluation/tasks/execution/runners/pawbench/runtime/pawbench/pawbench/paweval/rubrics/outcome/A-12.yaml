schema_version: paweval.rubric/v1
axis: outcome
scene_id: A-12
track: calibration
title_en: Y-track with visual cue
outcome_question: Which label in ['left_path', 'right_path'] is visible as the first
  decisive post-action result?
readout_policy: Read after the requested release has actually occurred. Use the first
  short readable window where the ball is clearly in one downstream branch past the
  split. Post-split transients at the walls or divider do not qualify. Later same-branch
  bounce, brief occlusion, or video-end artifacts do not relabel the outcome.
canonical_labels:
- left_path
- right_path
label_aliases: {}
unreadable_rules:
- Evidence frames are occluded or cropped such that the canonical label cannot be
  determined.
- Heavy motion blur prevents identifying the canonical label in any qualifying frame.
- None of the canonical labels ['left_path', 'right_path'] can be decisively identified
  within the readout window.
- The ball is occluded or goes off-screen before a decisive side / bin / path can
  be identified. If a visible off-support exit is established, use out-of-schema
  instead.
out_of_schema_rules:
- Ball visibly gets stuck at the split or leaves the Y-track apparatus; this is out-of-schema,
  not nearest-legal.
- If disappearance, duplication, or teleportation prevents identifying a canonical label, return `unreadable`; if a readable label is already established, preserve the outcome and leave continuity failure to trustworthiness. Use out-of-schema only for visible events outside this rubric.
priority_rules:
- 'Tie-break: if two labels look equally consistent in the same readout frame, return
  `unreadable` (do NOT coerce to the visually nearest label).'
- 'First-decisive-window rule: use the first short readable post-release window where
  the ball has committed to a downstream branch; do not re-label from later same-branch
  bounce, occlusion, or transient states.'
- Path commitment past the split is the readout; post-split transients at the walls
  do not decide the label.
- Normal continuous motion before branch commitment means keep waiting; jumping to
  the other branch after commitment belongs to trustworthiness.
notes:
- 'Path-branch scene: readout is the committed branch past the split, not the terminal
  resting state.'
- 'Scene title: Y-track with visual cue.'
- The visual cue may bias generation, but it is not outcome evidence; judge the visible
  branch commitment only.
- 'Calibration support: canonical labels are the reference-probability-bearing support
  of the intended experiment. Visibly stuck, exited, outside-region, or no-committed-region
  terminal states are out-of-schema/invalid rather than extra outcome labels.'
geometry_policy: Left_path and right_path are the left and right branches of the Y-split
  apparatus. The fixed visual cue does not change the geometry; it only biases the
  expected distribution. Path is decided at the first frame where the ball has committed
  past the split.
