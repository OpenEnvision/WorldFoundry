schema_version: paweval.rubric/v1
axis: trustworthiness
scene_id: A23
track: calibration
title_en: Coin Toss With Back-Face Initial State
scene_grounding:
- 'Initial state must match: One coin is held at the release point above the tabletop,
  matching the A01 setup except the initial visible coin face is the back face rather
  than the front face.'
- Apparatus geometry in the opening frames must match the source image.
- Exactly one coin must be visible at the release point; no duplicated or missing
  coin.
action_execution:
- 'Required action: Flick the coin once.'
- Action must happen exactly once in the expected direction / region.
- No pre-action peeking or flipping that leaks the outcome before the flick/throw.
target_requirements:
- Scene-defining target, subject, and readout evidence must remain visible throughout the action.
object_continuity:
- Subject object(s) must not disappear, duplicate, or teleport during the readout
  window.
- Color / identity of the subject must remain consistent across frames.
apparatus_stability:
- Scene-defining apparatus, target geometry, and support surfaces must not drift, resize, or change color mid-run.
motion_hard_failures:
- 'Teleport: subject moves across space without a continuous trajectory.'
- 'Post-readout state/region change: subject moves between label-defining states or regions after the first decisive readout.'
- 'Post-result label change: the visible coin face changes after the first decisive
  post-action readout without physically plausible continued motion.'
- 'No-action no-readout: if the flick/throw never happens, no relaxed post-action
  outcome readout exists even if a coin face is visible.'
post_result_consistency:
- Post-result frames must remain physically consistent with the readout label.
- No retroactive change of the outcome label via physically impossible motion after
  the readout window.
- Later hand occlusion or camera loss after an already readable post-toss face does
  not erase the relaxed outcome label, but should be noted as readout/trust evidence
  when it prevents confirming continued consistency.
severity_rules:
  fatal_for_strict_trusted:
  - SCENE_GROUNDING_FAIL
  - ACTION_EXECUTION_FAIL
  - OBJECT_CONTINUITY_FAIL
  - TRAJECTORY_INVALID
  - APPARATUS_INSTABILITY
  - POST_RESULT_INCONSISTENCY
  nonfatal_warnings:
  - MINOR_VISUAL_ARTIFACT
  - READOUT_AMBIGUITY
notes:
- 'Scene title: Coin Toss With Back-Face Initial State.'
- Initial back-face visibility is scene grounding only; the outcome requires a
  post-action readable face.
