schema_version: paweval.rubric/v1
axis: trustworthiness
scene_id: BA-02
track: coverage
title_en: Dog Reaction to Approaching Stranger
scene_grounding:
- 'Initial state must match: A stranger approaches a standing dog on an outdoor path.'
- Apparatus geometry in the opening frames must match the source image.
action_execution:
- 'Required action: Let the stranger approach the dog.'
- Action must happen exactly once in the expected direction / region.
- Action target must be identifiable in the same frame as the action onset (Track
  B target acquisition).
- The action must be visible as a single continuous event from the described initial
  state; cuts, hidden starts, or repeated attempts are action-execution failures.
- For reaction labels, the stimulus timing must be visible before the animal/person
  reaction is scored.
target_requirements:
- Dog, approaching stranger/person, and approach path must be visible; dog reaction
  must be attributable to the person approach, not an off-screen cause.
- Dog identity and person identity must stay continuous while orientation, retreat,
  or approach is judged.
- The person approach must be visible before any reaction label is trusted; continuing
  the initial dog-facing-person pose without visible approach progress is ACTION_EXECUTION_FAIL
  rather than a valid holds-facing outcome.
- Defensive posture, active defensive advance/contact, retreat, leaving, approach,
  turn-away, and holding position must be attributable to the same visible dog and
  same approaching person through a continuous post-approach window.
- Unreadable dog/person orientation is a readout failure, not a valid terminal outcome.
object_continuity:
- Subject object(s) must not disappear, duplicate, or teleport during the readout
  window.
- Color / identity of the subject must remain consistent across frames.
- 'Identity continuity is fatal: the judged subject, target, and key apparatus must
  not swap appearance, duplicate, vanish, or re-enter as a different object/person/animal.'
- Animal body orientation and person/hand/stimulus identity must remain trackable
  across the reaction window.
apparatus_stability:
- Scene-defining apparatus, target geometry, and support surfaces must not drift, resize, or change color mid-run.
motion_hard_failures:
- 'Teleport: subject moves across space without a continuous trajectory.'
- 'Post-readout state/region change: subject moves between label-defining states or regions after the first decisive readout.'
- 'Post-result side change: label-defining region changes after the first decisive
  post-action frame.'
- 'Reaction attribution contradiction: dog retreats/approaches before the person approach
  or because of an off-screen event rather than the visible person.'
post_result_consistency:
- Post-result frames must remain physically consistent with the readout label.
- No retroactive change of the outcome label via physically impossible motion after
  the readout window.
- After the first dog orientation/movement label, dog/person positions must remain
  continuous and attributable to the same approach.
severity_rules:
  fatal_for_strict_trusted:
  - SCENE_GROUNDING_FAIL
  - ACTION_EXECUTION_FAIL
  - OBJECT_CONTINUITY_FAIL
  - TRAJECTORY_INVALID
  - APPARATUS_INSTABILITY
  - POST_RESULT_INCONSISTENCY
  - OBJECT_ACQUISITION_FAIL
  nonfatal_warnings:
  - MINOR_VISUAL_ARTIFACT
  - READOUT_AMBIGUITY
notes:
- 'Scene title: Dog Reaction to Approaching Stranger.'
- 'Fatal severity cue: target/stimulus acquisition failure, impossible trajectory,
  identity discontinuity, or post-result contradiction excludes strict trusted metrics
  even if the outcome is readable.'
- 'BA reaction trust cue: animal/person/stimulus visibility, attribution to the requested
  action, off-screen-cause rejection, and identity continuity are mandatory.'
