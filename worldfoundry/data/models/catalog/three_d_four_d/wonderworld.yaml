docs:
  publisher: Stanford University / MIT
  publisher_kind: university
  publisher_zh: 斯坦福大学 / 麻省理工学院
  overview: WonderWorld creates a layered Gaussian world from one image and expands it at requested camera views. WorldFoundry runs native diffusion recipes and in-tree scene reconstruction, exporting a standard .splat scene and view previews.
  overview_zh: WonderWorld 从单张图像创建分层高斯世界，并在指定相机视角扩展场景。WorldFoundry 使用原生扩散配方与树内场景重建，导出标准 .splat 场景和视角预览。
  architecture: Guided Marigold depth diffusion aligns generated views to existing geometry and a ground plane. RepViT-SAM refines region disparity, OneFormer identifies sky and occluders, SD2 completes hidden/new regions, and normal-oriented Gaussians are reconstructed and fitted with gsplat.
  architecture_zh: 引导式 Marigold 深度扩散将新视角对齐已有几何与地面。RepViT-SAM 细化区域视差，OneFormer 识别天空与遮挡物，SD2 补全隐藏和新出现区域，再通过 gsplat 重建并拟合法线定向的高斯。
  usage_notes: Supply an RGB image and local SD2 Inpainting, Marigold depth/normals, OneFormer, and RepViT-SAM assets. Optional camera_path contains OpenCV world-to-camera matrices in exported scene units. Default image size is 512x512; calls own independent scenes while retaining weights.
  usage_notes_zh: 提供 RGB 图像以及本地 SD2 Inpainting、Marigold 深度/法线、OneFormer 和 RepViT-SAM 资产。可选 camera_path 使用导出场景单位下的 OpenCV 世界到相机矩阵。默认图像为 512x512；每次调用独立生成场景并复用常驻权重。
  limitations:
  - Offline seed and finite camera-path generation; upstream interactive server, GPT prompts, cached panorama workflow, and full official numerical/quality parity are not validated.
  - SD2 uses CreativeML Open RAIL++-M terms; other component terms also apply. The pinned WonderWorld root license is unspecified.
  - Single-image geometry and newly revealed content are generative estimates, not metric reconstruction guarantees.
  limitations_zh:
  - 支持离线种子场景与有限相机路径生成；上游交互服务器、GPT 提示词、缓存全景流程及完整官方数值/质量一致性尚未验证。
  - SD2 受 CreativeML Open RAIL++-M 条款约束，其他组件也有各自条款；固定版本的 WonderWorld 根许可证未明确。
  - 单图几何及新显露区域是生成式估计，不保证度量重建精度。
  recommended_benchmarks:
  - id: worldscore
    reason: Camera-controlled generated-world evaluation.
    reason_zh: 相机可控生成世界评估。
