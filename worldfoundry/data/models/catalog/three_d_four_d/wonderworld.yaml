docs:
  publisher: Stanford University / MIT
  publisher_kind: university
  publisher_zh: 斯坦福大学 / 麻省理工学院
  overview: WonderWorld generates interactive 3D scenes from a single image. WorldFoundry registers a subprocess adapter, but the public tree lacks the required run.py; real inference is blocked pending authorized runtime source and assets.
  overview_zh: WonderWorld 从单张图像生成可交互的 3D 场景。WorldFoundry 已注册子进程适配器，但公开树缺少所需的 run.py；真实推理仍受运行源码与资产缺失阻塞。
  architecture: Per the paper (arXiv 2406.09394), the key representation is FLAGS (Fast LAyered Gaussian Surfels), generated from a single view with a guided depth-diffusion scheme — under 10 seconds per scene on the reported hardware. Direct execution requires WonderWorld checkpoints plus local PyTorch3D-compatible extensions.
  architecture_zh: 按论文（arXiv 2406.09394），核心表示是 FLAGS（快速分层高斯面元），配合引导式深度扩散从单视图生成——在论文硬件上每场景不足 10 秒。直接运行需要 WonderWorld checkpoint 与本地兼容 PyTorch3D 的扩展。
  usage_notes: The public tree does not contain WonderWorld run.py. Provide an authorized upstream runtime checkout plus the checkpoint assets and compatible extensions before attempting real inference.
  usage_notes_zh: 公开树不包含 WonderWorld run.py。尝试真实推理前，需提供获授权的上游运行源码、权重资产及兼容扩展。
  limitations:
  - Checkpoint-backed inference is blocked by missing runtime source and assets.
  - 'Single-image origin: scene fidelity beyond the visible content is generative guesswork.'
  limitations_zh:
  - 运行源码与资产缺失，尚无法验证加载权重后的推理。
  - 以单图为源：可见内容之外的场景保真度依赖生成式推测。
  recommended_benchmarks:
  - id: worldscore
    reason: Standard scoring for interactive generated 3D worlds.
    reason_zh: 交互式生成 3D 世界的标准评分。
