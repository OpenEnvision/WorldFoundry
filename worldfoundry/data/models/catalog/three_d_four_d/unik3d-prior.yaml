docs:
  publisher: ETH Zurich
  publisher_kind: university
  publisher_zh: 苏黎世联邦理工学院（ETH Zurich）
  overview: 'UniK3D generalizes metric 3D estimation to any camera — pinhole, fisheye, even full panoramas — with one model. In this catalog it is a checkpoint-verified universal-camera geometry prior: real checkpoint inference is verified through the shared contract with automatic camera estimation, while pinhole and panorama overrides stay explicit.'
  overview_zh: UniK3D 把米制 3D 估计推广到任意相机——针孔、鱼眼、乃至完整全景——单一模型通吃。本 catalog 中它是 checkpoint 已验证的通用相机几何先验：真实 checkpoint 推理已通过共享契约验证并支持自动相机估计，针孔与全景相机覆盖保持显式配置。
  architecture: Per the upstream publication, UniK3D represents the camera with a learned spherical-basis model, decoupling ray directions from radial depth so that no distortion-specific tuning is needed. The default checkpoint resolves from lpiccinelli/unik3d-vitl; registered at base_models/three_dimensions/depth/unik3d.
  architecture_zh: 按上游论文，UniK3D 用学习到的球谐基相机模型表示相机，把射线方向与径向深度解耦，无需针对畸变单独调参。默认 checkpoint 从 lpiccinelli/unik3d-vitl 解析；注册于 base_models/three_dimensions/depth/unik3d。
  usage_notes: It is integrated as an independent geometry prior under worldfoundry/base_models and exposed through the shared geometry-prior pipeline/operator contract. Higher-level pipelines (e.g. ViPE) import it from this canonical owner instead of keeping private copies. Prefer it over pinhole-only priors when inputs include fisheye or panoramic imagery. The upstream release is CC-BY-NC-4.0.
  usage_notes_zh: 它作为独立几何先验集成在 worldfoundry/base_models 下，通过共享的 geometry-prior pipeline/operator 契约对外暴露。上层管线（如 ViPE）从这一规范位置导入它，而不是各自保留私有副本。当输入包含鱼眼或全景图像时，优先选它而非仅支持针孔的先验。上游发布为CC-BY-NC-4.0。
  limitations:
  - 'CC-BY-NC-4.0: non-commercial license terms apply downstream.'
  - Auto camera estimation can misjudge unusual optics — use explicit pinhole/panorama overrides when known.
  limitations_zh:
  - CC-BY-NC-4.0：下游适用非商用许可条款。
  - 自动相机估计可能误判特殊光学系统——已知相机类型时请显式指定针孔/全景覆盖。
