docs:
  publisher: Zhejiang University (ReLER Lab)
  publisher_kind: university
  publisher_zh: 浙江大学（ReLER 实验室）
  overview: Segment and Track Anything (SAM-Track) combines SAM segmentation with AOT/DeAOT tracking so objects can be segmented once and tracked across a whole video, with GroundingDINO enabling text-prompted selection. In this catalog it is an independent tracking prior consumed through the shared geometry-prior contract.
  overview_zh: Segment and Track Anything（SAM-Track）把 SAM 分割与 AOT/DeAOT 跟踪结合起来：对象只需分割一次即可在整段视频中被跟踪，GroundingDINO 支持文本提示选择。本 catalog 中它是经共享 geometry-prior 契约调用的独立跟踪先验。
  architecture: The recorded structure combines three subcomponents — SAM for masks, GroundingDINO for text grounding, and AOT/DeAOT for propagation — reusing canonical WorldFoundry owners where available. Registered at base_models/perception_core/tracking/track_anything; upstream license is AGPL-3.0.
  architecture_zh: 记录的结构组合三个子组件——SAM 出掩码、GroundingDINO 做文本定位、AOT/DeAOT 做传播——并在可用时复用 WorldFoundry 的规范组件。注册于 base_models/perception_core/tracking/track_anything；上游许可为 AGPL-3.0。
  usage_notes: It is integrated as an independent geometry prior under worldfoundry/base_models and exposed through the shared geometry-prior pipeline/operator contract. Higher-level pipelines (e.g. ViPE) import it from this canonical owner instead of keeping private copies. Config resolution and pipeline/operator import are expected to pass; real prior inference remains gated by checkpoints/assets.
  usage_notes_zh: 它作为独立几何先验集成在 worldfoundry/base_models 下，通过共享的 geometry-prior pipeline/operator 契约对外暴露。上层管线（如 ViPE）从这一规范位置导入它，而不是各自保留私有副本。配置解析与 pipeline/operator 导入预期可通过；真实先验推理仍受 checkpoint/资产限制。
  limitations:
  - 'AGPL-3.0 license: copyleft terms apply downstream.'
  - Real inference is checkpoint-gated (SAM, GroundingDINO, AOT assets).
  limitations_zh:
  - AGPL-3.0 许可：下游适用 copyleft 条款。
  - 真实推理受 checkpoint 限制（SAM、GroundingDINO、AOT 资产）。
