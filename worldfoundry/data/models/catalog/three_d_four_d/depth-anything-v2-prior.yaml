docs:
  publisher: TikTok / The University of Hong Kong
  publisher_kind: company
  publisher_zh: TikTok / 香港大学
  overview: Depth Anything V2 is the sharper, synthetic-data-trained successor to V1, integrated here as a metric/monocular depth prior with verified runner status. The recorded checkpoint is depth-anything/Depth-Anything-V2-Large; the shared priors factory and the video-depth prior reuse this implementation.
  overview_zh: Depth Anything V2 是 V1 的后继者，用合成数据训练、细节更锐利，此处作为米制/单目深度先验集成，runner 状态已验证。记录的 checkpoint 为 depth-anything/Depth-Anything-V2-Large；共享先验工厂与视频深度先验复用同一实现。
  architecture: Same DINOv2+DPT family as V1 but trained on precise synthetic labels with pseudo-labeled real images, improving edges and thin structures (per the publication). Registered at base_models/three_dimensions/depth/depth_anything/depth_anything_v2.
  architecture_zh: 与 V1 同为 DINOv2+DPT 家族，但用精确合成标注加伪标注真实图像训练，边缘与细结构更好（见论文）。注册于 base_models/three_dimensions/depth/depth_anything/depth_anything_v2。
  usage_notes: It is integrated as an independent geometry prior under worldfoundry/base_models and exposed through the shared geometry-prior pipeline/operator contract. Higher-level pipelines (e.g. ViPE) import it from this canonical owner instead of keeping private copies. Runner parity is verified through the shared contract.
  usage_notes_zh: 它作为独立几何先验集成在 worldfoundry/base_models 下，通过共享的 geometry-prior pipeline/operator 契约对外暴露。上层管线（如 ViPE）从这一规范位置导入它，而不是各自保留私有副本。runner parity 已通过共享契约验证。
  limitations:
  - Metric accuracy varies by domain; indoor/outdoor calibration differs.
  - Single-image prior; temporal stability on video is not its job.
  limitations_zh:
  - 米制精度随领域变化；室内/室外标定不同。
  - 单帧先验；视频时序稳定性不在其职责内。
