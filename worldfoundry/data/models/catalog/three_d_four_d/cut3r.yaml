docs:
  publisher: UC Berkeley
  publisher_kind: university
  publisher_zh: 加州大学伯克利分校（UC Berkeley）
  overview: 'CUT3R is a continuous 3D perception model with persistent state: it ingests a stream of images and continuously updates a metric-scale 3D reconstruction, without offline bundling. In this catalog the in-tree point-cloud and two-stage 3DGS routes are registered through Studio discovery. CUT3R also serves as the geometry backbone for the verified VMem entry in the video category.'
  overview_zh: CUT3R 是带持久状态的连续 3D 感知模型：接收图像流并持续更新米制尺度的 3D 重建，无需离线捆绑优化。本 catalog 中已通过 Studio 发现机制注册了树内点云与两段式 3DGS 路径。CUT3R 同时是 video 类别中已验证的 VMem 条目的几何主干。
  architecture: A recurrent transformer maintains a persistent scene state; each new frame updates the state and outputs pointmaps and camera parameters online (per the upstream publication). The recorded routes cover raw point-cloud export and a two-stage 3DGS pipeline; weights are apache-2.0.
  architecture_zh: 循环 Transformer 维护持久场景状态；每帧新图像更新状态并在线输出点图与相机参数（见上游论文）。已记录路径覆盖点云导出与两段式 3DGS pipeline；权重为 apache-2.0。
  usage_notes: 'Runner parity is pending: checkpoint-backed inference depends on staged local or Hugging Face cut3r weights. Stage them before submitting Studio jobs.'
  usage_notes_zh: Runner parity 为 pending：checkpoint 加载推理依赖就位的本地或 Hugging Face cut3r 权重。提交 Studio 任务前请先就位权重。
  limitations:
  - Checkpoint-backed parity is pending; the routes are registered but unverified in this workspace.
  - Streaming reconstruction quality degrades on long sequences with severe viewpoint changes.
  limitations_zh:
  - checkpoint 加载一致性待验证；路径已注册但本工作区尚未验证。
  - 长序列且视角剧烈变化时，流式重建质量会下降。
