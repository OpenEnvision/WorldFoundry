id: flashworld
name: FlashWorld
area: 3d
task: fast 3D scene generation from image or text
developer: FlashWorld authors
user_starred: true
official_sources:
  github: https://github.com/imlixinyang/FlashWorld
  huggingface:
  - https://huggingface.co/imlixinyang/FlashWorld
  project_page: https://imlixinyang.github.io/FlashWorld-Project-Page/
  paper: https://arxiv.org/abs/2510.13678
availability:
  status: open_source
  open_source: true
  code: public
  weights: public_huggingface
  license: Apache-2.0 for GitHub repo; CC-BY-NC-SA-4.0 metadata on Hugging Face model repo
  api: huggingface_space
integration:
  kind: pipeline_runner
  status: integrated
  notes:
  - WorldFoundry exposes the in-tree FlashWorld pipeline, operator, and representation runtime.
  - Runtime execution remains checkpoint/GPU/dependency gated; no empty runner shim is registered.
confirmation: Official GitHub repo reports Apache-2.0 and links Hugging Face demo/model; HF model metadata is CC-BY-NC-SA-4.0,
  so downstream use must honor artifact-specific license.
output_artifacts:
- generated_3d_asset
- generated_video
runtime_profile: runtime-profile:flashworld
runner_target: worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner
pipeline_binding: flashworld
runner_parity:
  status: verified
  notes:
  - The in-tree FlashWorld runner supports the image-conditioned camera-scene demo with local FlashWorld/Wan assets.
  - Per-run visual QA and artifact checks are tracked outside the model catalog.
catalog_category: three_d_four_d
catalog_scope: Official-source manifest for 3D, 4D, and camera-controlled world/model generation projects.
catalog_policy:
  open_source_true_requires: An official GitHub or Hugging Face source with an explicit OSI-style software license or otherwise
    clearly open source/open weights metadata. Public code without a license is source-available, not open_source.
  weights_policy: Weights were not downloaded. Entries record only official repository, Hugging Face, project page, paper,
    and license metadata.
  status_values:
  - open_source
  - source_available
  - open_weights_restricted
  - api_or_closed
  - unknown
docs:
  publisher: Xiamen University / Tencent
  publisher_kind: university
  publisher_zh: 厦门大学 / 腾讯
  overview: 'FlashWorld generates 3D scenes in seconds: from one image (plus optional prompt) it produces a camera-navigable 3D scene rather than a flat clip. In this catalog the in-tree pipeline, operator, and representation runtime are exposed and runner status is verified for the image-conditioned camera-scene demo with local FlashWorld/Wan assets.'
  overview_zh: FlashWorld 数秒内生成 3D 场景：从一张图（可附提示词）产出可相机游走的 3D 场景，而非平面视频。本 catalog 中其树内 pipeline、operator 与表示运行时均已暴露，图像条件的相机场景 demo 在本地 FlashWorld/Wan 资产下 runner 状态为 verified。
  architecture: FlashWorld distills a Wan-based video generator into a fast 3D-scene generator with Gaussian-style scene representations (per arXiv 2510.13678). Execution requires FlashWorld, Wan2.2, diffusers/transformers, and CUDA assets; no empty runner shim is registered.
  architecture_zh: FlashWorld 将基于 Wan 的视频生成器蒸馏为快速 3D 场景生成器，使用高斯式场景表示（见 arXiv 2510.13678）。运行需要 FlashWorld、Wan2.2、diffusers/transformers 与 CUDA 资产；不注册空的 runner 壳。
  usage_notes: Verified for the image-conditioned demo; per-run visual QA is tracked outside the catalog. Execution remains checkpoint/GPU/dependency gated — stage all recorded assets first.
  usage_notes_zh: 图像条件 demo 已验证；每次运行的视觉 QA 在 catalog 外跟踪。执行仍受 checkpoint/GPU/依赖限制——请先就位所有记录资产。
  limitations:
  - Speed-focused distillation trades some scene fidelity versus optimization-based methods.
  - Requires the full recorded asset set (FlashWorld + Wan2.2).
  limitations_zh:
  - 以速度为先的蒸馏在场景保真度上弱于基于优化的方法。
  - 需要完整的记录资产组合（FlashWorld + Wan2.2）。
  recommended_benchmarks:
  - id: worldscore
    reason: Standard scoring for navigable generated scenes.
    reason_zh: 可游走生成场景的标准评分。
