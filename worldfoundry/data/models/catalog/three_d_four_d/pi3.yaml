  publisher_zh: 开源研究发布（仓库未记录正式机构）
  overview: Pi3 (π³) is a feed-forward visual-geometry model that reconstructs 3D scenes, camera trajectories, and point clouds without relying on a fixed reference view — its permutation-equivariant design treats all input views symmetrically. WorldFoundry runs an in-tree point-cloud navigation pipeline for reconstruction and trajectory rendering.
  overview_zh: Pi3（π³）是前馈式视觉几何模型，重建 3D 场景、相机轨迹与点云，且不依赖固定参考视图——其置换等变设计对所有输入视图一视同仁。WorldFoundry 在树内运行点云导航 pipeline，用于重建与轨迹渲染。
  architecture: Per the paper (arXiv 2507.13347), Pi3 predicts affine-invariant camera poses and scale-invariant local pointmaps with a permutation-equivariant transformer, removing the need for a reference-view heuristic. Weights are apache-2.0.
  architecture_zh: 按论文（arXiv 2507.13347），Pi3 用置换等变 Transformer 预测仿射不变的相机位姿与尺度不变的局部点图，摆脱了参考视图启发式。权重为 apache-2.0。
  usage_notes: Stage the upstream Pi3 weights (`yyfz233/Pi3X`) before running reconstruction.
  usage_notes_zh: 运行重建前请先就位上游 Pi3 权重（`yyfz233/Pi3X`）。
