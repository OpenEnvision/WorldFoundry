  usage_notes: Verified end to end in the shared worldfoundry-unified-cu128 environment — a dependable choice for point-cloud navigation pipelines.
  usage_notes_zh: 已在共享 worldfoundry-unified-cu128 环境中端到端验证——点云导航管线的可靠选择。
