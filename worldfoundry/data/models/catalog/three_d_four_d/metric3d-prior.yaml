docs:
  publisher: DJI / Zhejiang University
  publisher_kind: company
  publisher_zh: 大疆创新 / 浙江大学
  overview: 'Metric3D recovers metric-scale depth from a single image by normalizing images into a canonical camera space, which lets one model generalize across cameras. In this catalog it is a verified metric-depth prior: the VIPE SLAM defaults reference it by name through the shared priors factory, and checkpoint-backed inference runs through the geometry-prior contract.'
  overview_zh: Metric3D 通过把图像归一化到规范相机空间，从单张图像恢复米制尺度深度，使单一模型能够跨相机泛化。本 catalog 中它是已验证的米制深度先验：VIPE SLAM 默认配置通过共享先验工厂按名称引用它，checkpoint 加载推理经 geometry-prior 契约运行。
  architecture: Per the upstream publication (ICCV 2023), a canonical-camera transformation resolves the metric ambiguity of single-image depth, and the recorded checkpoint is JUGGHM/Metric3D under a bsd-2-clause license. Registered at base_models/three_dimensions/depth/metric3d.
  architecture_zh: 按上游论文（ICCV 2023），规范相机变换消解了单图深度的米制歧义；记录的 checkpoint 为 JUGGHM/Metric3D，许可 bsd-2-clause。注册于 base_models/three_dimensions/depth/metric3d。
  usage_notes: It is integrated as an independent geometry prior under worldfoundry/base_models and exposed through the shared geometry-prior pipeline/operator contract. Higher-level pipelines (e.g. ViPE) import it from this canonical owner instead of keeping private copies. Runner parity is verified through the shared contract; it is the default metric-depth choice in the VIPE SLAM configuration.
  usage_notes_zh: 它作为独立几何先验集成在 worldfoundry/base_models 下，通过共享的 geometry-prior pipeline/operator 契约对外暴露。上层管线（如 ViPE）从这一规范位置导入它，而不是各自保留私有副本。runner parity 已通过共享契约验证；它是 VIPE SLAM 配置中的默认米制深度选择。
  limitations:
  - Metric accuracy depends on camera-intrinsics quality; wrong intrinsics degrade the scale.
  - Single-image prior; temporal stability on video is out of scope.
  limitations_zh:
  - 米制精度依赖相机内参质量；内参错误会破坏尺度。
  - 单帧先验；视频时序稳定性不在其范围内。
