  usage_notes: Inputs are prompt, image, and native_rows camera control. Model materials retain upstream non-commercial share-alike terms — review before commercial use.
  usage_notes_zh: 输入为提示词、图像与 native_rows 相机控制。模型材料保留上游非商用相同方式共享条款——商用前请先审查。
