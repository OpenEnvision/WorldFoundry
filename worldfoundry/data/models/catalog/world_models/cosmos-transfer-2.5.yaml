integration:
  notes:
  - Transfer 2.5 uses the same native runner, Reason1 conditioner, flow-UniPC scheduler,
    Wan VAE codec, checkpoint loader, and offload policies as Predict 2.5.
  - The VACE network adds only the checkpoint-shaped four-block control branch at base
    layers 0/7/14/21 and 8-modality control embedder; no Diffusers or model-specific
    runner is retained.
