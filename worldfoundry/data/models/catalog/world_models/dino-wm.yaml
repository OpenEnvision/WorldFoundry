id: dino-wm
name: DINO-WM
tasks:
- visual-feature-world-model
- predictive-coding
- robot-world-model
provider: official_repo
source:
  status: open_source
  official_repo_url: https://github.com/gaoyuezhou/dino_wm
official_sources:
  paper: https://arxiv.org/abs/2411.04983
  project_page: https://dino-wm.github.io/
  github:
    url: https://github.com/gaoyuezhou/dino_wm
    revision: 0a9492fa12044b852ae9e001cc74604b79c8bb0c
integration:
  status: integrated
  notes:
  - WorldFoundry vendors the official DINO-WM planning/evaluation route in-tree under synthesis/visual_generation/dino_wm.
  - The WorldFoundry infer entrypoint loads runtime configs from worldfoundry/data/models/runtime/configs/dino_wm/conf.
  - The vendored `dino_wm/env/` simulators are required for official planning runs and are intentionally kept in-tree.
  - The wall_single route completed checkpoint-backed inference with official wall trajectories; other task routes still require their own assets and validation.
runner_parity:
  status: verified_inference_only
  notes:
  - The public wall_single route loaded the released epoch-65 checkpoint, official wall trajectories, and DINOv2 encoder;
    GPU inference completed and produced two fully decodable 26-frame MP4 artifacts with finite result metrics.
  - These small-budget wall runs verify execution only. One target was already within the task's success threshold, while
    a nontrivial target was not solved; neither establishes planning quality.
  - The released pusht and point_maze checkpoints have not been validated with their task datasets and simulators.
runtime_profile: runtime-profile:dino-wm
runner_target: worldfoundry.evals.models.runners.pipeline:WorldFoundryPipelineRunner
pipeline_binding: dino-wm
output_artifacts:
- generated_world
catalog_category: world_models
catalog_scope: World-model catalog entries. Integrated entries expose in-tree WorldFoundry runtimes; blocked
  entries retain upstream provenance without runnable backends.
docs:
  publisher: New York University (NYU)
  publisher_kind: university
  publisher_zh: 纽约大学（NYU）
  overview: 'DINO-WM builds world models on pre-trained DINOv2 visual features instead of pixels: it predicts future patch features and plans robot behavior by optimizing action sequences against a goal feature state — zero-shot planning without reconstruction. WorldFoundry includes the official planning/evaluation route together with the required environment simulators.'
  overview_zh: DINO-WM 在预训练 DINOv2 视觉特征（而非像素）上构建世界模型：预测未来 patch 特征，并通过针对目标特征状态优化动作序列来规划机器人行为——无需重建即可零样本规划。WorldFoundry 内置官方规划/评估路径及所需的 env 仿真器。
  architecture: Per the upstream project, a ViT predictor rolls DINOv2 patch features forward conditioned on actions; planning is model-predictive control in feature space.
  architecture_zh: 按上游项目，ViT 预测器在动作条件下向前滚动 DINOv2 patch 特征；规划是特征空间中的模型预测控制。
  usage_notes: The wall_single planning route requires its released model_latest.pth, a DINOv2 encoder, and DATASET_DIR set to the parent directory containing the complete official wall_single trajectory dataset. These assets are not bundled with WorldFoundry; no external DINO-WM checkout is needed.
  usage_notes_zh: wall_single 规划路径需要发布的 model_latest.pth、DINOv2 编码器，并将 DATASET_DIR 指向包含完整官方 wall_single 轨迹数据集的父目录。这些资源不随 WorldFoundry 分发；无需外部 DINO-WM 检出。
  limitations:
  - Only wall_single has been validated on GPU with released checkpoints; pusht and point_maze are untested.
  - The wall validation runs do not establish planning quality or general task success.
  - The model predicts in feature space; the MP4 is a simulator/planning visualization, not pixel generation.
  limitations_zh:
  - 只有 wall_single 已用发布权重完成 GPU 验证；pusht 和 point_maze 尚未测试。
  - wall 验证运行不能证明规划质量或一般任务成功率。
  - 模型在特征空间中预测；MP4 是仿真/规划可视化，并非像素生成。
