docs:
  publisher: Open-source research release (institution not recorded)
  publisher_kind: lab
  publisher_zh: 开源研究发布（仓库未记录正式机构）
  overview: 'MIRA is a multiplayer interactive world model: several players act in one shared, action-conditioned generated world (paper arXiv 2607.05352). In this catalog the inference-only upstream source is vendored in-tree; execution needs a compatible local checkpoint and a local Rocket Science dataset split containing index.json.'
  overview_zh: MIRA 是多人交互世界模型：多名玩家在同一个动作条件生成世界中行动（论文 arXiv 2607.05352）。本 catalog 中仅推理的上游源码已内置树内；执行需要兼容的本地 checkpoint 与包含 index.json 的本地 Rocket Science 数据集切分。
  architecture: Architecture internals beyond the recorded tasks are not stored in this repository (apache-2.0). Workspace discovery, argument routing, and command generation are covered without loading model weights; a local-checkpoint variant records the Rocket Science rollout task.
  architecture_zh: 除已记录任务外的架构内部细节仓库未存（apache-2.0）。Workspace 发现、参数路由与命令生成的覆盖不需加载模型权重；local-checkpoint variant 记录 Rocket Science 滚动生成任务。
  usage_notes: The public Rocket Science dataset is about 29.24 TB — it is pinned but intentionally never downloaded automatically. Video decoding falls back to PyAV when TorchCodec is ABI-incompatible; output uses the shared WorldFoundry video backend. Training and metric entrypoints are intentionally omitted.
  usage_notes_zh: 公开的 Rocket Science 数据集约 29.24 TB——已固定但有意不自动下载。TorchCodec ABI 不兼容时视频解码回退到 PyAV；输出使用共享的 WorldFoundry 视频后端。训练与指标入口有意省略。
  limitations:
  - Full artifact parity waits on an official-compatible checkpoint and Rocket Science split.
  - The public dataset is ~29.24 TB — plan storage before staging.
  - The publishing institution is not recorded in this repository.
  limitations_zh:
  - 完整产物一致性待官方兼容 checkpoint 与 Rocket Science 切分就位。
  - 公开数据集约 29.24 TB——就位前请规划存储。
  - 发表机构在本仓库中未记录。
  recommended_benchmarks:
  - id: worldmodelbench
    reason: Multiplayer world-rollout quality.
    reason_zh: 多人世界滚动生成质量。
