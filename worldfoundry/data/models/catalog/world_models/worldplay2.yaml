docs:
  publisher: WorldPlay2 team
  publisher_kind: lab
  publisher_zh: WorldPlay2 团队
  overview: WorldPlay2 generates action-controlled world video from an image, with first-person or third-person navigation and chunk-aligned prompt changes.
  overview_zh: WorldPlay2 从图像生成动作可控的世界视频，支持第一或第三人称导航与按块切换提示词。
  architecture: Wan2.2 dual-expert video transformer with six-channel action conditioning, causal memory compression and chunked context attention. WorldPlay2 synthesis extensions reuse shared Wan layers, UMT5, VAE, loading and media output.
  architecture_zh: 基于 Wan2.2 双专家视频 transformer，加入六通道动作条件、因果记忆压缩与按块上下文注意力；WorldPlay2 的 synthesis 扩展复用共享 Wan 层、UMT5、VAE、权重加载与媒体输出。
  usage_notes: Use WorldPlay2Pipeline.from_pretrained with WorldPlay2 expert and Wan2.2 support-asset directories. Fast uses four steps; AR and BI use 40 steps. Action durations count latent frames; total duration and prompt boundaries must align with the selected chunk length.
  usage_notes_zh: 使用 WorldPlay2Pipeline.from_pretrained 加载 WorldPlay2 专家目录与 Wan2.2 支持资产目录。Fast 使用四步，AR 与 BI 使用 40 步。动作时长按 latent 帧计数，总时长及提示词切换边界须与所选块长度对齐。
  limitations:
  - Code and WorldPlay2 weights use CC BY-NC 4.0.
  - Checkpoint-backed GPU generation and full-size output parity remain pending.
  - WorldPlay2-TAE weights have not been released.
  limitations_zh:
  - 代码与 WorldPlay2 权重采用 CC BY-NC 4.0 许可。
  - checkpoint GPU 生成与完整模型输出一致性仍待验证。
  - WorldPlay2-TAE 权重尚未发布。
  recommended_benchmarks:
  - id: worldmodelbench
    reason: Action-controlled world-rollout quality.
    reason_zh: 动作控制的世界滚动生成质量。
  - id: camerabench
    reason: Camera-navigation adherence.
    reason_zh: 相机导航的贴合度。
