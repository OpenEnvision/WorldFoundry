  notes:
  - Reuses the canonical MiniMax-H3 DiT, Qwen3-VL encoder, video/audio VAEs, packed sequence builder, denoise loop, and MP4 writer.
  - Adapts the rank-32 LoRA onto WorldFoundry's fused QKV layout with per-latent mirrored RoPE offsets, segmented token refiner, and directed attention routing.
