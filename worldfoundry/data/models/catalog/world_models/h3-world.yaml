catalog_category: world_models
docs:
  publisher: Tencent / NUS / PolyU
  overview: Interactive action-conditioned world model built on MiniMax-H3. Translates keyboard states into per-latent English instructions bound to each video latent via directed attention routing and a rank-32 LoRA adapter.
  overview_zh: 基于 MiniMax-H3 的交互式动作条件世界模型，将键盘状态转换为逐 latent 英文指令，并通过定向注意力路由与 rank-32 LoRA 适配器绑定到对应视频 latent。
  architecture: Reuses WorldFoundry's canonical MiniMax-H3 33B DiT, Qwen3-VL multimodal encoder, video/audio VAEs, and rectified-flow loop. Adds rank-32 attention LoRA loading with grouped-to-split QKV reordering, mirrored per-latent RoPE offsets, segmented token refinement, and directed FlexAttention/SDPA masking.
  architecture_zh: 复用 WorldFoundry 规范化的 MiniMax-H3 33B DiT、Qwen3-VL 多模态编码器、音视频 VAE 与 rectified-flow 采样循环，并扩展 rank-32 注意力 LoRA（含分组到拆分 QKV 重排）、镜像逐 latent RoPE 偏移、分段 token refiner 与定向 FlexAttention/SDPA 掩码。
  usage_notes: Stage the MiniMax-H3 FL2VA base weights alongside DANNY621/H3-World (step-10000.safetensors). Supply a starting frame, a scene description, and either action_preset (e.g. forward, pan-right-fast), interactions, or explicit per-latent action_script clauses.
  usage_notes_zh: 运行前准备 MiniMax-H3 的 FL2VA 基础权重以及 DANNY621/H3-World（step-10000.safetensors）。提供起始帧图像、场景描述以及 action_preset（如 forward、pan-right-fast）、interactions 或显式逐 latent 的 action_script。
  limitations:
  - Native resolution is 832x480 at 24 fps with 17k+5 frame counts (124, 243, 481) and 32 kHz stereo audio.
  - Checkpoints are subject to the MiniMax H3 Community License Agreement.
  limitations_zh:
  - 原生分辨率为 832x480、24 fps，帧数需满足 17k+5（124、243、481），并附带 32 kHz 立体声音频。
  - 模型权重受 MiniMax H3 Community License Agreement 约束。
