docs:
  publisher: Open-source research release (institution not recorded)
  publisher_kind: lab
  publisher_zh: 开源研究发布（仓库未记录正式机构）
  overview: 'StarWM is a multi-agent world model for StarCraft-style environments: it predicts action-conditioned game video across many interacting units. WorldFoundry includes the official offline inference client; jobs talk to an OpenAI-compatible StarWM endpoint using the official prompt fixture format. The checkpoint is yxzhang2024/StarWM on Hugging Face.'
  overview_zh: StarWM 是面向星际争霸类环境的多智能体世界模型：在大量交互单位下预测动作条件的游戏视频。WorldFoundry 内置官方离线推理客户端；作业通过 OpenAI 兼容的 StarWM 端点交互，使用官方 prompt fixture 格式。checkpoint 为 Hugging Face 上的 yxzhang2024/StarWM。
  architecture: 'The runtime is an endpoint-client design: the route builds the official run_inference_client.py command and validates input_file, mode, and served_model_id/api_model_id before execution.'
  architecture_zh: 运行时为端点-客户端设计：路由构建官方 run_inference_client.py 命令，执行前校验 input_file、mode 与 served_model_id/api_model_id。
  usage_notes: Actual generation requires a running OpenAI-compatible StarWM endpoint; the WorldFoundry route only builds and validates the client command.
  usage_notes_zh: 真实生成需要一个运行中的 OpenAI 兼容 StarWM 端点；WorldFoundry 路由只负责构建并校验客户端命令。
  limitations:
  - Needs an externally served StarWM endpoint; it cannot run standalone.
  limitations_zh:
  - 依赖外部部署的 StarWM 端点；无法独立运行。
  recommended_benchmarks:
  - id: worldmodelbench
    reason: Action-conditioned game-world rollout quality.
    reason_zh: 动作条件游戏世界滚动生成质量。
