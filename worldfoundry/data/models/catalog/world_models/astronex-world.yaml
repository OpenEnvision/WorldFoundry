  publisher_zh: Astronex-Robotics
  overview: Astronex-World exposes causal and bidirectional camera/action-conditioned video inference.
  overview_zh: Astronex-World 支持相机和动作条件下的因果及双向视频推理。
  architecture: Wan2.2 TI2V-5B with PRoPE camera conditioning, 64-dimensional actions and embodiment conditioning. The official
    sampler remains external; no Wan backbone is copied into this integration.
  architecture_zh: 基于 Wan2.2 TI2V-5B，加入 PRoPE 相机条件、64 维动作和 embodiment 条件。调用外部官方采样器，本次集成不复制 Wan 骨干。
  usage_notes: Select mode=causal or bidirectional; supply source_root and checkpoint_dir. execute=True runs inference. latent_frames
    counts generated latent frames, not video frames; causal blocks require (latent_frames + reference_count) % 8 == 0.
  usage_notes_zh: 选择 mode=causal 或 bidirectional，并提供 source_root 和 checkpoint_dir。execute=True 执行推理。latent_frames 为生成潜帧数；因果模式要求
    (latent_frames + reference_count) 能被 8 整除。
  limitations:
  - Official inference command construction is CPU-validated; checkpoint-backed generation remains pending.
  - The released action prediction head is zero initialized; action prediction is not advertised.
  limitations_zh:
  - 当前工作区仅完成 CPU 可执行的检查，GPU 推理和 checkpoint 产物仍待验证。
  recommended_benchmarks: []
