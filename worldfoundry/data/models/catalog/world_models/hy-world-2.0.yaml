catalog_policy:
  checkpoint_rule: Only list checkpoints that were confirmed on official Hugging Face
    model pages. Use the Hugging Face default cache/download behavior at runtime.
  integration_rule: Closed, API-only, or unknown releases stay blocked or planned
    until an official integration surface is available.
  open_source_rule: Only mark open_source when an official GitHub repository or official
    Hugging Face model page was confirmed. Do not infer checkpoint availability from
    papers, demos, or third-party mirrors.
docs:
  publisher: Tencent (Hunyuan)
  publisher_kind: company
  publisher_zh: 腾讯（混元）
  overview: 'HY-World 2.0 is Tencent''s second-generation world stack, recorded here as components: HY-Pano 2.0 panorama generation (supported in-tree), WorldMirror 2.0 reconstruction (verified through the Workspace infer path), and full text/image-to-3D-world generation (open upstream, migration pending in WorldFoundry). The verified reconstruction path exports depth, normals, point cloud, Gaussian splat, cameras, COLMAP files, and RRD scene metadata.'
  overview_zh: HY-World 2.0 是腾讯第二代世界生成栈，此处按组件记录：HY-Pano 2.0 全景生成（树内支持）、 WorldMirror 2.0 重建（已通过 Workspace 推理路径验证），以及完整文/图到 3D 世界生成（上游已开源， WorldFoundry 侧迁移待完成）。已验证的重建路径导出深度、法线、点云、高斯泼溅、相机参数、COLMAP 文件与 RRD 场景元数据。
  architecture: The upstream five-stage world generation chains WorldNav trajectory generation, trajectory rendering, video generation, GS data preparation, and 3DGS composition (traj_generate.py through world_gs_trainer.py) plus a VLM endpoint. WorldFoundry wraps HY-Pano 2.0 and WorldMirror 2.0 in-tree; the remaining stages are not yet migrated.
  architecture_zh: 上游的五阶段世界生成串联 WorldNav 轨迹生成、轨迹渲染、视频生成、GS 数据准备与 3DGS 组合（traj_generate.py 到 world_gs_trainer.py），另需 VLM 端点。WorldFoundry 已树内封装 HY-Pano 2.0 与 WorldMirror 2.0；其余阶段尚未迁移。
  usage_notes: Use the verified WorldMirror 2.0 reconstruction path today; treat full world generation as upstream-only until the five-stage runtime is migrated and verified. The trajectory-render stage is separately cataloged as hyworld-worldgen.
  usage_notes_zh: 当下请使用已验证的 WorldMirror 2.0 重建路径；在五阶段运行时迁移并验证之前，完整世界生成请视为仅上游可用。轨迹渲染阶段单独记录为 hyworld-worldgen 条目。
  limitations:
  - Full text/image-to-3D-world generation is migration-pending in WorldFoundry.
  - The worldgen stages need native extensions and a VLM endpoint.
  limitations_zh:
  - 完整文/图到 3D 世界生成在 WorldFoundry 侧待迁移。
  - worldgen 各阶段需要原生扩展与 VLM 端点。
  recommended_benchmarks:
  - id: worldscore
    reason: Standard scoring for generated explorable worlds.
    reason_zh: 生成可探索世界的标准评分。
