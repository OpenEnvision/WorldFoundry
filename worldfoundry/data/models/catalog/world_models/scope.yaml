integration:
  status: verified
  notes:
  - SCOPE-specific action conditioning is integrated as a canonical Wan network
    variant and assembled with shared Wan encoders, VAE, loaders, and staged execution.
  - Large model weights remain external HuggingFace assets and are injected through
    model_dir/checkpoint_root or SCOPE_MODEL_DIR.
  - The WorldFoundry wrapper runs the in-tree native SCOPE assembly for execute=True
    Workspace jobs.
