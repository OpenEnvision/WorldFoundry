  notes:
  - WorldFoundry registers an executable GR1 image-to-video runtime using the released transformer, T5 encoder, and Wan Diffusers VAE.
  - The launcher accepts an explicit torch-attention compatibility backend for low-resolution checkpoint smoke while retaining the official NATTEN route.
