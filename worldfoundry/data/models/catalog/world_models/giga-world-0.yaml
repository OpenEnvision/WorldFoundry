docs:
  publisher: GigaAI
  publisher_kind: company
  publisher_zh: 极佳科技（GigaAI）
  overview: 'GigaWorld-0 is GigaAI''s open robotics world-model series, with pretrain and GR1-specialized 2B video checkpoints. The integrated GR1 inference route generates video from an initial image and text prompt; it has no structured robot-action input.'
  overview_zh: GigaWorld-0 是极佳科技开源的机器人世界模型系列，包含预训练和 GR1 专用两个 2B 视频 checkpoint。当前接入的 GR1 推理入口根据首帧图像和文本提示生成视频，没有结构化机器人动作输入。
  architecture: Two 2B video checkpoints are recorded — GigaWorld-0-Video-Pretrain-2b and GigaWorld-0-Video-GR1-2b under open-gigaai. Architecture internals beyond the recorded tasks are not stored in this repository.
  architecture_zh: 记录两个 2B 视频 checkpoint——open-gigaai 下的 GigaWorld-0-Video-Pretrain-2b 与 GigaWorld-0-Video-GR1-2b。除已记录任务外的架构内部细节仓库未存。
  usage_notes: Provide an initial image and text prompt with the local GR1, T5 and Wan VAE weights. Set the official frame count and resolution explicitly for evaluation. Structured robot actions are not consumed.
  usage_notes_zh: 提供首帧图像、文本提示以及本地 GR1、T5、Wan VAE 权重；评测时显式设置官方帧数与分辨率。它不消费结构化机器人动作。
  limitations:
  - Execution is checkpoint and task-asset gated.
  limitations_zh:
  - 执行受 checkpoint 与任务资产限制。
  recommended_benchmarks:
  - id: worldarena
    reason: The entry is listed on WorldArena for robot world-model evaluation.
    reason_zh: 该条目已收录于 WorldArena 的机器人世界模型评测。
  - id: ewmbench
    reason: Embodied world-model video prediction quality.
    reason_zh: 具身世界模型视频预测质量。
