integration:
  notes:
  - FastFramesPipeline runs FastFrames-S (1.3B) and FastFrames-L (14B) natively in WorldFoundry, reusing canonical Wan2.1
    normalization, RoPE, sinusoidal embeddings, UMT5-XXL prompt encoding, and MP4 export primitives.
  - Each latent frame runs a two-step causal Wan2.1 DiT (four steps on frame 0), replaces the clean-context DiT pass with
    KVRefinementNetwork, and replaces the Wan2.1 VAE decoder with a causal ConvNeXt PixelDecoder (or BridgedPixelDecoder for 14B).
  - Select FastFrames-S (default) via variant="fastframes-s" / "ff-s" or FastFrames-L via variant="fastframes-l" / "ff-l".
  status: integrated
