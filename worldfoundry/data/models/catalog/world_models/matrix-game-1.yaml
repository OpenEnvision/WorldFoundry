docs:
  publisher: Skywork AI (Kunlun Tech)
  publisher_kind: company
  publisher_zh: 昆仑万维（Skywork AI）
  overview: "Matrix-Game 1.0 is the first generation of Skywork's interactive game world model: from an image and keyboard/mouse-style actions it generates playable game-world video. It has its own model id and runs the official Matrix-Game 1 runtime, not the Matrix-Game 2 one."
  overview_zh: Matrix-Game 1.0 是昆仑万维交互式游戏世界模型的第一代：从一张图与键鼠式动作生成可交互的游戏世界视频。它有独立的模型 id，运行官方 Matrix-Game 1 运行时，而不是 Matrix-Game 2 的运行时。
  architecture: The Skywork--Matrix-Game checkpoint set comprises seven DiT shards, four text_encoder_i2v shards, a VAE weight, configs, and assets.
  architecture_zh: Skywork--Matrix-Game checkpoint 组合包括七个 DiT 分片、四个 text_encoder_i2v 分片、一个 VAE 权重、配置与资产。
  usage_notes: Matrix-Game-1 uses torch 2.5.1+cu124; prefer the worldfoundry-unified-cu128
    environment on modern NVIDIA hosts. For newer quality and verified runners see
    matrix-game-2 and matrix-game-3.
  usage_notes_zh: Matrix-Game-1 使用 torch 2.5.1+cu124；现代 NVIDIA 主机上建议用 worldfoundry-unified-cu128
    环境。追求更新质量与已验证 runner 请见 matrix-game-2 与 matrix-game-3。
  limitations:
  - 'First-generation model: quality and control trail Matrix-Game 2.0/3.0.'
  - Large multi-shard checkpoint set must be staged locally.
  limitations_zh:
  - 第一代模型：质量与控制弱于 Matrix-Game 2.0/3.0。
  - 需本地就位多分片的大型 checkpoint 组合。
  recommended_benchmarks:
  - id: worldmodelbench
    reason: Action-conditioned game-world rollout quality.
    reason_zh: 动作条件游戏世界滚动生成质量。
