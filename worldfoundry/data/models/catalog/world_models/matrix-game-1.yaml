evidence:
  notes:
  - Runtime profile and conda env are maintained under runtime_profiles/world.
  - Studio/API dispatch is wired through the in-tree official runner with the
    unified environment profile.
  - Official-demo visual parity remains pending. The generic Studio fixture generated
    noisy visuals; WorldFoundry now stages an in-domain GameWorldScore initial image
    under worldfoundry/data/test_cases/matrix-game-1/official_initial_image for the
    next Studio validation pass.
  - The 65-frame official default hit single-A100 80GB OOM in the unified env and needs an accepted memory strategy before
    promotion.
