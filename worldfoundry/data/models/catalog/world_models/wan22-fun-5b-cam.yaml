  overview: 'Wan2.2-Fun 5B Control Camera brings the VideoX-Fun camera-control pathway to the Wan2.2 generation at 5B scale: image-to-video steered by explicit camera poses, with an upstream native profile of 121 frames at 24 FPS. WorldFoundry vendors VideoX-Fun in-tree (revision 403f1f7b) and wires a dedicated route for alibaba-pai/Wan2.2-Fun-5B-Control-Camera under Apache-2.0.'
  overview_zh: Wan2.2-Fun 5B Control Camera 将 VideoX-Fun 相机控制通路带入 Wan2.2 世代的 5B 规模：由显式相机位姿操控的图生视频，上游原生规格为 121 帧、24 FPS。WorldFoundry 将 VideoX-Fun 内置树内（revision 403f1f7b），并为 alibaba-pai/Wan2.2-Fun-5B-Control-Camera 接通专用路由，Apache-2.0 许可。
  architecture: A 5B-parameter Wan2.2 diffusion transformer with the VideoX-Fun Control-Camera conditioning pathway. Further internals are not recorded in this repository.
  architecture_zh: 5B 参数的 Wan2.2 扩散 Transformer，叠加 VideoX-Fun Control-Camera 条件通路。更多内部细节仓库未记录。
  usage_notes: The upstream native profile is 121 frames at 24 FPS; WRBench request values remain explicit, so set frame count and FPS deliberately rather than relying on defaults. Runner parity is pending.
  usage_notes_zh: 上游原生规格为 121 帧、24 FPS；WRBench 请求值保持显式，请主动设置帧数与 FPS 而非依赖默认。 runner parity 仍为 pending。
  limitations:
  - Runner parity is pending; the GPU-validated reference in this family is wan21-fun-1p3b-cam.
  limitations_zh:
  - runner parity 为 pending；本家族的 GPU 验证参照是 wan21-fun-1p3b-cam。
  recommended_benchmarks:
  - id: camerabench
    reason: Camera-pose adherence for controlled i2v generation.
    reason_zh: 受控图生视频的相机位姿跟随。
  - id: wrbench
    reason: Native 121-frame/24FPS profile suits WRBench-style requests.
    reason_zh: 原生 121 帧/24FPS 规格适配 WRBench 式请求。
