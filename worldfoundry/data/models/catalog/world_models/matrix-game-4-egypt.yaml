docs:
  publisher: Skywork AI
  publisher_kind: company
  overview: A low-poly game video is re-rendered as an Ancient Egypt scene by a causal video diffusion model. The native model can run without the optional upstream game engine.
  overview_zh: 因果视频扩散模型把低模游戏视频重渲染为古埃及场景。原生模型可以独立于可选的上游游戏引擎运行。
  modalities:
    inputs: [video, text]
    outputs: [video]
  limitations:
  - Accepted-reference replay, gameplay-quality validation and measured throughput remain pending.
  limitations_zh:
  - accepted-reference 回放、游戏画面质量及实测吞吐量仍待验证。
notes:
- Native two-step offline Wan VAE route; fixed 864x480, guidance scale 1, one prompt per clip.
- A separately encoded KV-only sink is not an output frame and does not initialize the control VAE history.
- Input FPS is retained; the last frame is repeated to 4n+1 internally, then cropped from the exported output.
- The optional pinned game submodule is not imported by Python inference and is not packaged in the wheel.
- Released-weight public-loader comparisons on H100 match upstream exactly for 5-frame repeated-sink and 100-frame synthetic-pan inputs at 864x480.
