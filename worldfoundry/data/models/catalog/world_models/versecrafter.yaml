runner_parity:
  status: verified_inference_only
  notes:
  - The public pipeline generated 17 decodable 832x480 frames at 30 steps with local
    VerseCrafter, Wan2.1-14B, and MoGe-v2 weights after the default camera-basis fix.
  - Late disocclusion artifacts remain visible; precise camera-path adherence and
    official output parity have not been measured.
catalog_category: world_models
docs:
  publisher: Tencent ARC Lab
  publisher_kind: company
  publisher_zh: 腾讯 ARC 实验室
  overview: 'VerseCrafter from Tencent ARC is a camera-controlled image-to-video world model built on 4D control: a geometry-aware rendering stage produces 4D control signals that guide the diffusion stage along the requested camera path. WorldFoundry vendors the official source (revision 008693b5) plus the exact VideoX-Fun submodule (revision 246a0e3a) in-tree, with the TencentARC/VerseCrafter checkpoint reference.'
  overview_zh: 腾讯 ARC 的 VerseCrafter 是基于 4D 控制的相机可控图生视频世界模型：几何感知渲染阶段产出 4D 控制信号，引导扩散阶段沿指定相机路径生成。WorldFoundry 将官方源码（revision 008693b5）与精确的 VideoX-Fun 子模块（revision 246a0e3a）内置树内，checkpoint 引用为 TencentARC/VerseCrafter。
  architecture: 'Two stages are wired in-tree: camera-only 4D-control rendering followed by the diffusion stage. The diffusion backbone comes from the pinned VideoX-Fun submodule. Further architecture internals are not recorded in this repository.'
  architecture_zh: 树内接通两个阶段：仅相机的 4D 控制渲染，随后是扩散阶段。扩散骨干来自锁定版本的 VideoX-Fun 子模块。更多架构内部细节仓库未记录。
  usage_notes: 'Note the license before any deployment: upstream is research-only, non-commercial, and excludes intended EU use. A local checkpoint-backed short video has been verified, with visible late-frame artifacts; official output parity remains unmeasured.'
  usage_notes_zh: 部署前务必注意许可：上游为仅研究、非商用，且排除面向欧盟的使用。本地真实权重短视频已验证，但后段有可见伪影；尚未测量与官方输出的一致性。
  limitations:
  - Research-only, non-commercial license that excludes intended EU use.
  - The short GPU run has late-frame disocclusion artifacts; camera-path accuracy and official output parity remain unmeasured.
  limitations_zh:
  - 仅研究、非商用许可，且排除面向欧盟的使用。
  - 短片 GPU 运行后段存在遮挡解除伪影；相机路径精度和官方输出一致性尚未测量。
  recommended_benchmarks:
  - id: camerabench
    reason: Camera-path adherence for 4D-controlled generation.
    reason_zh: 4D 控制生成的相机路径跟随。
