docs:
  publisher: New York University (VisionX)
  publisher_kind: university
  publisher_zh: 纽约大学（VisionX 实验室）
  overview: 'Solaris is a multi-agent interactive video world model from NYU''s VisionX group (paper arXiv 2602.22208): multiple agents act inside one generated world. In this catalog the runner is verified — the inference-only runtime is vendored in-tree and consumes the official Orbax checkpoint (nyu-visionx/solaris) and eval datasets from Hugging Face or a local mirror.'
  overview_zh: Solaris 是纽约大学 VisionX 组的多智能体交互视频世界模型（论文 arXiv 2602.22208）：多个智能体在同一个生成世界中行动。本 catalog 中 runner 已验证——仅推理运行时内置树内，消费官方 Orbax checkpoint（nyu-visionx/solaris）与来自 Hugging Face 或本地镜像的评估数据集。
  architecture: The runtime is JAX/Orbax-based per the recorded checkpoint format; internals beyond the recorded tasks are not stored here. The upstream license is flagged for manual review.
  architecture_zh: 按记录的 checkpoint 格式，运行时基于 JAX/Orbax；除已记录任务外的内部细节此处未存。上游许可已标记需人工审查。
  usage_notes: Inference launches one sample per visible GPU — eval_num_samples must be a multiple of the visible GPU count. Official weights and eval datasets resolve from HF or a same-layout local mirror.
  usage_notes_zh: 推理按每张可见 GPU 启动一个样本——eval_num_samples 必须是可见 GPU 数的整数倍。官方权重与评估数据集从 HF 或同布局本地镜像解析。
  limitations:
  - Upstream license is under manual review.
  - eval_num_samples must match the GPU-count multiple constraint.
  limitations_zh:
  - 上游许可在人工审查中。
  - eval_num_samples 须满足 GPU 数整数倍约束。
  recommended_benchmarks:
  - id: worldmodelbench
    reason: Multi-agent world-rollout quality.
    reason_zh: 多智能体世界滚动生成质量。
