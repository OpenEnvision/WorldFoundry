runner_parity:
  status: verified_inference_only
  notes:
  - A 2026-09-24 local single-GPU run generated 81/81 decodable 480x480 frames
    at 35 denoising steps from one image and synthetic two-player forward actions.
  - The out-of-domain cat image stays nearly static; game-domain action fidelity,
    realistic dynamics, and official dataset parity are not verified.
