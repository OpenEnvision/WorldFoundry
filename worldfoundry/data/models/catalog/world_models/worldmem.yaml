docs:
  publisher: Open-source research release (institution not recorded)
  publisher_kind: lab
  publisher_zh: 开源研究发布（仓库未记录正式机构）
  overview: 'WorldMem targets the core weakness of interactive world models — forgetting: it equips a Minecraft-style interactive world model with an explicit memory so revisited places stay consistent over long horizons (paper: arXiv 2504.12369). WorldFoundry registers the route in-tree; upstream inference model and data assets are runtime-gated.'
  overview_zh: WorldMem 针对交互式世界模型的核心弱点——遗忘：为 Minecraft 式交互世界模型加装显式记忆，使重访地点在长时程下保持一致（论文：arXiv 2504.12369）。WorldFoundry 树内注册了路由；上游推理模型与数据资产为运行时门控。
  architecture: 'The recorded design theme is long-term consistency via memory: past observations are stored and retrieved to condition future rollouts. Architecture internals beyond the official repository and paper pointers are not recorded in this repository.'
  architecture_zh: 仓库记录的设计主题是基于记忆的长期一致性：存储并检索历史观测以条件化后续滚动生成。官方仓库与论文指针之外的架构内部细节仓库未记录。
  usage_notes: Config resolution and pipeline import are expected to pass; real generation emits a runtime plan until required checkpoints/assets are staged. Missing assets are reported by the plan and are not treated as catalog blockers.
  usage_notes_zh: 配置解析与 pipeline 导入预期可通过；在所需 checkpoint/资产就位前，真实生成会输出运行时计划。缺失资产由计划报告，不视为 catalog 阻塞。
  limitations:
  - Upstream inference model/data assets are runtime-gated; no GPU validation is recorded in this repository.
  limitations_zh:
  - 上游推理模型/数据资产为运行时门控；仓库未记录 GPU 验证。
  recommended_benchmarks:
  - id: memobench
    reason: Long-term memory consistency of world rollouts.
    reason_zh: 世界滚动生成的长期记忆一致性。
  - id: worldmodelbench
    reason: Action-conditioned interactive rollout quality.
    reason_zh: 动作条件交互滚动生成质量。
