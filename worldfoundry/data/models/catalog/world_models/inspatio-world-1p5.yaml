integration:
  status: verified
  notes:
  - Native inference reuses the existing causal Wan graph, UMT5 encoder, Wan VAE, causal sampler and in-tree DA3.
  - Prepared scenes support one image, four images or video; target poses use row-major OpenCV world-to-camera matrices.
  - The released checkpoint uses resolution 480x832, three latent frames per block and four denoising calls.
  - Original InSpatio World remains a separate model and checkpoint.
runner_parity:
  status: verified
  upstream_revision: dd3561f544053fe22d739b6b2f8461c9c97bf8cb
  test: tests/manual/inspatio_v15_regression.py
  notes:
  - Exact BF16/SDPA parity on two causal blocks for prepared single-image, four-image and 21-frame video scenes.
  - Direct single-image, four-image and video inputs generated successfully with in-tree DA3; replaying the estimated geometry through upstream also matched latents and decoded frames exactly.
  - Direct replay verifies generation from the same geometry; it does not independently certify DA3 reconstruction quality or long-horizon generation.
