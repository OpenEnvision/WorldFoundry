integration:
  status: integrated
  notes:
  - Cosmos Predict1/GEN3C is assembled through the same native denoiser, T5 conditioner,
    latent initializer, Karras x0 AB2 scheduler, codec, loader, and standard runner contracts as other models.
  - Named camera trajectories, MoGe depth, and RGBD forward warping are native preprocessing
    inside the latent-initializer role; callers may also provide pre-rendered 3D-cache tensors.
  - The previous official-runtime demo evidence does not establish parity for the new native path.
runner_target: worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner
pipeline_binding: gen3c
runner_parity:
  status: pending
  notes:
  - Transformer and T5 checkpoint structure, native camera geometry, registry, and scheduler
    contracts pass local validation; full-resolution native GPU output parity remains pending.
catalog_category: world_models
