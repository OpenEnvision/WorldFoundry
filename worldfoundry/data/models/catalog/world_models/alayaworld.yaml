docs:
  publisher: Open-source research release (institution not recorded)
  publisher_kind: lab
  publisher_zh: 开源研究发布（仓库未记录正式机构）
  overview: 'AlayaWorld is a camera-controlled interactive world model for long video: from an image it rolls out world video autoregressively with action control and DA3-backed spatial memory. In this catalog it is checkpoint/GPU validated — the released 33.6 GB merged checkpoint passed exact size and SHA-256 validation, and the unified in-tree pipeline generated the official case1 first chunk (32 H.264 frames at 544x960, 24 fps) on an A100 with spatial memory enabled.'
  overview_zh: AlayaWorld 是面向长视频的相机可控交互式世界模型：从一张图出发，带动作控制与 DA3 空间记忆自回归滚动生成世界视频。本 catalog 中它已通过 checkpoint/GPU 验证——发布的 33.6 GB 合并 checkpoint 通过精确字节数与 SHA-256 校验，统一树内 pipeline 在 A100 上开启 DA3 空间记忆生成官方 case1 首个 chunk （544x960、24 fps 的 32 帧 H.264）。
  architecture: The runtime is a thin extension of WorldFoundry's canonical in-tree LTX-2.3 model — Transformer, VAE, Gemma connector, RoPE, patchifier, attention dispatcher, and distributed helpers are all reused; Alaya-specific tensors map only to action AdaLN and the temporal-history encoder. Spatial memory reuses the in-tree Depth Anything 3 model (paper arXiv 2607.06291).
  architecture_zh: 运行时是 WorldFoundry 规范树内 LTX-2.3 模型的轻量扩展——Transformer、VAE、Gemma 连接器、RoPE、patchifier、注意力分发器与分布式辅助全部复用；Alaya 专属张量仅映射到动作 AdaLN 与时间历史编码器。空间记忆复用树内 Depth Anything 3 模型（论文 arXiv 2607.06291）。
  usage_notes: Attention dispatch is capability-based; multi-GPU Ulysses context parallelism uses WorldFoundry core collectives. Multi-rank Ulysses tensor parity is validated, but a true NCCL multi-GPU artifact run remains pending multi-GPU availability.
  usage_notes_zh: 注意力分发按硬件能力选择；多卡 Ulysses 上下文并行使用 WorldFoundry 核心集合通信。多 rank Ulysses 张量一致性已验证，但真正的 NCCL 多卡产物运行仍待多 GPU 环境。
  limitations:
  - The 33.6 GB merged checkpoint requires substantial disk and GPU memory.
  - True multi-GPU artifact validation is pending; single-A100 evidence covers the first chunk only.
  - The publishing institution is not recorded in this repository.
  limitations_zh:
  - 33.6 GB 合并 checkpoint 需要可观的磁盘与显存。
  - 真正的多卡产物验证待完成；单 A100 证据仅覆盖首个 chunk。
  - 发表机构在本仓库中未记录。
  recommended_benchmarks:
