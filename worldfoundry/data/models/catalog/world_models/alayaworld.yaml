    reason: Camera-control quality of interactive rollouts.
    reason_zh: 交互滚动生成的相机控制质量。
  - id: memobench
    reason: Long-horizon spatial-memory consistency evaluation.
    reason_zh: 长时程空间记忆一致性评测。
