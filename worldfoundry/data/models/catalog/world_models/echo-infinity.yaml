  open_source_rule: Source code was integrated from the local upstream checkout.
docs:
  publisher: JD.com (Joy Future Academy)
  publisher_kind: company
  publisher_zh: 京东（Joy Future Academy）
  overview: 'Echo-Infinity is JD''s autoregressive long-video generator: text in, arbitrarily long video out, generated block by block. In this catalog the inference path is vendored in-tree as an infer-only runtime; full parity waits on local Echo-Infinity and Wan2.1 weights staged under WORLDFOUNDRY_CKPT_DIR.'
  overview_zh: Echo-Infinity 是京东的自回归长视频生成器：输入文本，逐块生成任意长度的视频。本 catalog 中其推理路径以仅推理运行时形式内置树内；完整一致性待本地 Echo-Infinity 与 Wan2.1 权重就位于 WORLDFOUNDRY_CKPT_DIR。
  architecture: The recorded structure is a Wan2.1-based autoregressive text-to-video design from the same JD team as Echo-Memory. Training, prompt datasets, demo scripts, and checkpoint download helpers are intentionally not packaged; weights are never tracked in git.
  architecture_zh: 记录的结构为基于 Wan2.1 的自回归文生视频设计，与 Echo-Memory 出自同一京东团队。训练、提示词数据集、demo 脚本与 checkpoint 下载辅助有意不打包；权重绝不入 git。
  usage_notes: Runtime assets are local paths under WORLDFOUNDRY_CKPT_DIR — stage Echo-Infinity plus Wan2.1 weights there before running. Full GPU parity is pending.
  usage_notes_zh: 运行时资产为 WORLDFOUNDRY_CKPT_DIR 下的本地路径——运行前请把 Echo-Infinity 与 Wan2.1 权重就位于该目录。完整 GPU 一致性待验证。
  limitations:
  - Full parity is pending staged local weights.
  - 'Research-scale backbone: expect research-preview visual quality.'
  limitations_zh:
  - 完整一致性待本地权重就位。
  - 研究规模基座：视觉质量属研究预览级。
  recommended_benchmarks:
  - id: vbench
    reason: Video quality evaluation for long text-to-video generation.
    reason_zh: 长文生视频的质量评测。
  - id: chronomagic-bench
    reason: Long-horizon temporal coherence evaluation.
    reason_zh: 长时程时间连贯性评测。
