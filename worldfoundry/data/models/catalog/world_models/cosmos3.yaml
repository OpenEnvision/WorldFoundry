docs:
  publisher: NVIDIA
  publisher_kind: company
  publisher_zh: 英伟达（NVIDIA）
  overview: 'Cosmos3 is the newest, broadest Cosmos generation recorded here: one joint-modality model covering text-to-image/video, image/video-to-video, synchronized sound, and structured action inference (policy, forward and inverse dynamics), in Nano and Super variants. In this catalog it runs through the shared loader, joint-modality runner, native Karras flow-UniPC scheduler, shared Wan VAE38, and an inference-only AVAE sound decoder.'
  overview_zh: Cosmos3 是此处记录的最新、覆盖面最广的 Cosmos 世代：单一联合模态模型覆盖文生图/视频、图/视频到视频、同步声音，以及结构化动作推断（策略、正向与逆向动力学），含 Nano 与 Super 两个 variant。本 catalog 中它经共享加载器、联合模态 runner、原生 Karras flow-UniPC 调度器、共享 Wan VAE38 与仅推理的 AVAE 声音解码器运行。
  architecture: Nano structural checks match 814 transformer, 196 VAE, and 182 AVAE checkpoint tensors, and the 35-step schedule matches the official scheduler numerically. Guardrails and reasoner/serving stacks are orchestration extensions, intentionally outside this infer-only recipe.
  architecture_zh: Nano 结构检查匹配 814 个 transformer、196 个 VAE 与 182 个 AVAE checkpoint 张量， 35 步调度与官方调度器数值一致。Guardrail 与 reasoner/serving 栈是编排扩展，有意置于本仅推理配方之外。
  usage_notes: Base selection routes to Nano; pick the cosmos3-super variant for the Super checkpoint. Current-revision evidence requires the exact variant SHA — the prepare script emits a structured checkpoint report and pinned snapshot model-ref so an older local directory is not silently described as current. End-to-end GPU output parity must be rerun for this native path.
  usage_notes_zh: 基础选择路由到 Nano；需要 Super checkpoint 请选 cosmos3-super variant。当前版本证据要求确切的 variant SHA——准备脚本输出结构化 checkpoint 报告与固定 snapshot model-ref，避免把旧的本地目录误当作当前版本。端到端 GPU 输出一致性需要在此原生路径上重跑。
  limitations:
  - End-to-end GPU output parity is pending for the native path; earlier backend evidence is historical only.
  - Reasoner, training, and vLLM serving workflows are outside this infer-only integration.
  limitations_zh:
  - 原生路径的端到端 GPU 输出一致性待验证；早期后端证据仅具历史意义。
  - Reasoner、训练与 vLLM serving 工作流不在本仅推理集成范围内。
  recommended_benchmarks:
  - id: worldmodelbench
    reason: World-generation quality across conditions.
    reason_zh: 各条件下世界生成质量评测。
  - id: physics-iq
    reason: Physical plausibility of generated world video.
    reason_zh: 生成世界视频的物理合理性。
