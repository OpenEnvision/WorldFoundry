docs:
  publisher: NVIDIA
  publisher_kind: company
  publisher_zh: 英伟达（NVIDIA）
  overview: DreamDojo predicts robot-view video from an initial image and normalized robot actions. WorldFoundry integrates the offline 2B GR-1 post-trained teacher and a separate low-step causal student route through native Cosmos components.
  overview_zh: DreamDojo 从初始图像与归一化机器人动作预测机器人视角视频。WorldFoundry 通过原生 Cosmos 组件接入离线 2B GR-1 后训练 teacher 与独立低步数因果学生入口。
  architecture: The action-conditioned Cosmos DiT groups four 384-dimensional actions per future latent frame and adds their projections to timestep and AdaLN embeddings. Reason1 text conditioning and the Wan codec are shared. The teacher uses UniPC; the causal student uses clean KV prefill and one to four TrigFlow steps.
  architecture_zh: 动作条件 Cosmos DiT 为每个后续潜帧组合四个 384 维动作，将投影注入时间步与 AdaLN embedding。Reason1 文本条件与 Wan 编解码共享。Teacher 使用 UniPC，因果学生使用干净 KV 预填充与一至四步 TrigFlow 采样。
  usage_notes: Supply one initial image, complete 12-action chunks in the normalized 384-dimensional space, the converted EMA checkpoint, Cosmos video tokenizer, and Reason1 text weights or explicit precomputed embeddings. Each chunk generates 13 frames; longer sequences reuse the final generated frame.
  usage_notes_zh: 提供一幅初始图像、归一化 384 维空间中的完整 12 步动作块、转换后的 EMA 权重、Cosmos 视频 tokenizer，以及 Reason1 文本权重或显式预计算 embedding。每块生成 13 帧，较长序列复用上一块的最终生成帧。
  limitations:
  - Official numerical parity and robot-task quality are pending validation.
  - Distilled inference uses dreamdojo-student with explicit student weights; the teacher checkpoint is not interchangeable. Other model scales are not supported.
  limitations_zh:
  - 官方数值一致性与机器人任务质量尚待验证。
  - 蒸馏推理通过 dreamdojo-student 使用显式学生权重，不能与 teacher 权重互换。暂不支持其他模型规模。
  recommended_benchmarks:
  - id: ewmbench
    reason: Robot-video prediction with explicit action conditioning.
    reason_zh: 显式动作条件下的机器人视频预测。
