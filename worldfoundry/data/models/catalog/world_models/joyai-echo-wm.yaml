docs:
  publisher: JD.com (JoyAI / Echo Team)
  publisher_kind: company
  publisher_zh: 京东（JoyAI / Echo 团队）
  overview: Echo-WM is an omnimodal world model that jointly evolves video, environmental sound, music, and speech under continuous navigation. Base generates about ten seconds; Flash Preview uses four denoising steps and bounded sink-plus-FIFO caches for autoregressive rollout.
  overview_zh: Echo-WM 是在连续导航控制下联合演化视频、环境音、音乐与语音的全模态世界模型。Base 生成约十秒内容；Flash Preview 使用四步去噪与有界 sink-plus-FIFO 缓存进行自回归滚动。
  architecture: Both public variants use an LTX-2.3 audio-visual backbone with UCPE camera conditioning. Base is bidirectional with separate video/audio CFG, while Flash distills guidance with DMD and maintains bounded video, audio, cross-modal, and camera-attention caches.
  architecture_zh: 两个公开变体均使用带 UCPE 相机条件的 LTX-2.3 音视频骨干。Base 为双向模型并分别使用视频/音频 CFG；Flash 以 DMD 蒸馏 guidance，并维护有界的视频、音频、跨模态及相机注意力缓存。
  usage_notes: Supply a first-frame image, prompt, and Action DSL such as w-60,a-60. Select variant=base or variant=flash at load time. The official source checkout, dedicated CUDA environment, Echo checkpoint, and gated unquantized Gemma encoder must be staged before execute=True.
  usage_notes_zh: 需提供首帧图像、提示词与形如 w-60,a-60 的 Action DSL。加载时选择 variant=base 或 variant=flash。执行 execute=True 前必须准备官方源码检出、专用 CUDA 环境、Echo checkpoint 与受限访问的未量化 Gemma 编码器。
  limitations:
  - The upstream release is marked for academic research and non-commercial use and remains subject to the LTX-2 Community License.
  - Echo-WM Base expects a six-field prompt; Flash accepts the released free-form example captions.
  - Flash Preview is a short-horizon release; the upstream long-horizon checkpoint and online streaming demo are not yet released.
  - GPU artifact and visual parity have not been validated in this CPU-only workspace.
  limitations_zh:
  - 上游版本标注为学术研究与非商业用途，并受 LTX-2 Community License 约束。
  - Echo-WM Base 要求六字段提示词；Flash 可接受公开示例中的自由文本描述。
  - Flash Preview 为短时程版本；上游长时程 checkpoint 与在线流式 demo 尚未发布。
  - 当前纯 CPU workspace 尚未验证 GPU 产物与视觉一致性。
  recommended_benchmarks:
  - id: camerabench
    reason: Camera and navigation action adherence.
    reason_zh: 相机与导航动作遵循度。
  - id: worldmodelbench
    reason: General action-conditioned world-rollout quality.
    reason_zh: 通用动作条件世界滚动生成质量。
  - id: wbench
    reason: The upstream Flash examples use WBench camera-control cases.
    reason_zh: 上游 Flash 示例采用 WBench 相机控制案例。
