  publisher_zh: seedleap
  overview: Zing-0.5 generates video with frame-aligned keyboard control and prompt switching.
  overview_zh: Zing-0.5 支持按帧键盘控制和提示词切换的视频生成。
  architecture: Native Wan2.2 TI2V-5B layers, UMT5, VAE38 and attention are reused. Only the keyboard convolution and prompt-switching
    causal cache are model-specific.
  architecture_zh: 复用原生 Wan2.2 TI2V-5B 层、UMT5、VAE38 和注意力实现，新增键盘卷积和支持提示词切换的因果缓存。
  usage_notes: Use ZingPipeline.from_pretrained(checkpoint_dir). num_frames includes the optional reference and must be 1+4*N;
    height/width are multiples of 32. Keyboard controls contain N-1 rows of eight values for a total N-frame result.
  usage_notes_zh: 通过 ZingPipeline.from_pretrained 加载。num_frames 包含可选参考帧，必须为 1+4*N；宽高为 32 的倍数。总长 N 帧时键盘控制为 N-1 行、每行八个值。
  limitations:
  - Tiny CPU transformer state-dict and FP32/BF16 rollout parity checked against upstream, including eviction and prompt switches.
  - Checkpoint-backed GPU generation and native auxiliary-model parity are pending.
  limitations_zh:
  - 当前工作区仅完成 CPU 可执行的检查，GPU 推理和 checkpoint 产物仍待验证。
