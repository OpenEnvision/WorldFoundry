integration:
  status: integrated
  notes:
  - Revision-pinned inference behavior is integrated through the canonical NativeDiffusionPipeline; no DiffSynth Matrix pipeline remains.
  - This model ID is permanently bound to third-person.safetensors; its checkpoint has four subject-reference embedding slots and the released runtime accepts at most two references per request.
  - Checkpoints remain external assets; the shared resolver prefers staged local files and can materialize missing Hub files.
  - The DA3NESTED-GIANT-LARGE-1.1 dependency is CC-BY-NC-4.0; users must follow its separate non-commercial checkpoint license.
native_diffusion:
  recipe_id: matrix-game-3.5-third-person
  status: assembly_and_checkpoint_structure_verified
  strategy: standard
  components:
  - conditioner
  - latent_initializer
  - scheduler
  - denoiser
  - decoder
  checkpoint_key_validation:
    dit: 829
    text_encoder: 242
    vae: 196
  subject_reference_embedding_capacity: 4
  artifact_parity: pending_after_native_cutover
  notes: Mosaic, PRoPE, and subject memory are denoiser conditions; loading, scheduling, CFG, and execution are shared infrastructure.
runner_parity:
  status: pending_default_25_step_and_official_sample_parity
  notes:
  - CPU contract validation covers model identity, asset resolution, camera NPZ validation, command construction, subject-reference wiring, and result normalization.
  - On 2026-07-20, the pinned third-person checkpoint and one protagonist reference completed a one-step, one-block A100 80GB smoke run and exported 85 non-empty 1280x704 frames at 16 fps (sha256 5fc946910e815d8e5989fb4f843901880c227aec8b32cf56afb27df5083901b6).
  - The smoke run validates strict checkpoint loading, subject-reference installation, Mosaic rollout, decoding, and result materialization only.
  - The recorded A100 artifact predates the final NativeDiffusionPipeline cutover and must be regenerated before native artifact parity can be claimed.
  - A default 25-step third-person run, reproduction against an upstream official sample, and benchmark scoring remain pending.
