docs:
  publisher: Shengshu Technology
  publisher_kind: company
  publisher_zh: 生数科技（Shengshu AI）
  overview: minWM HY Action2V generates camera-controlled video from a prompt, image and trajectory on a HunyuanVideo-1.5
    base, using shared WorldFoundry model components.
  overview_zh: minWM HY Action2V 基于 HunyuanVideo-1.5，复用 WorldFoundry 共享模型组件，从提示词、图像和轨迹生成相机可控视频。
  architecture: The inference-only camera transformer preserves upstream PRoPE and autoregressive caches. Shared
    layers, VAE and encoders avoid a dependency on the removed WorldPlay runtime.
  architecture_zh: 仅推理的相机 Transformer 保留上游 PRoPE 和自回归缓存，复用基础层、VAE 与编码器，无需缺失的 WorldPlay 运行时。
  usage_notes: Stage HY15/Action2V/dmd plus the HunyuanVideo-1.5 encoders and VAE. The public pipeline uses camera-conditioned
    four-step autoregressive inference and spatially tiled VAE decoding.
  usage_notes_zh: 就位 HY15/Action2V/dmd 及 HunyuanVideo-1.5 的编码器、VAE。公开入口使用相机条件四步自回归推理和 VAE 空间分块解码。
  limitations:
  - GPU validated on one H100 with camera conditioning; non-camera modes are not supported by this public runtime.
  - HY15-derived files retain Tencent Hunyuan license terms; see the included licenses and provenance.
  - Stage only the required checkpoint subset.
  limitations_zh:
  - 已验证单张 H100 的相机条件推理；公开运行时不支持无相机条件模式。
  - HY15 衍生文件保留腾讯混元许可条款，见附带许可与来源说明。
  - 仅需就位必要权重子集。
  recommended_benchmarks:
  - id: camerabench
    reason: Camera/motion-trajectory adherence.
    reason_zh: 相机/运动轨迹贴合度。
