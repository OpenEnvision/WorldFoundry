integration:
  notes:
  - Predict 2.5 is assembled from the canonical native denoiser, conditioner, latent
    initializer, scheduler, decoder, loader, and offload roles without Diffusers.
  - Official 2B and 14B EMA transformer structures match 569/569 and 729/729 tensors;
    Reason1 language weights match 338/338 and the shared Wan VAE matches 194/194.
