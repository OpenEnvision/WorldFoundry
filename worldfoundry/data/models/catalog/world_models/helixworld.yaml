  overview: HelixWorld Preview v1 generates camera-controlled video and spatial audio together from one image and three scene descriptions.
  overview_zh: HelixWorld Preview v1 从一张图像及视觉、声音、联合场景描述生成相机可控视频与空间音频。
  architecture: LTX-2.3 joint audio/video transformer with action timestep embeddings, camera PRoPE, four-step stochastic sampling and bounded clean-context replay.
  architecture_zh: 基于 LTX-2.3 联合音视频 transformer，加入动作时间步嵌入、相机 PRoPE、四步随机采样与有界历史上下文重放。
  limitations:
  - Full-checkpoint CUDA output parity has not been validated.
  - Preview inference is released; full-model training code and the technical report are forthcoming.
  limitations_zh:
