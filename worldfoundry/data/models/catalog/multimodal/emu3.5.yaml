docs:
  publisher: Beijing Academy of Artificial Intelligence (BAAI)
  publisher_kind: lab
  publisher_zh: 北京智源人工智能研究院（BAAI）
  overview: 'Emu3.5 is BAAI''s native multimodal model for interleaved text and images. WorldFoundry uses the pinned official implementation and emits its protobuf response. Checkpoint-backed GPU inference has produced text and decoded images; no video output is claimed.'
  overview_zh: Emu3.5 是北京智源（BAAI）面向交错文本与图像的原生多模态模型。WorldFoundry 调用固定版本的官方实现并输出其 protobuf 响应。权重支持的 GPU 推理已生成文本和可解码图像；不宣称视频输出。
  architecture: Emu3.5 predicts a unified text/image token stream and generates visual tokens with discrete diffusion, then decodes visual tokens through its separate vision tokenizer.
  architecture_zh: Emu3.5 预测统一的图文 token 序列，并以离散扩散生成视觉 token，再通过独立的视觉 tokenizer 解码。
  usage_notes: Stage the BAAI/Emu3.5 and BAAI/Emu3.5-VisionTokenizer weights plus the pinned official source checkout. The default story and howto tasks return an official protobuf response.
  usage_notes_zh: 就位 BAAI/Emu3.5、BAAI/Emu3.5-VisionTokenizer 权重和固定版本的官方源码。默认 story 和 howto 任务返回官方 protobuf 响应。
  limitations:
  - Official CLI byte-for-byte parity and larger image sizes have not been verified in this workspace.
  - The official checkpoint card describes text/image generation, not video generation.
  limitations_zh:
  - 本工作区尚未验证与官方 CLI 的逐字节一致性或更大尺寸图像。
  - 官方权重说明的是文本/图像生成，而非视频生成。
