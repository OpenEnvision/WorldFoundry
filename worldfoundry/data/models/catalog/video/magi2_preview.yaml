name: MAGI-2 Preview
aliases:
  - magi2
  - magi2_preview
  - magi-2-preview
runner_target: worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner
pipeline_binding: magi2-preview
tasks:
  - text-to-video
provider: official_repo
runtime_profile: runtime-profile:magi2-preview
min_vram_gb: 80
source_status:
