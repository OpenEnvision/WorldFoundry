docs:
  publisher: Open-source research release (institution not recorded)
  publisher_kind: lab
  publisher_zh: 开源研究发布（仓库未记录正式机构）
  overview: 'SAMA 14B is an open instruction-guided video editing model: it takes a source video and a text instruction. The released inference route does not accept a spatial mask or separate reference image. WorldFoundry reports missing checkpoints at runtime; weights are apache-2.0 at syxbb/SAMA-14B.'
  overview_zh: SAMA 14B 是开源的指令引导视频编辑模型，输入是源视频和文本指令。发布的推理入口不接受空间蒙版或单独的参考图。WorldFoundry 在运行时报告缺失权重；权重位于 syxbb/SAMA-14B，采用 apache-2.0 许可证。
  architecture: The catalog records a 14B-parameter editing model with a prompt/image/video input contract; the publishing institution and architecture internals are not recorded in this repository — consult the upstream GitHub (Cynthiazxy123/SAMA) for details.
  architecture_zh: catalog 记录这是一个 14B 参数的编辑模型，输入契约为 prompt/image/video；发表机构与架构内部细节仓库未记录——详情请查阅上游 GitHub（Cynthiazxy123/SAMA）。
  usage_notes: Supply a source video and edit instruction. A checkpoint-backed 17-frame run was compared with the official implementation; broader editing quality remains unverified.
  usage_notes_zh: 提供源视频和编辑指令。已将一次使用真实权重的 17 帧运行与官方实现对照；更广泛的编辑质量仍未验证。
  limitations:
  - A 17-frame checkpoint-backed run was checked against official inference; other inputs and longer videos require separate validation.
  - The released SAMA inference entrypoint has no spatial mask or separate reference-image input.
  - Checkpoints are external assets — missing weights are reported at runtime rather than downloaded automatically.
  - The publishing institution is not recorded in this repository.
  limitations_zh:
  - 已将一次使用真实权重的 17 帧运行与官方推理对照；其他输入和更长视频仍需单独验证。
  - 发布的 SAMA 推理入口没有空间蒙版或单独的参考图输入。
  - Checkpoint 属于外部资产——权重缺失时会在运行时报告，而不会自动下载。
  - 发表机构在本仓库中未记录。
