docs:
  publisher: Tencent (Hunyuan)
  publisher_kind: company
  publisher_zh: 腾讯（混元）
  overview: 'HunyuanVideo 1.5 is the newer revision of Tencent''s open video family, again recorded with independent T2V and I2V recipes on one shared native infrastructure. The notable difference from the original: the I2V conditioner declares FLUX.1-Redux-dev as an independent gated vision checkpoint instead of inferring a sibling path.'
  overview_zh: HunyuanVideo 1.5 是腾讯开源视频系列的较新版本，同样以独立的 T2V 与 I2V 配方共享一套原生基础设施。与初代的显著差异：I2V 条件器将 FLUX.1-Redux-dev 声明为独立的 gated 视觉 checkpoint，而不是推断同级路径。
  architecture: 'Same shared-native-runner design as the hunyuanvideo entry: HunyuanVideo 1.5 owns only model-specific network, codec, and conditioning behavior, while assembly, loading, and scheduling come from the shared diffusion infrastructure. generate.py is not retained as a second inference architecture.'
  architecture_zh: 与 hunyuanvideo 条目相同的共享原生 runner 设计：HunyuanVideo 1.5 只拥有模型特有的网络、编解码与条件行为，装配、加载与调度均来自共享扩散基础设施。generate.py 没有被保留为第二套推理架构。
  usage_notes: 'Registry resolution is verified; native checkpoint-backed CUDA parity is pending. Two gates to clear before running I2V: the main checkpoints carry ''other'' HF license metadata, and FLUX.1-Redux-dev is gated with a non-commercial license that the manifest says needs review — accept its terms on Hugging Face first.'
  usage_notes_zh: 注册表解析已验证；原生 checkpoint 加载的 CUDA 一致性仍在等待。运行 I2V 前有两道门槛：主 checkpoint 的 HF 许可元数据为“other”；FLUX.1-Redux-dev 为 gated 且许可为非商用（manifest 要求审阅）——请先在 Hugging Face 接受其条款。
  limitations:
  - Native CUDA artifact parity is pending.
  - I2V depends on the gated, non-commercial FLUX.1-Redux-dev vision checkpoint.
  - Main checkpoint license metadata is 'other'; review before commercial use.
  limitations_zh:
  - 原生 CUDA 产物一致性仍在等待。
  - I2V 依赖 gated 且非商用许可的 FLUX.1-Redux-dev 视觉 checkpoint。
  - 主 checkpoint 许可元数据为“other”，商用前需审阅。
  recommended_benchmarks:
  - id: vbench
    reason: Standard open T2V quality suite.
    reason_zh: 标准开源文生视频质量评测。
