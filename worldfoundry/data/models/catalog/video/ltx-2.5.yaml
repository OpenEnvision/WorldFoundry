  status: pending
  expected_artifacts:
  - ltx-2.5.mp4
  - ltx-2.5.json
  notes:
  - Command construction and official split-component mapping are validated without importing upstream CUDA code.
  - Visual and synchronized-audio quality parity still requires a checkpoint-backed GPU run.
