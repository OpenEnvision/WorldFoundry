evidence:
  notes:
  - WorldFoundry launches the version-pinned official ltx_pipelines.distilled entrypoint in a dedicated environment.
  - Split checkpoint mapping, T2V/I2V conditioning, audio-video output, offload, and quantization command contracts are CPU-tested.
  - Local required split components now pass CPU preflight; the two previously incomplete large files match the pinned official SHA-256 values. Checkpoint-backed GPU artifact parity remains pending.
