  expected_artifacts:
  - h3-tiny.mp4
  notes:
  - Reuses the canonical MiniMax-H3 DiT blocks, token refiner, Qwen3-VL encoder, video/audio VAEs, and MP4 muxer.
  - Supports pruned 42-layer depth, narrowed 9792 block FFN vs 14336 refiner FFN, rank-8 AdaLN, and MeanFlow interval conditioning (6-step default, >=4 steps).
  - Diffusers-to-WorldFoundry key mapping is bijective across all 630 (FewStep) and 626 (Pruned) tensors; tiny FP32/BF16 numerical parity matches upstream modeling and schedule math.
  - Verified on H200 with real H3-Tiny/MiniMax-H3-Tiny-17B-FewStep-Ref2VA-v0.1 + MiniMaxAI/MiniMax-H3 weights (1376x768, 124 frames at 24 fps, 6 MeanFlow steps, image Ref2VA, 32 kHz stereo AAC).
  - Remaining variants (17b-pruned-ref2va, 17b-pruned-fl2va, 14b-okd-ref2va), video/audio references, and multi-GPU execution remain pending GPU validation.
catalog_category: video
docs:
  publisher: H3-Tiny
  overview: Structured-pruned 17B/14B MiniMax-H3 checkpoints with rank-8 AdaLN and optional MeanFlow few-step distillation for joint video and stereo audio generation.
  overview_zh: 结构化剪枝的 17B/14B MiniMax-H3 模型，采用 8 秩 AdaLN 与可选 MeanFlow 少步蒸馏，支持联合音视频生成。
  usage_notes: Stage an H3-Tiny transformer checkpoint alongside the shared MiniMax-H3 base snapshot (text encoder, processor, video/audio VAEs). Use a Ref2VA variant for reference conditioning and 17b-pruned-fl2va for T2VA/FL2VA; MeanFlow checkpoints default to 6 steps (>=4) and pruned/OKD checkpoints default to 50 steps.
  usage_notes_zh: 将 H3-Tiny Transformer 权重与共享 MiniMax-H3 基础快照（文本编码器、处理器、视频/音频 VAE）一同准备。参考图生成使用 Ref2VA 变体，T2VA/FL2VA 使用 17b-pruned-fl2va；MeanFlow 权重默认 6 步（>=4），剪枝/OKD 权重默认 50 步。
  limitations:
  - Outputs are 24 fps video with 32 kHz stereo audio; frame counts align upward to 17n+5.
  - In-tree reference conditioning currently accepts image references only; video and standalone-audio references are not yet wired.
  - Code is Apache-2.0; model weights are distributed under the MiniMax H3 Community License.
  - H200 real-checkpoint replay is verified on 17b-fewstep-ref2va (6-step Ref2VA); pruned/OKD variants and multi-GPU execution remain pending GPU validation.
  limitations_zh:
  - 原生输出为 24 fps 视频与 32 kHz 立体声音频，帧数向上对齐至 17n+5。
  - 当前树内参考条件仅支持图像参考，暂未接入视频与独立音频参考。
  - 代码采用 Apache-2.0，模型权重采用 MiniMax H3 Community License。
  - 已在 H200 上完成 17b-fewstep-ref2va（6 步 Ref2VA）真实权重验证；剪枝/OKD 变体与多卡执行仍待验证。
