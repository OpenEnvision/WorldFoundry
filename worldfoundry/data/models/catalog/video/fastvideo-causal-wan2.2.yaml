    status: pending
    notes: CPU contract tests and checkpoint-backed GPU inference validate the
      schedule, image first-frame seeding, expert routing, cache separation,
      and 81-frame block traversal at 848x464. With the same image and prompt,
      FastVideo's official 81-frame request emitted 73 frames because its
      denoiser discards the final two latent frames. The shared 73 frames have
      matching composition and forward motion, but numerical parity remains
      pending because the random generators and latent precision differ.
