docs:
  publisher: NVIDIA / FastVideo
  publisher_kind: company
  publisher_zh: 英伟达 / FastVideo
  overview: FastVideo CausalWan2.2 is an eight-step causal Wan2.2 rollout that emits
    video in three-latent-frame blocks while routing between high- and low-noise experts.
  overview_zh: FastVideo CausalWan2.2 是八步因果 Wan2.2 生成模型，以每块三个潜帧推进，并在高、低噪声专家之间切换。
  architecture: WorldFoundry keeps expert KV/cross-attention caches independent and owns
    self-forcing re-noise on the fixed shifted flow schedule.
  architecture_zh: WorldFoundry 独立维护两个专家的 KV/交叉注意力缓存，并在固定移位 flow schedule 上执行 self-forcing 重加噪。
  usage_notes: An input image is required. The default 832x480 is an area budget;
    the 16-pixel-aligned output canvas follows the source aspect ratio (a 1280x704
    image yields 848x464). Defaults are 81 requested frames, eight steps, guidance
    1, and 16 FPS.
  usage_notes_zh: 必须提供输入图像。默认 832x480 是面积预算，实际画布按输入图像比例调整并对齐到 16 像素（1280x704 输入得到 848x464）。
    默认请求 81 帧、八步、guidance 1、16 FPS。
  limitations:
  - Checkpoint-backed 81-frame inference passed at 848x464 on an H100. FastVideo's official 81-frame request emitted 73 frames; shared-frame numerical parity remains unverified because RNG and latent precision differ.
  limitations_zh:
  - 已在 H100 上完成 848x464、81 帧真实权重推理。FastVideo 官方入口请求 81 帧实际输出 73 帧；随机数生成器和潜变量精度不同，公共帧的逐像素数值一致性尚未验证。
