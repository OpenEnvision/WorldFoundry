docs:
  publisher: StepFun
  publisher_kind: company
  publisher_zh: 阶跃星辰（StepFun）
  overview: Step-Video-T2V is StepFun's large open text-to-video model (30B parameters upstream, MIT weights at stepfun-ai/stepvideo-t2v). In WorldFoundry the public pipeline is assembled from native role-based components with the shared diffusion runner — DiT, Step-LLM text encoder, CLIP, scheduler, latent initialization, and VAE decoding all execute in-process.
  overview_zh: Step-Video-T2V 是阶跃星辰的大规模开源文生视频模型（上游 300 亿参数，MIT 权重位于 stepfun-ai/stepvideo-t2v）。在 WorldFoundry 中，公开 pipeline 由原生角色化组件与共享扩散 runner 装配—— DiT、Step-LLM 文本编码器、CLIP、调度器、潜变量初始化与 VAE 解码全部进程内执行。
  architecture: 'Upstream: a 30B DiT with a deeply compressed Video-VAE (16x16 spatial, 8x temporal) and bilingual text encoders. This repository re-assembles the native pipeline in-process; the former xFuser and caption/VAE HTTP-service runtime is not a backend. A checkpoint-backed 204-frame GPU artifact is verified for one prompt.'
  architecture_zh: 上游：30B DiT，配深压缩 Video-VAE（空间 16x16、时间 8x）与双语文本编码器。本仓库在进程内重装配原生 pipeline；原 xFuser 与 caption/VAE HTTP 服务运行时不再是后端。已验证使用真实权重的 204 帧 GPU 产物（一个受控提示词）。
  usage_notes: A checkpoint-backed 204-frame GPU artifact at 992x544 and 50 steps is verified for one prompt. Use id step-video-t2v. At 30B scale plan for serious VRAM or multi-GPU setups.
  usage_notes_zh: 已验证使用真实权重在 GPU 上以 992x544、50 步生成的 204 帧视频（一个受控提示词）。请使用 id step-video-t2v。30B 规模需要充足显存或多卡配置。
  limitations:
  - The 204-frame result covers one prompt; benchmark scores and official pixel parity are not yet measured.
  - 30B scale demands datacenter GPUs; single consumer cards are not viable.
  limitations_zh:
  - 204 帧结果仅覆盖一个提示词；尚未测量基准分数或官方逐像素一致性。
  - 30B 规模需要数据中心级 GPU；单张消费级显卡不可行。
  recommended_benchmarks:
  - id: vbench
    reason: Standard open T2V quality suite.
    reason_zh: 标准开源文生视频质量评测。
