evidence:
  artifacts:
  - outputs/kandinsky6-pro-distill-validation/output.mp4
  - outputs/kandinsky6-pro-distill-validation/cuda-validation.json
  notes:
  - Official inference components are owned by role-based base_models packages; sampling
    and assembly use the native recipe registry.
  - The pinned Pro-distill snapshot generated 121 frames at 864x480 and 24 fps,
    with 44.1 kHz audio, on one NVIDIA H100 80GB using SDPA and component offload.
  - Python 3.10.16, PyTorch 2.9.0+cu126, Diffusers 0.40.0, and Transformers 5.14.1
    were validated. Weight loading took 85.2 seconds; generation took 140.4 seconds.
  - GPU evidence covers text-to-video; image-to-video and official demo parity remain pending.
