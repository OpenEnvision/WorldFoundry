docs:
  overview: >-
    Kandinsky 6.0 Pro-distill generates synchronized video and 44.1 kHz audio
    from text, with optional first-frame image conditioning. WorldFoundry runs
    the Pro transformer with 10 PiFlow steps through its native diffusion components.
  overview_zh: >-
    Kandinsky 6.0 Pro-distill 根据文本生成同步视频和 44.1 kHz 音频，
    并支持可选的首帧图像条件。WorldFoundry 通过原生扩散组件运行
    Pro transformer，默认使用 10 步 PiFlow 采样。
  usage_notes: >-
    Text-to-video passed on one H100 80GB with SDPA, component offload, and seed 42:
    121 frames at 864x480 and 24 fps, with muxed audio. Weight loading took
    85.2 seconds and generation took 140.4 seconds in the pinned Python 3.10 /
    CUDA 12.6 environment. The validation report is
    outputs/kandinsky6-pro-distill-validation/cuda-validation.json.
  usage_notes_zh: >-
    文生视频已在单张 H100 80GB 上验证通过，使用 SDPA、component offload
    和 seed 42，输出 121 帧、864x480、24 fps 的视频及同步音频。
    固定的 Python 3.10 / CUDA 12.6 环境中，权重加载耗时 85.2 秒，
    生成耗时 140.4 秒。验证报告位于
    outputs/kandinsky6-pro-distill-validation/cuda-validation.json。
  modalities:
    inputs: [text, image]
    outputs: [video, audio]
  limitations:
  - Image-to-video and parity with the official demo remain unvalidated.
  limitations_zh:
  - 图生视频和与官方 demo 的一致性仍待验证。
