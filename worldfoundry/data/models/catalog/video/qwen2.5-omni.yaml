docs:
  publisher: Alibaba (Qwen)
  publisher_kind: company
  publisher_zh: 阿里巴巴（通义千问 Qwen）
  overview: 'Qwen2.5-Omni is Alibaba''s end-to-end omni-modal model: it perceives text, images, audio, and video. In this catalog it serves as an understanding/reasoning entry — multimodal reasoning, audio reasoning, and image/video QA — with model_response artifacts. The recorded weight is the 7B release (Qwen/Qwen2.5-Omni-7B).'
  overview_zh: Qwen2.5-Omni 是阿里的端到端全模态模型：能感知文本、图像、音频与视频。在本 catalog 中作为理解/推理条目——多模态推理、音频推理与图像/视频问答——产物为 model_response。记录的权重是 7B 版本（Qwen/Qwen2.5-Omni-7B）。
  architecture: 'Alibaba describes Qwen2.5-Omni with a Thinker-Talker design: a reasoning core plus a speech-generation head, with TMRoPE alignment for audio-video time synchronization. In this repository only the text-response path matters — the recorded contract is prompt/image/video in, model response out.'
  architecture_zh: 阿里将 Qwen2.5-Omni 描述为 Thinker-Talker 设计：推理核心加语音生成头，并用 TMRoPE 做音视频时间对齐。本仓库中只使用文本响应路径——记录契约为输入 prompt/image/video、输出模型响应。
  usage_notes: Runner parity is pending. Use it to caption, interrogate, or QA videos generated by other catalog entries. The 7B scale runs on a single modern GPU.
  usage_notes_zh: Runner parity 为 pending。可用于为其它条目生成的视频做描述、问答或质检。7B 规模单张现代 GPU 即可运行。
  limitations:
  - 'Runner parity is recorded as pending: the WorldFoundry route is wired, but a checkpoint-backed GPU artifact has not been verified in this workspace, so do not treat this page as proof of a validated end-to-end run.'
  - Checkpoints are external assets — missing weights are reported at runtime rather than downloaded automatically.
  limitations_zh:
  - Runner parity 记录为 pending：WorldFoundry 路径已接好，但本工作区尚未完成 checkpoint 加载的 GPU 产物验证，请勿把本页当作端到端跑通的证明。
  - Checkpoint 属于外部资产——权重缺失时会在运行时报告，而不会自动下载。
