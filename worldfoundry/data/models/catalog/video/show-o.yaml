docs:
  publisher: National University of Singapore (Show Lab)
  publisher_kind: university
  publisher_zh: 新加坡国立大学（Show Lab）
  overview: |
    Show-o (Xie et al., Show Lab at NUS with ByteDance, arXiv 2408.12528) is a single 1.3B transformer that unifies multimodal understanding and generation. It is initialized from Phi-1.5 and, unlike systems that attach a separate diffusion expert to an MLLM, uses one set of weights for both.

    Text is discrete tokens modeled autoregressively (next-token prediction). Images are MAGVIT-v2 lookup-free tokens — a 256×256 frame becomes a 16×16 grid from an 8,192-entry codebook — then generated by MaskGIT-style discrete diffusion (mask-token prediction) with full attention. Omni-attention is causal on text and bidirectional on image tokens. The LLM itself encodes the text condition, so there is no extra T5/CLIP text encoder.

    The same checkpoint, in the paper, does VQA and captioning, text-to-image, and text-guided inpainting or extrapolation without extra finetuning, plus mixed-modality sequences. Default generation numbers use 1.3B parameters and about 35M image-text pairs (MSCOCO FID-30K 9.24), close to a LLaVA-v1.5-Phi-1.5 understanding-only baseline. In this catalog only the T2I wrapper is wired; MMU, inpainting, and extrapolation remain future work.
  overview_zh: |
    Show-o（Xie 等，新加坡国立大学 Show Lab 与 ByteDance，arXiv 2408.12528）是一个 1.3B 的单一 Transformer，把多模态理解与生成放在同一套权重里。它从 Phi-1.5 初始化，而不是把独立扩散专家接到 MLLM 上。

    文本是离散 token，用自回归 next-token prediction；图像经 MAGVIT-v2 无查找量化，256×256 变成 16×16、码本 8,192，再用 MaskGIT 式离散扩散（mask-token prediction）和全注意力生成。Omni-attention 对文本因果、对图像 token 双向。文本条件由 LLM 自己编码，没有额外的 T5/CLIP 文本编码器。

    论文中同一套权重可做 VQA/配文、文生图，以及无需额外微调的文本引导补全与外推，也支持混合模态序列。默认生成数字是 1.3B 参数、约 3500 万图文对（MSCOCO FID-30K 9.24），接近只做理解的 LLaVA-v1.5-Phi-1.5 基线。本 catalog 只接通 T2I；MMU、补全与外推仍是后续工作。
  architecture: |
    The transformer is Phi-1.5 with QK-Norm on every attention layer. The embedding table grows by 8,192 learnable image-token rows. A unified prompt wraps the sequence with task markers [MMU] / [T2I], text bounds [SOT]/[EOT], and image bounds [SOI]/[EOI]. Training mixes mask-token prediction and next-token prediction (L_MTP + α L_NTP). Generation starts from all [MASK] tokens and iteratively unmasks over T steps — about 20× fewer steps than autoregressive image decoding; the in-tree runtime defaults to 256 px, CFG 3.0, and 18 steps.

    Image I/O uses the MAGVIT-v2 VQ tokenizer (showlab/magvitv2). The paper also studies continuous MAGVIT or CLIP-ViT features for understanding (Show-o† / Show-o‡); the released default and these catalog weights use discrete tokens for both understanding and generation. WorldFoundry's runtime lives under synthesis/visual_generation/show_o with a mode/prompt/image contract and microsoft/phi-1_5 plus showlab/show-o.
  architecture_zh: |
    Transformer 是带逐层 QK-Norm 的 Phi-1.5，词表额外增加 8,192 个可学习图像 token。统一 prompt 用 [MMU]/[T2I] 标明任务，用 [SOT]/[EOT]、[SOI]/[EOI] 框住文本与图像。训练同时做 mask-token prediction 与 next-token prediction（L_MTP + α L_NTP）。生成从全 [MASK] 开始、按 T 步逐步揭开，步数大约是自回归解码图像的 1/20；树内运行时默认 256 像素、CFG 3.0、18 步。

    图像编解码用 MAGVIT-v2 VQ（showlab/magvitv2）。论文还试过把 MAGVIT 或 CLIP-ViT 连续特征用于理解（Show-o† / Show-o‡）；发布的默认权重和本 catalog 对理解与生成都用离散 token。WorldFoundry 运行时在 synthesis/visual_generation/show_o，契约为 mode/prompt/image，权重为 microsoft/phi-1_5 与 showlab/show-o。
  usage_notes: The verified WorldFoundry route is T2I only — set mode accordingly and expect a generated_image artifact. Paper-default resolution is 256; the wrapper uses classifier-free guidance (default 3.0) and 18 discrete-diffusion steps. Weights are MIT at showlab/show-o, with MAGVIT-v2 and Phi-1.5 as recorded companions. Image understanding and editing modes exist in the paper but are not wired here.
  usage_notes_zh: 已验证的 WorldFoundry 路径仅 T2I——请相应设置 mode，预期产物为 generated_image。论文默认分辨率 256；封装使用 classifier-free guidance（默认 3.0）和 18 步离散扩散。权重为 MIT，位于 showlab/show-o，并记录 MAGVIT-v2 与 Phi-1.5。论文中的图像理解与编辑模式此处尚未接线。
  highlights:
  - 1.3B Phi-1.5 transformer for both understanding and generation
  - Autoregressive text plus MaskGIT / MAGVIT-v2 discrete image diffusion (codebook 8192)
  - Omni-attention: causal on text, full attention on image tokens
  - No separate text encoder — the LLM is the conditioner
  - Inpainting and extrapolation without finetuning in the paper
  - About 20× fewer image sampling steps than autoregressive decoding
  highlights_zh:
  - 1.3B Phi-1.5 Transformer，理解与生成共用
  - 文本自回归，图像为 MaskGIT / MAGVIT-v2 离散扩散（码本 8192）
  - Omni-attention：文本因果，图像 token 全注意力
  - 没有独立文本编码器，条件由 LLM 自己编码
  - 论文中补全与外推无需额外微调
  - 图像采样步数约为自回归解码的 1/20
  modalities:
    inputs:
    - text
    - image
    outputs:
    - image
    - text
  use_cases:
  - Text-to-image generation (wired)
  - Visual question answering and captioning (paper; not wired)
  - Text-guided inpainting and outpainting (paper; not wired)
  - Mixed-modality interleaved generation (paper)
  use_cases_zh:
  - 文生图（已接通）
  - 视觉问答与配文（论文能力，尚未接线）
  - 文本引导补全与外扩（论文能力，尚未接线）
  - 混合模态交错生成（论文）
  limitations:
  - Only text-to-image is wired; MMU, inpainting, and extrapolation remain future work.
  - This entry produces images, not video.
  - The published default is a 1.3B Phi-1.5 model at 256px discrete tokens, not a video backbone.
  limitations_zh:
  - 仅接通文生图；MMU、补全与外推是后续工作。
  - 该条目产出图像，不是视频。
  - 论文默认是 1.3B Phi-1.5、256 像素离散 token，不是视频骨干。
