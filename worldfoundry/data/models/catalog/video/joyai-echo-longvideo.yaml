evidence:
  notes:
  - WorldFoundry normalizes R2V requests and launches the official Echo-LongVideo CLI in its dedicated environment.
  - BF16, FP8, FP4, consumer, and low-VRAM upstream configuration routes are represented.
  - The local BF16, FP8, and FP4 Echo checkpoints and CUDA devices are present, but GPU inference is blocked by the gated Gemma 3 12B encoder and missing dedicated environment.
