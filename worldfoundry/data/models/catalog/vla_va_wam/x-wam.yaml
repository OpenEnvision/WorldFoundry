    reason: The RoboCasa-SFT checkpoint passed GPU inference; no closed-loop benchmark was run.
    reason_zh: RoboCasa-SFT 权重已通过 GPU 推理，尚未运行闭环评测。
  - id: robotwin
    reason: The RoboTwin-SFT checkpoint matched the pinned official runner on one paired episode; no closed-loop benchmark was run.
    reason_zh: RoboTwin-SFT 权重在一条配对样本上与固定版本官方 Runner 接近一致，尚未运行闭环评测。
  - id: ewmbench
    reason: Joint world-action prediction quality.
    reason_zh: 联合世界-动作预测质量。
