- repo_id: Wan-AI/Wan2.1-T2V-1.3B
id: fastwam
integration:
  status: all_released_checkpoints_gpu_validated
  notes:
  - WorldFoundry contains the released MoT action-inference graph, Wan VAE, UMT5 encoder, scheduler, preprocessing, and normalization code.
  - LIBERO base, LIBERO Optional IDM, and RoboTwin base checkpoints are declared in the runtime data configuration.
  - Runtime execution never imports an adjacent FastWAM source checkout and never enables remote checkpoint code.
  - Both base variants passed real A100 inference with finite 32-step action chunks; Optional IDM passed synthetic 8-step inference in both idm and first_frame modes.
