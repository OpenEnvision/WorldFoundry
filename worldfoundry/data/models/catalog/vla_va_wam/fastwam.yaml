docs:
  publisher: Open-source research release (institution not recorded)
  publisher_kind: lab
  publisher_zh: 开源研究发布（仓库未记录正式机构）
  overview: 'FastWAM is a GPU-validated world-action model built on the Wan video stack. The LIBERO and RoboTwin base checkpoints produced finite 32-step action chunks; the separate LIBERO Optional IDM checkpoint produced finite 8-step chunks in both idm and first_frame modes with synthetic observations. These are inference checks, not robot task-success claims (MIT license).'
  overview_zh: FastWAM 是基于 Wan 视频栈的 GPU 已验证世界动作模型。LIBERO 与 RoboTwin 基础权重输出有限的 32 步动作块；独立的 LIBERO Optional IDM 权重在合成观测下以 idm 和 first_frame 两种模式输出有限的 8 步动作块。这些仅是推理验证，不代表机器人任务成功（MIT 许可）。
  architecture: The released MoT action-inference graph, Wan VAE, UMT5 encoder, scheduler, preprocessing, and normalization all live in-tree. Runtime execution never imports an adjacent FastWAM source checkout and never enables remote checkpoint code.
  architecture_zh: 发布的 MoT 动作推理图、Wan VAE、UMT5 编码器、调度器、预处理与归一化全部内置树内。运行时执行绝不导入相邻的 FastWAM 源码 checkout，也不启用远程 checkpoint 代码。
  usage_notes: Select libero, libero_optional_idm, or robotwin in the runtime data configuration. Optional IDM supports idm (generated-future conditioning) and first_frame modes. Stage yuanty/fastwam plus the Wan-series converted safetensors and Wan2.1-T2V-1.3B tokenizer locally.
  usage_notes_zh: 在运行时配置中选择 libero、libero_optional_idm 或 robotwin。Optional IDM 支持 idm（生成未来视频后预测动作）与 first_frame 模式。需在本地就位 yuanty/fastwam、Wan 系列转换 safetensors 与 Wan2.1-T2V-1.3B tokenizer。
  limitations:
  - Synthetic checkpoint probes do not establish closed-loop LIBERO or RoboTwin task success.
  limitations_zh:
  - 合成输入的权重推理验证不代表 LIBERO 或 RoboTwin 闭环任务成功。
  recommended_benchmarks:
  - id: libero
    reason: GPU-validated LIBERO checkpoint variant.
    reason_zh: GPU 已验证的 LIBERO checkpoint 变体。
  - id: robotwin
    reason: GPU-validated RoboTwin checkpoint variant.
    reason_zh: GPU 已验证的 RoboTwin checkpoint 变体。
