  overview: LaST-R1 is an MIT-licensed VLA policy trained with reinforcement learning. The libero_10 RL checkpoint is staged locally, but WorldFoundry does not yet provide the model-specific rollout adapter needed for inference.
  overview_zh: LaST-R1 是 MIT 许可、以强化学习训练的 VLA 策略。libero_10 RL 权重已在本地就位，但 WorldFoundry 尚缺少推理所需的模型专用 rollout 适配器。
  architecture: Task tags record a VLA plus reinforcement-learning design. Architecture internals beyond the official repository pointer (CHEN-H01/LaST-R1, pinned head ba4e9396) are not recorded in this repository.
  architecture_zh: 任务标签记录其为 VLA 加强化学习设计。官方仓库指针（CHEN-H01/LaST-R1，锁定 head ba4e9396）之外的架构内部细节仓库未记录。
  usage_notes: The local libero_10 checkpoint has both weight shards; libero_goal is incomplete. Inference remains unavailable until the official latent/action-token rollout is adapted and validated.
  usage_notes_zh: 本地 libero_10 checkpoint 两片权重齐全；libero_goal 尚未下载完整。官方 latent/action-token rollout 完成适配和验证前不可推理。
