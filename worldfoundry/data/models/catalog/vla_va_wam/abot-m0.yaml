docs:
  publisher: Amap CV Lab (Alibaba Group)
  publisher_kind: company
  publisher_zh: 高德地图 CV 实验室（阿里巴巴集团）
  overview: ABot-M0 from Amap's CV Lab is a bimanual manipulation VLA built on Qwen3-VL with an AML flow action expert and optional VGGT geometric fusion. Three released task weights are confirmed — ABot-M0-LIBERO, ABot-M0-Robocasa, and ABot-M0-RoboTwin2 — plus a ModelScope pretraining checkpoint, all under Apache-2.0, and all three are staged and manifest-size verified in this catalog.
  overview_zh: 高德 CV 实验室的 ABot-M0 是基于 Qwen3-VL 的双臂操作 VLA，搭配 AML flow 动作专家与可选的 VGGT 几何融合。三个已发布任务权重均已确认——ABot-M0-LIBERO、ABot-M0-Robocasa、ABot-M0-RoboTwin2——另有 ModelScope 预训练 checkpoint，全部 Apache-2.0 许可；本 catalog 中三个权重均已就位并通过 manifest 大小校验。
  architecture: Qwen3-VL provides the vision-language backbone; the AML flow action expert decodes actions; optional VGGT fusion injects 3D geometry. The runtime accepts the released config.yaml, dataset_statistics.json, and steps_*_pytorch_model.pt layout directly, preserving the strict state-dict architecture.
  architecture_zh: Qwen3-VL 提供视觉-语言骨干；AML flow 动作专家解码动作；可选 VGGT 融合注入 3D 几何。运行时直接接受发布的 config.yaml、dataset_statistics.json 与 steps_*_pytorch_model.pt 布局，保持严格的 state-dict 架构。
  usage_notes: Pick the task weight matching your benchmark (LIBERO, RoboCasa, or RoboTwin2). Only inference components are in-tree; datasets, training, deployment services, and robot SDK code are excluded.
  usage_notes_zh: 按基准选择任务权重（LIBERO、RoboCasa 或 RoboTwin2）。树内仅含推理组件；数据集、训练、部署服务与机器人 SDK 代码均被排除。
  limitations:
  - Numerical and GPU checkpoint parity remain pending despite staged weights.
  limitations_zh:
  - 权重虽已就位，数值与 GPU checkpoint parity 仍为 pending。
  recommended_benchmarks:
  - id: libero
    reason: Dedicated ABot-M0-LIBERO task weight.
    reason_zh: 有专门的 ABot-M0-LIBERO 任务权重。
  - id: robocasa
    reason: Dedicated ABot-M0-Robocasa task weight.
    reason_zh: 有专门的 ABot-M0-Robocasa 任务权重。
  - id: robotwin
    reason: Dedicated ABot-M0-RoboTwin2 task weight.
    reason_zh: 有专门的 ABot-M0-RoboTwin2 任务权重。
