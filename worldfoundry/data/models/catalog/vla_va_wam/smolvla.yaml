integration:
  status: runtime_ported
  notes:
  - The in-tree runtime preserves the official flow-matching architecture, preprocessing, and strict checkpoint structure.
  - Runtime loading is local-only and does not import an external source checkout.
  - The LIBERO task checkpoint is the rollout default; the multi-robot foundation checkpoint lacks canonical state statistics and remains a non-default fine-tuning asset.
