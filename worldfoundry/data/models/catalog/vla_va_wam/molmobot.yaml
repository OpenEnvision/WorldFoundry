id: molmobot
integration:
  status: integrated
  notes:
  - WorldFoundry runs OLMo-based MolmoBot and Pi0-based DROID policies through in-tree inference-only pipelines.
  - The released MolmoBot-DROID and MolmoBot-Img-DROID checkpoints completed offline GPU action inference; the Pi0-DROID checkpoint also completed official and public Pipeline GPU inference.
  - The Pi0 route uses a pinned isolated OpenPI environment, without importing the MolmoSpaces simulator at runtime.
