    license: apache-2.0
  notes:
  - Official command serves MolmoBot-DROID with launch_scripts/serve_molmo.py --hf-repo allenai/MolmoBot-DROID.
  - Checkpoint-backed offline action inference passed on a real DROID observation; no robot task success was measured.
- id: molmobot-pi0-droid
  integration_status: integrated
  task: vla.policy_rollout
  checkpoint_refs:
  - repo_id: allenai/MolmoBot-Pi0-DROID
    license: gemma
  notes:
  - Official demo uses PiJointPosPolicy with qpos arm/gripper, exo_camera_1, wrist_camera, and task prompt.
  - Official PiJointPosPolicy and public MolmoBotPipeline both returned finite arm and gripper actions from the same released checkpoint and real DROID observation.
runner_parity:
  status: verified_inference_only
  notes:
  - Public Pi0 input preparation matched the official policy for both cameras, arm and gripper state, and prompt.
  - Evidence covers offline action inference only; MolmoSpaces simulation, real robot execution, training, and benchmarks were not run.
