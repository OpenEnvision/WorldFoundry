docs:
  publisher: Physical Intelligence
  publisher_kind: company
  publisher_zh: Physical Intelligence（PI）
  overview: PI0 (WorldFoundry native) is a WorldFoundry-native route to the pi0 policy, originally exposed by WorldFoundry-native-3D and now routed through the same in-tree OpenPI runtime as the concrete pi0 entry. It exists so native pipelines can call pi0 without a separate integration surface.
  overview_zh: PI0（WorldFoundry native）是 pi0 策略的 WorldFoundry 原生路由，最初由 WorldFoundry-native-3D 暴露，现与具体 pi0 条目共用同一树内 OpenPI 运行时。它的存在使原生 pipeline 无需独立集成面即可调用 pi0。
  architecture: 'Identical to pi0: a PaliGemma backbone with a flow-matching action expert, served through the in-tree OpenPI component pipeline.'
  architecture_zh: 与 pi0 相同：PaliGemma 骨干加 flow-matching 动作专家，经树内 OpenPI 组件 pipeline 提供服务。
  usage_notes: Full checkpoint-backed inference remains asset-gated on local checkpoint, tokenizer, and normalization statistics. Prefer the concrete pi0 entry unless you specifically need the native route.
  usage_notes_zh: 完整 checkpoint 驱动推理受本地 checkpoint、tokenizer 与归一化统计就位限制。除非确需原生路由，否则建议使用具体的 pi0 条目。
  limitations:
  - Runner parity is pending; checkpoint-backed PI0 parity is not yet validated on this route.
  limitations_zh:
  - runner parity 为 pending；此路由的 checkpoint 驱动 PI0 parity 尚未验证。
