docs:
  publisher: Galaxea AI
  publisher_kind: company
  publisher_zh: 星海图（Galaxea AI）
  overview: Galaxea G0Plus is Galaxea AI's open VLA policy, released with the OpenGalaxea/G0-VLA checkpoint on a PaliGemma-3B base. WorldFoundry keeps the full inference path in-tree — model architecture, KV cache, flow sampler, strict checkpoint loader, tokenizer adapter, preprocessing, and normalization — with static runtime verification complete.
  overview_zh: Galaxea G0Plus 是星海图（Galaxea AI）的开放 VLA 策略，发布 OpenGalaxea/G0-VLA checkpoint，基座为 PaliGemma-3B。WorldFoundry 将完整推理路径内置树内——模型架构、KV cache、flow 采样器、严格 checkpoint 加载器、tokenizer 适配器、预处理与归一化——静态运行时验证已完成。
  architecture: A PaliGemma-3B vision-language base with a flow-matching action sampler and KV-cached decoding. Parameter names preserve the official checkpoint contract; restoration is strict.
  architecture_zh: PaliGemma-3B 视觉-语言基座，配 flow-matching 动作采样器与 KV 缓存解码。参数名保持官方 checkpoint 契约；恢复为严格模式。
  usage_notes: Note the non-commercial G0-Plus community license before deployment. Runtime accepts only staged local assets; dataset, training, evaluation harness, deployment server, and robot-control code are excluded.
  usage_notes_zh: 部署前注意非商用的 G0-Plus 社区许可。运行时仅接受本地就位资产；数据集、训练、评测框架、部署服务与机器人控制代码均被排除。
  limitations:
  - Non-commercial community license.
  - Numerical and GPU rollout validation remain pending (static verification only).
  limitations_zh:
  - 非商用社区许可。
  - 数值与 GPU rollout 验证仍为 pending（仅完成静态验证）。
