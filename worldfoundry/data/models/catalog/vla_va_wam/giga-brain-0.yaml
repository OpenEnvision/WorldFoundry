docs:
  publisher: GigaAI
  publisher_kind: company
  publisher_zh: 极佳科技（GigaAI）
  overview: GigaBrain-0 is GigaAI's 3.5B VLA foundation policy with subtask prediction, released as GigaBrain-0-3.5B-Base and the 0.1 refresh under Apache-2.0. In this catalog the in-tree GigaBrain-0.1 runtime emitted a checkpoint-backed CUDA action_trace using converted LeRobot RoboTwin statistics, with PaliGemma tokenizer and the physical-intelligence FAST tokenizer staged.
  overview_zh: GigaBrain-0 是极佳科技（GigaAI）的 3.5B VLA 基础策略，支持子任务预测，发布 GigaBrain-0-3.5B-Base 与 0.1 更新版，Apache-2.0 许可。本 catalog 中树内 GigaBrain-0.1 运行时使用转换的 LeRobot RoboTwin 统计输出了 checkpoint 驱动的 CUDA action_trace，PaliGemma tokenizer 与 physical-intelligence FAST tokenizer 均已就位。
  architecture: A 3.5B policy on a PaliGemma tokenizer base using the FAST action tokenizer for discrete action encoding, plus subtask prediction heads. Architecture internals beyond the official repository pointer are not recorded in this repository.
  architecture_zh: 3.5B 策略，PaliGemma tokenizer 基座，用 FAST 动作 tokenizer 做离散动作编码，另有子任务预测头。官方仓库指针之外的架构内部细节仓库未记录。
  usage_notes: The PaliGemma tokenizer model is gated (manual review) and requires Hugging Face auth. Official task-score parity remains separate because official task norm_stats/delta_mask assets are gated or not staged.
  usage_notes_zh: PaliGemma tokenizer 模型为门控（需人工审查），需要 Hugging Face 认证。由于官方任务 norm_stats/delta_mask 资产门控或未就位，官方任务分数 parity 单独跟踪。
  limitations:
  - Gated PaliGemma dependency requires auth.
  - Official task-score parity is pending gated normalization assets.
  limitations_zh:
  - 门控的 PaliGemma 依赖需要认证。
  - 官方任务分数 parity 因门控归一化资产而待定。
  recommended_benchmarks:
  - id: robotwin
    reason: CUDA action trace was produced with converted RoboTwin statistics.
    reason_zh: CUDA 动作轨迹以转换的 RoboTwin 统计产出。
