models:
  - id: hailuo-2p3
    name: Hailuo 2.3
    aliases: [minimax-i2v, minimax_i2v]
    tasks: [audio-video, image-to-video, hosted-api]
    provider: api
    source:
      status: api
      official_repo_url: https://www.minimax.io/
    runner_target: worldfoundry.evaluation.models.runners.pipeline:WorldFoundryPipelineRunner
    pipeline_binding: hailuo-2p3
    official_sources:
      project_page: https://www.minimax.io/
    integration:
      status: integrated
      notes:
        - Hosted API Studio pipeline is available; users must provide their own provider API key.
    demo_parity:
      status: not_applicable
    runner_parity:
      status: not_applicable
      notes:
        - API output parity depends on provider-side model versioning and account access.
    docs:
      publisher: MiniMax
      publisher_kind: company
      publisher_zh: MiniMax（稀宇科技）
      overview: Hailuo 2.3 is MiniMax's hosted video generation service, recorded in this catalog for image-to-video and joint audio-video generation. You hand it a start image (plus an optional prompt) and it returns a finished clip rendered on MiniMax's infrastructure — WorldFoundry never runs the model itself. The catalog also lists the aliases minimax-i2v and minimax_i2v for this entry, so older configs keep resolving. Use it when you want MiniMax's production quality inside WorldFoundry's Studio workflow without managing GPUs.
      overview_zh: Hailuo 2.3（海螺 2.3）是 MiniMax 的托管视频生成服务，本 catalog 将其记录为图生视频与音视频联合生成两类任务。你提供一张起始图（可附文本提示词），它在 MiniMax 的基础设施上渲染出成片—— WorldFoundry 本身不运行该模型。该条目还登记了 minimax-i2v、minimax_i2v 两个别名，旧配置可以继续解析。适合在不管理 GPU 的前提下，把 MiniMax 的生产级生成质量接入 WorldFoundry 的 Studio 工作流。
      architecture: 'This is a hosted, provider-operated model: the vendor has not published its architecture, parameter count, or training recipe, and this repository does not record them. What WorldFoundry records is the integration surface only — a Studio pipeline that submits requests to the provider endpoint and collects the returned video artifacts.'
      architecture_zh: 这是由服务方托管运行的模型：厂商未公开其架构、参数规模或训练细节，本仓库也未记录这些信息。WorldFoundry 记录的只是集成层——一条向服务方端点提交请求并回收生成视频产物的 Studio pipeline。
      usage_notes: 'The catalog marks this entry as integrated: the hosted-API Studio pipeline is available, but you must supply your own provider API key and account. No weights are downloaded and no GPU environment is provisioned locally — generation happens on the provider side, so cost, quota, and content policy follow your provider account. Point the pipeline at your MiniMax platform key before launching jobs.'
      usage_notes_zh: Catalog 将该条目标记为 integrated：托管 API 的 Studio pipeline 已可用，但你必须自备服务方的 API key 与账号。本地不会下载任何权重、也不会创建 GPU 环境——生成在服务方完成，费用、配额与内容政策均以你的服务方账号为准。启动任务前，请先在 pipeline 中配置你的 MiniMax 开放平台 key。
      limitations:
      - Requires a paid provider account and API key; WorldFoundry does not ship credentials.
      - The provider controls model versioning, so outputs can change over time without any change in this repository — the manifest records runner parity as not applicable for this reason.
      - No local weights, no offline mode, and no reproducibility pinning beyond the request parameters WorldFoundry stores.
      limitations_zh:
      - 需要付费的服务方账号与 API key；WorldFoundry 不提供任何凭据。
      - 模型版本由服务方控制，输出可能随时间变化而与本仓库无关——因此 manifest 将 runner parity 记录为 not applicable。
      - 没有本地权重、不支持离线运行；除 WorldFoundry 保存的请求参数外，无法进一步固定可复现性。
      recommended_benchmarks:
      - id: vbench
        reason: Standard multi-dimension quality suite for comparing hosted text/image-to-video outputs.
        reason_zh: 对比托管文/图生视频输出的标准多维质量评测。
      - id: physics-iq
        reason: Probes whether provider-side video models respect basic physical plausibility.
        reason_zh: 检验服务方视频模型是否遵循基本物理合理性。

