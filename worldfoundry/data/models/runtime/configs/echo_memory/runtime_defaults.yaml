  task: t2v-1.3B
  width: 640
  height: 352
  frames: 81
  fps: 15
  num_chunks: 2
  sample_steps: 50
  sample_shift: 5.0
  sample_solver: unipc
  sample_guide_scale: 5.0
  base_seed: 42
  negative_prompt: "oversaturated colors, overexposed, static, blurry details"
  camera_trajectory: "z*80"
