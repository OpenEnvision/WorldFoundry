  t5_cpu: false
  t5_fsdp: false
  dit_fsdp: false
  ulysses_size: 1
  ring_size: 1

defaults:
  echo-memory-context-k1:
    <<: *echo_common
    checkpoint_path: ${WORLDFOUNDRY_CKPT_DIR}/Echo-Memory/context_k1/epoch-0.safetensors
