# kandinskylab/Kandinsky-6.0-Pro-distill-5s-Diffusers
# branch main
checkpoint: pro-distill
dit: transformer_pro

paths:
  dit: transformer/diffusion_pytorch_model.safetensors
  vae: vae
  qwen: text_encoder
  clip: text_encoder_2

generation:
  height: 480
  width: 864
  latent_frames: 31
  sample_frames: 121
  num_steps: 10
  guidance_weight: 1.0
  scheduler_scale: 5.0
  scale_factor: [1.0, 2.0, 2.0]

text_embedder:
  max_length: 1024

scheduler:
  class_name: PiflowScheduler
  shift: 5.0
  eps: 1.0e-6
  final_step_size_scale: 0.5
  n_grid: 10
  num_policy_substeps: 128

dit_overrides:
  # HF stores the PiFlow head already expanded (per-grid 16 and 40, times n_grid).
  out_visual_dim: 160
  out_audio_dim: 400

audio_vae:
  tod_vae_ckpt: audio_vae
  scaling_factor: 0.417

vocoder:
  ckpt: vocoder

piflow:
  enabled: true
  dx_num_grid_points: 10
  shift: 5.0
  eps: 1.0e-6
  final_step_size_scale: 0.5
  num_policy_substeps: 128
