schema_version: worldfoundry.runtime_defaults.v1
defaults:
  ltx_video_i2v:
    model_name: ltx_video_i2v
    generation_type: i2v
    num_images_per_prompt: 1
    image_cond_noise_scale: 0.15
    height: 512
    width: 768
    num_frames: 121
    frame_rate: 30
    negative_prompt: worst quality, inconsistent motion, blurry, jittery, distorted
    conditioning_start_frames: 0
    model_path: ${WORLDFOUNDRY_HFD_ROOT}/Lightricks--LTX-Video
    num_inference_steps: 10
    guidance_scale: 1.0
    cpu_offload: true
    vae_tiling:
      spatial_tile_size: 768
      spatial_overlap: 64
      temporal_tile_size: 80
      temporal_overlap: 24
