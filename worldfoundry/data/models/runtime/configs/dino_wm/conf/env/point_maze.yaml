name: point_maze
dataset:
  _target_: worldfoundry.synthesis.visual_generation.world_model.dino_wm.datasets.point_maze_dset.load_point_maze_slice_train_val
  normalize_action: ${normalize_action}
  data_path: ${oc.env:DATASET_DIR}/point_maze
  split_ratio: 0.9
  transform:
    _target_: worldfoundry.synthesis.visual_generation.world_model.dino_wm.datasets.img_transforms.default_transform
    img_size: ${img_size}
num_workers: 16
