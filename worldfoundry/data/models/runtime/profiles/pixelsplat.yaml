notes:
- WorldFoundry vendors the pixelSplat source and runtime under worldfoundry/base_models/three_dimensions/point_clouds/pixelsplat
  and registers a lazy wrapper.
- Requires the declared pixelSplat environment dependencies, a local Gaussian rasterization
  extension, and a staged re10k.ckpt or acid.ckpt from the original convolutional model.
- Both checkpoints were validated on real posed two-view inputs. Unposed image input uses
  a synthetic camera baseline and does not establish accurate scene geometry.
- PLY export stores world-space rotations and standard opacity logits; only DC color is exported.
