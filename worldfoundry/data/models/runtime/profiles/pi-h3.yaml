notes:
- pi-H3 reuses canonical WorldFoundry MiniMax-H3 blocks, refiner, RoPE, Qwen3-VL encoder, codecs, and MP4 muxer.
- Pruned rank-8 AdaLN table interpolation, strict LoRA + full-override fusion, FlowEulerODE scheduling, and pure-PyTorch
  SolH3DWDHead run without mmcv or lakonlab runtime dependencies.
- DWD variants (2step-dwd, 4step-dwd) decode RGB frames directly from final-step transformer features and skip video VAE decode.
- Non-DWD variants (2step, 4step) decode final video latents with the canonical MiniMax-H3 video VAE; all variants decode 32 kHz
  stereo audio with the canonical audio VAE.
- Verified on H200 with real MiniMax-H3-Pruned + pi_h3_4step_dwd_adapter weights (1376x768, 124 frames, 4 steps, DWD without video VAE, 32 kHz stereo AAC). Remaining variants, FP8 quantization, and Sol sparse kernels remain pending.
