notes:
- Uses the official Base-Act preview checkpoint; Base-Cam is not substituted.
- The dedicated LingBot environment is retained because unified-env act2cam parity produced near-black output.
- An H100 in the dedicated environment generated a 17-frame, 8-step video from
  the official example image and a forward [F,4] WASD matrix; the official
  full-length settings remain untested.
- A previous dedicated-environment GPU run generated 49 frames at 40 steps from
  a real room image with forward camera poses and a nonzero [F,4] action matrix.
  The two controls were not separately ablated.
- The public WorldFoundryPipelineRunner binding generated the 17-frame, 8-step
  cat example; its MP4 decoded fully at 544x720 and 16 fps. The public runner
  has not been exercised at the official 161-frame length.
