notes:
- Base Cosmos3 selection routes to Nano; select the cosmos3-super variant for the Super checkpoint.
- This generator binding exposes T2I, T2V, I2V, and V2V inference, optional synchronized
  sound, and structured policy, forward-dynamics, and inverse-dynamics action inference.
- Cosmos3 Reasoner, training, and vLLM/vLLM-Omni serving workflows are intentionally
  outside this infer-only integration.
- Native transformer loading is structurally exact (814/814 keys for Nano), the shared Wan
  VAE38 mapping is exact (196/196), and the AVAE decoder is exact (182/182).
- The native 35-step Karras flow-UniPC schedule and numerical updates match the official
  scheduler exactly. End-to-end GPU output parity for this new native path remains pending.
- Use prepare_model_infer.sh to emit a revision report and an explicit pinned snapshot model-ref;
  an existing unverified or older Cosmos3-Nano directory is not evidence for this profile revision.
- Safety screening is an orchestration extension rather than part of the native diffusion
  model runtime; the generator itself has no guardrail framework dependency.
