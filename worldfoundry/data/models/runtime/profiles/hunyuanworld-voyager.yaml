notes:
- The in-tree bridge calls a separate official checkout at revision
  6218ccd36df77d0254dcf24ad1fb77312f75b04a; Tencent's community-licensed
  source and weights are not redistributed in this package.
- Set WORLDFOUNDRY_VOYAGER_SOURCE_ROOT to that checkout and
  WORLDFOUNDRY_VOYAGER_PYTHON to an environment with the official dependencies;
  the bridge validates source, checkpoints, and a 49-frame condition directory.
- Camera motion must already be rendered into the 49-frame condition directory.
  A raw image or action sequence alone is not a supported input.
- The official case1 checkpoint generated an RGB-D MP4 on one H100 at 8 steps;
  the public runner generated RGB-D MP4s at 1 and 8 steps. All decoded as 45
  frames at 768x1024 and 24 fps. The upstream pipeline drops four conditioning
  frames and removes a 16-pixel separator from its internal RGB-D frame.
- The public runner also completed the upstream case1 50-step single-GPU
  default on H100 GPU2; its RGB-D output decoded 45/45 frames and visibly
  advanced toward the well. This does not measure metric depth or calibrated
  camera-pose accuracy.
- The upstream Tencent HunyuanWorld-Voyager Community License excludes use in
  the EU, UK, and South Korea and requires its LICENSE and NOTICE on redistribution.
