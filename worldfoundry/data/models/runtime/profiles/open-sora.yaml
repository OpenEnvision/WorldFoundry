notes:
- Transformers 4.57+ requires torch 2.6 or newer to load the released T5 PyTorch .bin shards directly.
  The pinned torch 2.5.1 runtime instead requires a separate derived safetensors directory.
  Run worldfoundry/synthesis/visual_generation/open_sora/open_sora_runtime/tools/convert_t5_to_safetensors.py
  with --source ../ckpts/DeepFloyd--t5-v1_1-xxl and
  --output ../ckpts/DeepFloyd--t5-v1_1-xxl-safetensors before inference.
