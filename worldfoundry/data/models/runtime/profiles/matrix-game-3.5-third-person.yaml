notes:
- Subject references are optional; paths may name an official export directory, one image, or a sequence of zero to four crops.
- Each block generates 84 new frames and consumes 84 camera poses; the exported history also includes the anchor frame.
- The currently released checkpoint is the 25-step bidirectional 5B base model, not the announced few-step real-time distilled model.
- Memory visualization, subject-reference preview, and inference logs are persisted beside the primary video when produced.
- A one-step, one-block A100 80GB run with one subject reference passed on 2026-07-20; the default 25-step route, upstream official-sample parity, and benchmark scoring are still pending.
