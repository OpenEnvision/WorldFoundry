notes:
- Offline low-poly rendering uses the shared autoregressive-window runner and canonical Wan2.2 VAE and UMT5.
- The first control chunk has one RGB frame; subsequent chunks have four. A separate sink only primes KV history.
- Each request owns its KV state. A session supports at most 8192 generated latent chunks without position wrapping.
- File input preserves source FPS unless explicitly overridden. Tensor input defaults to 20 FPS.
- Public-loader 5-frame and 100-frame BF16/SDPA checkpoint cases on H100 match pinned upstream latent and decoded RGB values exactly.
- The 100-frame synthetic-pan case verifies KV eviction, tail trimming, A/B/A reuse, interrupted-request recovery and unchanged global RNG.
- Accepted-reference release replay, gameplay quality and throughput remain pending.
