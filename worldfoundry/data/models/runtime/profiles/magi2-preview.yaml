notes:
- MAGI-2-preview 114B MoE (256 experts, top-6, 6B active/token) audio+video DiT, ported from SandAI Apache-2.0.
- T2V supports joint preview audio and optional video-only refinement. Image conditioning is rejected.
- Refiner defaults are five UniPC steps, shift 5, guidance 2, zero-SNR renoise index 220, and a 1920x1088 latent decode target. It doubles temporal resolution and exports at 25 fps while preserving preview audio.
- H100 Refiner-stage replay used a checkpoint-generated Preview latent and real Qwen3.5, Refiner, and Turbo weights; five steps and seed 42 exported 249 frames at 128x128 and 25 fps with the original stereo 44.1 kHz audio.
- Default-resolution Refiner replay and official numerical/visual parity are pending.
- Preview video uses 12.5 fps and the released stride-8 latent geometry. The native preset uses 100 steps, shift 7, video guidance 5, audio guidance 7, and negative-prompt conditioning.
- The released checkpoint supports 10-second clips only; other durations are rejected before loading weights. The default landscape preview is 896x512.
- Upstream targets 8xHopper; this port collapses cp/ep/dp to single-GPU (sequential residency for the 114B MoE).
