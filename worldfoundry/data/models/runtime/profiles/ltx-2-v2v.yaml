notes:
- Official V2V path uses the distilled LTX-2 checkpoint with Pose-Control IC-LoRA.
- The input video must encode body-pose control; arbitrary RGB footage is not an equivalent conditioning signal.
- The official ltx-pipelines runtime must be installed in the selected Python environment; set LTX_PIPELINES_PYTHON when it differs from WorldFoundry's interpreter.
- A 17-frame 256x256 synthetic static-pose case completed the public binding; dynamic motion and default-resolution quality remain unverified.
