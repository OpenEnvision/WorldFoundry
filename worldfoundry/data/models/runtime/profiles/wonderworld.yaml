notes:
- Native standard-runner recipes own SD2/Marigold diffusion; no upstream checkout, Diffusers pipeline, Flask server, or PyTorch3D extension is required.
- The single RGB image is resized to 512x512. Each optional camera matrix requests one new world view, starting from an identity seed camera.
- Camera paths use row-major OpenCV world-to-camera matrices; named upstream viewer matrices use column-major 16-vectors.
- Exported scene depth equals Marigold scene depth times 1000; camera translations use these exported units.
- Guided depth uses the final eight Euler steps and known scene/ground anchors; latent noise and U-Net input remain unscaled as in the pinned source.
- gsplat supplies differentiable projections and sorted tile lists; native Triton RGB/alpha and median depth share alpha cap 0.99 and retain the surface crossing the termination threshold.
- Fitting uses 0.8 L1 plus 0.2 DSSIM. Integration contracts and numerical comparison are separate from scene-quality observations; full official pipeline parity remains pending.
- New Gaussians precede the frozen scene at equal depth; only their bounded particle range is fitted and pruned.
- Upstream reports 48 GB VRAM. Local component weights and a CUDA-compatible gsplat installation are required.
- No separate WonderWorld generator checkpoint is needed. SD2 uses CreativeML Open RAIL++-M; retain all component licensing terms.
