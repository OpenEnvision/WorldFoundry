notes:
- Supply generator_ckpt and wan_base at loading; stage selects 1 (teacher) or 2 (distilled generator).
- Camera action durations count latent frames; label zero is static at the initial frame.
- HY15/LTX training recipes and compressed-history training are not standalone supported inference paths.
- Full causal VAE decoding is performed once after generation.
