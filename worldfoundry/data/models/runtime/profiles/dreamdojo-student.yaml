notes:
- Native causal action DiT reuses canonical Cosmos parameters, Reason1 conditioning, and Wan video encoding/decoding.
- Explicit student_checkpoint_path is required. The pinned DreamDojo Hub snapshot contains no distilled student weights; post-trained teacher weights are not substituted.
- Student checkpoints may be an exported EMA file, an iteration directory containing model/.metadata, or the DCP model directory itself.
- TrigFlow uses one to four released sampling times and distilled guidance. Playback is 10 fps; measured inference throughput is pending student-weight replay.
- First STEP consumes 12 normalized 384-D actions and returns 13 frames. Each subsequent STEP consumes 4 new actions and returns 4 new frames.
- Continuation retains nine RGB frames and eight historical actions; new actions condition only their corresponding generated latent transition.
- KV caches are request-local, store only clean prefill, retain at most three latent frames per layer, and are released after each window.
- Reset discards rollout history and cached text conditioning while keeping model weights resident. Offline calls own isolated sessions.
- Dataset normalization, teleoperation-to-action mapping, and robot control remain caller-owned.
- Student checkpoint-backed output quality, official parity, closed-loop robot quality, and 10-fps generation throughput are not yet validated.
