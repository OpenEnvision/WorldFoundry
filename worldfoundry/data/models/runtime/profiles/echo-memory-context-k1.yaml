notes:
- Public model identity is permanently bound to release tier paper_primary and checkpoint context_k1/epoch-0.safetensors.
- The official Hugging Face main branch serves this checkpoint. The 2026-07-20 A100 artifact predates the NativeDiffusionPipeline cutover; fresh native CUDA artifact validation is pending.
- The rollout owns a BaseMemory frame store and submits DiffusionRequest inputs to the canonical frozen-context execution strategy.
- The sampler uses target-noise followed by clean-context suffix, target-only CFG, context relocking after every solver step, and target-only decode.
- FSDP and USP are rejected until distributed checkpoint parity is validated.
- Upstream official-sample parity and benchmark scoring remain pending.
