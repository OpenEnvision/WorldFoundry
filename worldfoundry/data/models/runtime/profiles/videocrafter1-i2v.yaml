schema_version: 2
model_id: videocrafter1-i2v
display_name: VideoCrafter1 I2V
task_family: video_generation
groups:
- video
- image_to_video
- videocrafter
source_repos:
- url: https://github.com/VideoCrafter/VideoCrafter
checkpoints:
- role: image_to_video_checkpoint
  repo_id: VideoCrafter/Image2Video-512
  local_dir: ${WORLDFOUNDRY_HFD_ROOT}/VideoCrafter--Image2Video-512/model.ckpt
- role: image_encoder
  repo_id: laion/CLIP-ViT-H-14-laion2B-s32B-b79K
  local_dir: ${WORLDFOUNDRY_HFD_ROOT}/laion--CLIP-ViT-H-14-laion2B-s32B-b79K
  required_paths:
  - open_clip_pytorch_model.bin
input_schema:
  prompt: true
  image: true
  video: false
artifact_kind: generated_video
artifact_filename: videocrafter1-i2v.mp4
execution:
  backend_stage: official_in_tree_runtime
  runtime_status: official_in_tree_runtime_ready
  integration_status: integrated
  pipeline_binding: videocrafter1-i2v
integration:
  status: integrated
notes:
- VideoCrafter infer-only runtime code is packaged in-tree.
- Training, dataset, and checkpoint download helpers are intentionally excluded.
