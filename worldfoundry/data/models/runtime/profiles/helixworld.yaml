notes:
- Reuses native LTX transformers, Gemma conditioning, video/audio VAE, vocoder, checkpoint loading and media IO.
- Four-step stochastic joint generation uses four latent frames per chunk and rebuilt prefix-plus-recent context.
- Released checkpoint tensor names and shapes match; small-graph CPU generation matches upstream within 1e-6.
- Full-checkpoint BF16 CUDA generation on H100 80 GB with default block offload exports 121 frames at 768x512 with 48 kHz stereo audio.
- The checkpoint-backed run took 24.1 seconds after loading; peak CUDA allocations were 26.0 GiB and reservations were 37.6 GiB.
- The official BF16 reference run uses about 70 GB VRAM; an 80 GB GPU is recommended.
