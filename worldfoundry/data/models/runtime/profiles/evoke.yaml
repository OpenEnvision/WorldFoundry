license: apache-2.0
usage_restrictions:
- ViGeo1.1 model weights are CC-BY-NC-4.0 and are not licensed for commercial use.
notes:
- Runtime source is always resolved from the bundled tree; external source checkouts are rejected.
- Checkpoints are resolved strictly from local WorldFoundry/Hugging Face storage and all subprocess Hub clients run offline.
- A supplied camera trajectory enables geometric state for i2v/v2v and requires the separately acquired ViGeo1.1 weights.
- The released post-distillation checkpoint was trained with v2v conditioning; its i2v and t2v modes are upstream-documented zero-shot capabilities.
- This is an inference compatibility port to the shared WorldFoundry environment, not a claim of parity with Evoke's pinned training stack.
