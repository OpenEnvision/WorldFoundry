notes:
- H3-World reuses WorldFoundry's canonical MiniMax-H3 transformer, Qwen3-VL encoder, codecs, packed sequence builder, denoise loop, and MP4 writer.
- The rank-32 LoRA checkpoint (step-10000.safetensors) is converted from grouped per-head QKV into WorldFoundry's split QKV layout and merged at load time.
- Per-latent English action clauses are encoded independently, placed at mirrored RoPE offsets, isolated in the token refiner, and routed to their matching video latent via directed attention.
- Verified on H200 with real MiniMax-H3 FL2VA + H3-World step-10000.safetensors weights (832x480, 124 frames, 50 steps, 32 kHz stereo AAC) on forward and pan-right-fast presets.
