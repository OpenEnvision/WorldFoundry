notes:
- FastFramesPipeline loads FastFrames-S (1.3B) by default; pass variant="fastframes-l" (or "ff-l") for FastFrames-L (14B).
- Reuses WorldFoundry's canonical Wan2.1 norms, RoPE, sinusoidal timestep embeddings, UMT5-XXL encoder, and H.264 MP4 export.
- Verified on H200 with real FastFrames-S checkpoints (832x480, 81 frames, 16 fps, context="refiner"); FastFrames-L (14B) real-checkpoint GPU replay remains pending.
