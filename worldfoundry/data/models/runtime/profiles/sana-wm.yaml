notes:
- SANA-WM reuses the canonical Sana network, encoder, autoencoder, scheduler, and
  recipe roles; no modality-owned Sana runtime remains.
- The current bidirectional native recipe runs stage-one sampling and direct LTX-2 VAE
  decoding with native 8k+1 temporal windows; it does not load the LTX-2 refiner.
- A single H100 run generated 33 decodable 1280x704 frames at 60 sampling steps.
  Visual review found dark, coarse output with initial-frame artifacts. This validates
  stage-one execution only, not parity with the official refined quality path.
