notes:
- Native action-conditioned Cosmos DiT, shared Reason1 text encoder, Wan video codec, and positive-CFG UniPC.
- Each 12-action chunk generates 13 frames; continuation observes the final generated frame and omits duplicate boundary frames.
- Actions must already be normalized in the official 384-dimensional unified space; dataset-specific statistics remain caller-owned.
- Distributed checkpoints are converted to model_ema_bf16.pt through the packaged conversion helper.
- This profile covers offline 2B GR-1 post-trained inference. The separate dreamdojo-student profile supports distilled offline and resident streaming with explicit student weights. Other checkpoint scales remain unsupported.
- H100 checkpoint-backed public-loader smoke generated 13 frames at 480x640 and 5 fps with neutral normalized actions, 35 steps, and seed 42.
- Two-chunk A/B/A public-loader replay used 24 actions per request and exported 25 frames per request. Repeated A pixels matched exactly; changed actions changed generated pixels.
- Official numerical and robot-task parity are pending.
