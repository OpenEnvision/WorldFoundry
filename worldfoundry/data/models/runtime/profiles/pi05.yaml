notes:
- pi0.5 is a concrete OpenPI algorithm entry routed through the in-tree OpenPI runtime.
- WorldFoundry keeps the inference-only OpenPI runtime directly under worldfoundry/synthesis/action_generation/openpi.
- Default runtime config uses pi05_libero. Stage its Orbax checkpoint under the
  same openpi-assets root used by the OpenPI profile, or pass an explicit path.
- Metadata checks alone do not establish that pi05_base or pi05_droid can run.
- The independent pi05 public binding produced finite 10x7 actions with pi05_libero on GPU2 from synthetic dual-camera images and checkpoint-mean state; no LIBERO task-success claim.
- This profile emits action_trace artifacts and is not a video-generation profile.
