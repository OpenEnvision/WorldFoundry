notes:
- Runs the pinned official checkout through a small WorldFoundry launcher; upstream SAM-licensed source is not vendored.
- Set WORLDFOUNDRY_WILDDET3D_SOURCE to the cloned checkout with SAM3 and LingBot-Depth submodules, or stage it under the configured model source root.
- Requires the full detector checkpoint and official robbyant/lingbot-depth-postrain-dc-vitl14/model.pt for geometry architecture construction.
- Pass image_path and a comma-separated class prompt; optional intrinsics_path is a 3x3 NumPy matrix. Output is a NumPy archive of detections and depth.
