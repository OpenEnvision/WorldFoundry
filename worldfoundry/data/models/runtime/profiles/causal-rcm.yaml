notes:
- Causal-rCM generates autoregressively over latent-frame chunks. first_chunk_t and chunk_t select the
  schedule; the c1-1 frame-wise setting gives the lowest streaming latency and c3-3 more throughput.
- The released causal entrypoint is prompt and image conditioned. It exposes no discrete action space,
  so the input schema declares no actions; the chunk schedule is the streaming control surface.
- Distilled few-step sampling is the default (`distilled=True`, 4 steps, mid_t 15/16 5/6 5/8). Setting
  distilled=False samples the multi-step causal-diffusion teacher with CFG instead.
- Setting context_from_last_step=True caches the final denoising forward as the next chunk's context,
  saving one clean forward pass per chunk. Use it only with a checkpoint trained for noisy context.
- Inference benchmarking is built in: set warmup_iters and num_runs to report averaged timings.
- Set kv_cache_policy=sliding_window to cap the causal cache at kv_cache_window_blocks (with optional
  kv_cache_sink_blocks) and allocate only the retained prefix plus one in-flight chunk. The default
  keep_all policy reproduces the upstream unbounded cache bit-for-bit. RoPE-remapping cache policies
  stay out of this post-RoPE entrypoint and require the separate extrapolation path.
- The upstream imaginaire package is not vendored. WorldFoundry's lazy_config, easy_io, rank-aware
  logging, and selective activation checkpointing back the vendored runtime instead.
