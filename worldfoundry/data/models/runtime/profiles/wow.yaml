notes:
- The WoW Wan route is assembled from canonical Wan roles; checkpoint structure
  determines whether first-frame conditioning is VAE-only or also uses CLIP.
- The local 1.3B 2M release matches the native graph exactly for 825/825 tensors.
- The WoW DiT 2B route uses the canonical Cosmos Predict2 recipe with the WoW
  transformer supplied through dit_path/model_path; no copied Cosmos runtime remains.
- The pinned DiT 2B Hub snapshot does not contain the expected wow_dit_2b.pt file,
  so callers must provide that local checkpoint and checkpoint-backed validation is pending.
- Native DiT 2B currently supports one process; canonical Cosmos2 context parallelism,
  prompt refinement, and guardrails remain explicit pending capabilities.
- WoWPipeline accepts native Hugging Face repo ids or local checkpoint directories.
- >
  The recorded Wan 14B 600k Workspace artifact predates the native cutover. A fresh
  native CUDA run is required before artifact parity can be promoted.
