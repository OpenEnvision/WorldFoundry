notes:
- Runtime gates check only assets needed by the chosen variant; no network downloads.
- CS:GO uses variant=csgo or DIAMONDCsgoPipeline; named action or actions_path (JSON/NPY
  T-by-51 multi-hot), spawn_id/spawn_dir, sampler=fast|higher_quality.
- headless_steps N produces N+1 frames including the initial observation. Atari uses
  horizon50/terminal resets; CS:GO runs a finite continuous rollout.
- H100 validation:26 Atari checkpoints and short paired CS:GO rollouts. Long-horizon
  quality and game success are not established.
