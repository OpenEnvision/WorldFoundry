conda_packages:
- python
- pip
- ffmpeg
cuda_profile: cu128
driver_status: compatible
env_name: worldfoundry-unified-cu128
env_root: ${WORLDFOUNDRY_CONDA_ENVS_ROOT}
model_id: pi4
notes:
- Runs in the shared WorldFoundry unified CUDA 12.8 environment using the checkpoint-identical pure-PyTorch sparse 3D DepthRefiner fallback when flex_gemm is not installed.
- For maximum throughput on long high-resolution video sequences on CUDA, optionally install JeffreyXiang/FlexGEMM pinned at revision b2fadb29d41846c7981ade6801ffc689fae119cf (requires Triton and a C compiler); Pi4 automatically delegates sparse 3D layers to flex_gemm.nn on CUDA when present.
- Pi4 code and weights (yyfz233/Pi4) are licensed under CC BY-NC 4.0 (non-commercial use only).
pip_packages:
- torch
- torchvision
- numpy
- pillow
- opencv-python
- plyfile
- safetensors
- huggingface-hub
python: '3.11'
validation_imports:
- torch
- torchvision
- numpy
- PIL
- cv2
- plyfile
- safetensors
- huggingface_hub
