conda_packages:
- python
- pip
cuda_profile: cu128
driver_status: requires_cuda_compatible_gsplat
env_name: worldfoundry-unified
env_root: ${WORLDFOUNDRY_CONDA_ENVS_ROOT}
model_id: wonderworld
notes:
- Uses the unified WorldFoundry GPU environment and an ABI-compatible gsplat build.
- All inference orchestration is in-tree; no external checkout, PyTorch3D, Flask server, or OpenAI credential is needed.
- Stage the public SD2 Inpainting, Marigold depth/normals, OneFormer ADE20K metadata/weights, and RepViT-SAM weights outside the source tree.
pip_packages:
- torch
- torchvision
- transformers
- diffusers
- timm
- gsplat
- triton
- matplotlib
- scipy
- opencv-python
- pillow
python: '3.11'
validation_imports:
- torch
- transformers
- diffusers
- gsplat
- triton
- matplotlib
- timm
- cv2
