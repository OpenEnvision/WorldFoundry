conda_packages:
- python
- pip
cuda_profile: cpu
driver_status: cpu_reference_environment_gpu_inference_verified_separately
env_name: worldfoundry-unified-cu128
env_root: ${WORLDFOUNDRY_CONDA_ENVS_ROOT}
model_id: rt-1
notes:
- This declared environment is a CPU reference profile. The official RT-1 SavedModels
  completed offline GPU action inference in a separate TensorFlow 2.15.1 environment
  with CuDNN 8.9.7; users need a compatible GPU TensorFlow environment for GPU runs.
- A checkpoint-compatible 512-D language embedding must be supplied to every action
  request. The released SavedModel does not encode prompt text internally.
pip_packages:
- numpy
- Pillow
- opencv-python
- tensorflow-cpu
- tensorflow-probability
- gin-config
- tf-agents
- tf-slim
- tensorflow-serving-api
python: '3.10'
validation_imports:
- numpy
- PIL
- cv2
