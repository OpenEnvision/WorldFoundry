conda_packages:
- python
- pip
- ffmpeg
cuda_profile: cu128
driver_status: compatible_unified_default
env_name: worldfoundry-unified-cu128
env_root: ${WORLDFOUNDRY_CONDA_ENVS_ROOT}
model_id: step-video-t2v
notes:
- Step-Video-T2V uses WorldFoundry's shared native diffusion runtime. Prompt encoding,
  denoising, and VAE decoding are in-process and do not require xFuser or HTTP services.
pip_packages:
- torch
- transformers
- sentencepiece
- safetensors
- imageio
- imageio-ffmpeg
- numpy
- einops
- ffmpeg-python
- packaging
python: '3.11'
validation_imports:
- torch
- transformers
- safetensors
- sentencepiece
