conda_packages:
- python
- pip
- ffmpeg
- cuda-nvcc
cuda_profile: cu128
driver_status: compatible
env_name: worldfoundry-unified-cu128
env_root: ${WORLDFOUNDRY_CONDA_ENVS_ROOT}
model_id: skyreels-v3
notes:
- SkyReels V3 runs through WorldFoundry native diffusion and shares the standard CUDA environment with Wan models.
- Block/component offload is selected through RuntimePolicy; no model-specific Diffusers, torchao, or xFuser runtime is used.
pip_packages:
- torch
- transformers
- safetensors
- numpy
- einops
python: '3.11'
validation_imports:
- torch
- transformers
