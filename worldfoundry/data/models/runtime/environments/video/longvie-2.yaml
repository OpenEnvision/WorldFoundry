conda_packages:
- python=3.10
- pip
- ffmpeg
- setuptools
- wheel
cuda_profile: cu128
driver_status: compatible
env_name: worldfoundry-longvie-cu128
env_root: ${WORLDFOUNDRY_CONDA_ENVS_ROOT}
model_id: longvie-2
notes:
- Mirrors the dependencies needed by LongVie 2 on WorldFoundry's native Wan runtime.
- Shares LongVie 1's dedicated Transformers 4.57 overlay while inheriting the unified CUDA/Wan dependencies.
- Pins kernels 0.12.1 because kernels 0.13 requires huggingface-hub 1.3+, which is incompatible with the Transformers
  4.57 overlay's huggingface-hub <1 constraint.
- Studio launches the quality profile with four torchrun ranks using the in-tree Ulysses implementation (USP ring=1,
  ulysses=4); rank 0 alone writes output artifacts, with no external xFuser dependency.
- execute=True loads control.safetensors and dit.safetensors from WORLDFOUNDRY_HFD_ROOT or the bench-local ckpt/hfd fallback;
  every segment requires user-provided image/prompt/dense-depth/sparse-track conditioning.
- Full checkpoint-backed parity should be run in this isolated env because the base test env may not include video-generation
  optional dependencies.
pip_packages:
- torch
- torchvision
- transformers>=4.57.0,<5
- accelerate
- peft
- imageio
- imageio[ffmpeg]
- safetensors
- einops
- sentencepiece
- protobuf
- modelscope
- ftfy
- pynvml
- pandas
- decord
- pillow
- numpy
- opencv-python
- huggingface_hub>=0.34,<1
- kernels==0.12.1
python: '3.10'
validation_imports:
- torch
- torchvision
- transformers
- accelerate
- peft
- imageio
- safetensors
- einops
- sentencepiece
- modelscope
- ftfy
- pynvml
- pandas
- decord
- PIL
- numpy
- cv2
- kernels
