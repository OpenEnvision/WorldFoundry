conda_packages:
- python
- pip
- ffmpeg
cuda_profile: cu128
driver_status: compatible
env_name: worldfoundry-unified-cu128
env_root: ${WORLDFOUNDRY_CONDA_ENVS_ROOT}
model_id: fastframes
notes:
- FastFrames runs natively in the unified WorldFoundry CUDA 12.8 environment without requiring flash-attn; attention
  prefers PyTorch cuDNN SDPA on CUDA BF16 and falls back to standard PyTorch SDPA otherwise.
- FastFrames-S (1.3B) runs on a single GPU; FastFrames-L (14B) uses BF16 weights and bridged pixel decoding.
pip_packages:
- torch>=2.7
- torchvision
- transformers>=4.49.0
- tokenizers>=0.20.3
- safetensors>=0.4
- numpy
- ftfy
- regex
- sentencepiece
- imageio
- imageio-ffmpeg
- av
python: '3.10'
validation_imports:
- torch
- safetensors
- transformers
- ftfy
