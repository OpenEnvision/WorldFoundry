model_id: cosmos3
env_name: worldfoundry-cosmos3-cu128
env_root: ${WORLDFOUNDRY_CONDA_ENVS_ROOT}
python: '3.11'
cuda_profile: cu128
driver_status: compatible
pip_extra_index_url: https://download.pytorch.org/whl/cu128
conda_packages:
- python=3.11
- pip
- conda-forge::ffmpeg
pip_packages:
- torch==2.10.0
- torchvision==0.25.0
- transformers>=4.57,<6
- accelerate>=0.31
- huggingface-hub>=0.34,<2
- fastapi>=0.116
- pydantic>=2,<3
- PyYAML>=6
- msgpack
- websockets
- av
- imageio
- imageio-ffmpeg
- safetensors
- pillow
- numpy
- einops
- ftfy
validation_imports:
- torch
- torchvision
- transformers
- accelerate
- fastapi
- pydantic
- yaml
- msgpack
- websockets
- imageio_ffmpeg
- worldfoundry.base_models.diffusion_model.models.networks.cosmos3
- worldfoundry.base_models.diffusion_model.models.autoencoders.cosmos3
- worldfoundry.base_models.diffusion_model.schedulers.cosmos3
- worldfoundry.studio.workspace_job
notes:
- Uses WorldFoundry's native diffusion loader, joint-modality runner, core attention,
  Wan VAE38, and flow-UniPC implementation. Diffusers is not installed or imported.
- Synchronized sound uses the inference-only native AVAE decoder loaded directly from
  the official sound-tokenizer safetensors component.
- Cosmos3 Reasoner, training, and vLLM/vLLM-Omni serving dependencies are intentionally omitted.
- Includes the minimal FastAPI/Pydantic/YAML surface imported by workspace_job so the dedicated model
  environment can execute the real Workspace inference entrypoint, not only the base runtime. Msgpack
  and WebSockets complete the declared WorldFoundry job/transport dependency surface.
- Pins ffmpeg to conda-forge to keep its OpenH264 ABI consistent; core audio muxing also falls back to
  the imageio-ffmpeg bundled executable if a host ffmpeg binary cannot start.
