model_id: uniworld-view
env_name: uniworld-view-cu124
env_root: ${WORLDFOUNDRY_CONDA_ENVS_ROOT}
python: '3.10'
cuda_profile: cu124
driver_status: compatible
pip_extra_index_url: https://download.pytorch.org/whl/cu124
conda_packages:
- python=3.10
- pip
- ffmpeg
- eigen
pip_packages:
- torch==2.4.0+cu124
- torchvision==0.19.0+cu124
- diffusers==0.35.0
- transformers==4.48.3
- accelerate==1.10.1
- huggingface-hub==0.34.4
- tokenizers==0.21.0
- timm==1.0.14
- hydra-core==1.3.2
- omegaconf==2.3.0
- einops==0.8.1
- numpy==1.26.4
- scipy==1.15.1
- Pillow==10.4.0
- opencv-python==4.11.0.86
- imageio==2.37.0
- imageio-ffmpeg==0.6.0
- trimesh==4.6.2
- kornia==0.8.2
validation_imports:
- torch
- torchvision
- diffusers
- transformers
- accelerate
- hydra
- einops
- numpy
- cv2
- imageio
notes:
- Install the full pinned official requirements.txt in this dedicated environment; these listed packages are the critical ABI pins, not a replacement for upstream requirements.
- Install carvekit with --no-deps and build PyTorch3D from upstream's extern/install_pytorch3d.sh for the default hybrid/mesh renderer.
- Upstream inference requires its STream3R, SAM2, MoGe and renderer source trees under extern; point UNIWORLD_VIEW_REPO and UNIWORLD_VIEW_PYTHON to the local checkout and environment.
