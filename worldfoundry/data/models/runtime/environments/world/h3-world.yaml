schema_version: 2
model_id: h3-world
env_name: worldfoundry-unified-cu128
env_root: ${WORLDFOUNDRY_CONDA_ENVS_ROOT}
python: '3.11'
cuda_profile: cu128
conda_packages: [python=3.11, pip, ffmpeg]
pip_extra_index_url: https://download.pytorch.org/whl/cu128
pip_packages:
- torch
- torchvision
- torchaudio
- transformers
- accelerate
- safetensors
- numpy
- av
- pillow
- pyyaml
validation_imports: [torch, transformers, safetensors, numpy, av, PIL, worldfoundry.pipelines.h3_world]
notes:
- H3-World runs in-tree over WorldFoundry's canonical MiniMax-H3 components inside the unified environment.
- MiniMax-H3 FL2VA base weights and the H3-World LoRA checkpoint stay outside Git and are injected via the runtime profile.
