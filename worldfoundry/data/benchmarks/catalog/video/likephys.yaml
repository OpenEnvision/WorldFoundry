id: likephys
name: LikePhys
publisher: University of Oxford
publisher_kind: university
benchmark_kind:
- text-to-video
- physical-understanding
- model-likelihood-probe
domains:
- physics
- intuitive-physics
- rigid-body
- fluid-dynamics
- deformable
- optics
modalities:
- text
- video
status: confirmed_official_code_and_hf_data
official_sources:
  github:
    url: https://github.com/YuanJianhao508/LikePhys
    verified_by: git clone --depth 1 https://github.com/YuanJianhao508/LikePhys
    default_branch: main
  paper_url: https://arxiv.org/abs/2510.11512
  project_page: https://yuanjianhao508.github.io/LikePhys/
  venue: ICLR 2026
  huggingface_datasets:
  - repo_id: JianhaoDYDY/LikePhys-Benchmark
    verified_by: HEAD https://huggingface.co/api/datasets/JianhaoDYDY/LikePhys-Benchmark
    sha: 30fc7a194a7c4eb1de9102f49c7355121ba79b1f
    license: apache-2.0
    private: false
    gated: false
benchmark_assets:
  scenario_suite:
    status: confirmed_hf_dataset
    path_or_ref: data/<scenario>_videos/subgroup_XXX/<variation>_<index>.mp4
evaluation_surface:
  purpose: Training-free likelihood-preference probe of intuitive physics in video diffusion models.
  probes_model_internals: true
  requires_generated_videos: false
  scenario_count: 12
  subgroups_per_scenario: 10
  clip_count: 920
  protocol: ELBO-surrogate denoising loss over paired valid/impossible clips, scored by pairwise mis-rank rate.
metrics:
- id: likephys_misrank_rate
  name: LikePhys Mis-Rank Rate
  description: Variation-weighted mean mis-rank rate over every scored scenario/variation pair.
  higher_is_better: false
  leaderboard_key: likephys_misrank_rate
  aggregator: mean
  output_unit: rate
  primary: true
- id: likephys_dataset_weighted_misrank_rate
  name: LikePhys Scenario-Weighted Mis-Rank Rate
  description: Mean over per-scenario mis-rank rates, weighting each of the 12 scenarios equally.
  higher_is_better: false
  leaderboard_key: likephys_dataset_weighted_misrank_rate
  aggregator: mean
  output_unit: rate
- id: rigid_body_misrank_rate
  name: Rigid-Body Mis-Rank Rate
  description: Mis-rank over ball drop, ball collision, pendulum, block slide, and pyramid scenarios.
  higher_is_better: false
  leaderboard_key: rigid_body_misrank_rate
  aggregator: mean
  output_unit: rate
- id: fluid_misrank_rate
  name: Fluid Mis-Rank Rate
  description: Mis-rank over droplet, faucet, and river fluid scenarios.
  higher_is_better: false
  leaderboard_key: fluid_misrank_rate
  aggregator: mean
  output_unit: rate
- id: deformable_misrank_rate
  name: Deformable Mis-Rank Rate
  description: Mis-rank over cloth drape and waving flag scenarios.
  higher_is_better: false
  leaderboard_key: deformable_misrank_rate
  aggregator: mean
  output_unit: rate
- id: optics_misrank_rate
  name: Optics Mis-Rank Rate
  description: Mis-rank over moving-light and moving-camera shadow scenarios.
  higher_is_better: false
  leaderboard_key: optics_misrank_rate
  aggregator: mean
  output_unit: rate
- id: temporal_disorder_misrank_rate
  name: Temporal Disorder Mis-Rank Rate
  description: Mis-rank restricted to the temporal_disorder variation shared by all 12 scenarios.
  higher_is_better: false
  leaderboard_key: temporal_disorder_misrank_rate
  aggregator: mean
  output_unit: rate
runner:
  scoring:
    engines: [physics_contract]
    hooks:
      physics_contract: worldfoundry.evaluation.tasks.execution.runners.likephys.likephys_contract_evaluator:write_likephys_evaluation
  official_script: worldfoundry/evaluation/tasks/execution/runners/likephys/run_likephys_official_runner.py
  workspace:
    module: worldfoundry.evaluation.tasks.execution.runners.likephys.run_likephys_official_runner
    generated_arg: --generated-artifact-dir
    dataset_root_arg: --benchmark-data-root
    limit_arg: --limit
    benchmark_id_arg: --benchmark-id
    model_arg: --probe-model
    supports_official_runtime: true
    default_metrics: [likephys_misrank_rate]
    input_kind: likephys_results_root_or_probe_dataset
  runner_target: worldfoundry.evaluation.tasks.contracts.external:LikePhysContract
  official_runner_script: worldfoundry/evaluation/tasks/execution/runners/likephys/run_likephys_official_runner.py
  validation_command:
  - worldfoundry-eval
  - zoo
  - benchmark-run
  - --benchmark-id
  - likephys
  - --mode
  - official-validation
  - --official-results-path
  - <likephys_results_root>
  - --output-dir
  - <out>
  - --json
  runtime:
    kind: in_tree_official_runner
    root: worldfoundry/evaluation/tasks/execution/runners/likephys
    repo_url: https://github.com/YuanJianhao508/LikePhys.git
    evaluator_root_env: WORLDFOUNDRY_LIKEPHYS_EVALUATOR_ROOT
    results_path_env: WORLDFOUNDRY_LIKEPHYS_RESULTS_PATH
    data_root_env: WORLDFOUNDRY_LIKEPHYS_DATA_ROOT
    generated_artifact_dir_env: WORLDFOUNDRY_GENERATED_ARTIFACT_DIR
  expected_artifacts:
  - scorecard.json
  - benchmark_contract.json
  - raw_metric_table.jsonl
  - misrank_breakdown.json
  verification_status: result_normalizer_ready_probe_requires_upstream_checkout
  notes:
  - LikePhys scores a video diffusion model rather than generated videos; there is no candidate-video input.
  - The in-tree mis-rank formulas reproduce evaluator.py compute_misrank_normalized and read_exp_final.py aggregation, including the filter_config variation exclusions.
  - The --run-official probe drives the upstream evaluator.py from a caller-supplied checkout because it needs the upstream forked diffusers pipelines and schedulers; it requires CUDA and the probed checkpoints.
integration:
  status: integrated
  tier: in_tree
  hf_dataset_id: JianhaoDYDY/LikePhys-Benchmark
  blocked_reasons:
  - The ELBO probe needs an official LikePhys checkout (WORLDFOUNDRY_LIKEPHYS_EVALUATOR_ROOT), CUDA, and the probed diffusion checkpoints; WorldFoundry does not vendor the upstream pipeline/scheduler forks.
  - Imported results_<model>.json artifacts are normalized faithfully but are not official-run evidence.
release_status: experimental
maturity: contract_ready
open_source_status: experimental
official_benchmark_verified: false
integration_evidence: false
leaderboard_valid: false
requires:
- results_<model>.json artifacts, or --run-official with a LikePhys checkout and the benchmark dataset
- --probe-model <model_key> when a results root holds several probe backends
- JianhaoDYDY/LikePhys-Benchmark clips under <likephys_data_root>/<scenario>_videos/subgroup_XXX/
blockers:
- WorldFoundry does not vendor the upstream forked diffusers pipelines and schedulers; set WORLDFOUNDRY_LIKEPHYS_EVALUATOR_ROOT to an official checkout to execute the probe.
- Probing a full sweep requires one GPU pass per (model, scenario) pair over 920 clips.
data_refs:
  task_yaml: worldfoundry/data/benchmarks/tasks/external/likephys.yaml
  dataset_refs:
  - hf_dataset_id: JianhaoDYDY/LikePhys-Benchmark
    split: standard
    role: user_supplied_data_root
  local_dataset_layout:
  - <likephys_data_root>/<scenario>_videos/subgroup_XXX/valid_00.mp4
  - <likephys_data_root>/<scenario>_videos/subgroup_XXX/<variation>_00.mp4
  local_results_layout:
  - <likephys_results_root>/<scenario>/results_<probe_model>.json
official_runner_script: worldfoundry/evaluation/tasks/execution/runners/likephys/run_likephys_official_runner.py
runner_availability:
  available: true
  runner_target: worldfoundry.evaluation.tasks.contracts.external:LikePhysContract
  runner_script_available: true
  task_yaml_available: true
  runtime_verified: false
  surface: in_tree_misrank_scorer_with_external_probe
  normalizer_verified: true
base_model_dependencies: []
optional_base_model_dependencies:
- likephys_dataset_assets
validation_command:
- worldfoundry-eval
- zoo
- benchmark-run
- --benchmark-id
- likephys
- --mode
- official-validation
- --official-results-path
- <likephys_results_root>
- --output-dir
- <out>
- --json
checkpoint_refs: []
artifact_layout:
  generated_artifact_dir_env: WORLDFOUNDRY_GENERATED_ARTIFACT_DIR
  output_artifact: benchmark_scorecard
  filename_template: scorecard.json
