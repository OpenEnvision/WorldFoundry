id: pawbench
name: PAWBench
benchmark_kind:
- video-generation
- world-model
- probabilistic-world-model
domains:
- stochastic-physical-dynamics
- distribution-calibration
- outcome-coverage
modalities:
- image
- video
- text
status: confirmed_official_code_and_hf_data
official_sources:
  github:
    url: https://github.com/Andrew0613/PAWBench
    revision: f9ae040227a5b76ee50e37871fbbefc89fcc7fea
    verified_by: clean local checkout of the official repository
  paper_url: https://arxiv.org/abs/2608.27345
  project_page: https://pawbench.github.io
  huggingface_datasets:
  - repo_id: Andrew613/PAWBench
    url: https://huggingface.co/datasets/Andrew613/PAWBench
    gated: false
    private: false
  license:
    status: apache-2.0
    notes: The upstream Apache-2.0 LICENSE is retained beside the vendored evaluator.
dataset:
  hf_dataset_id: Andrew613/PAWBench
  gated: false
  private: false
  split: standard
benchmark_assets:
  official_dataset:
    status: external_hf_dataset
    declared_scenes: 50
    calibration_scenes: 25
    coverage_scenes: 25
    rollouts_per_scene: 50
    notes:
    - Dataset media, scene metadata, source images, and generated rollouts are not vendored.
  in_tree_fixture:
    path: worldfoundry/data/benchmarks/assets/pawbench/sample_results.json
    purpose: Synthetic result-normalizer validation only.
evaluation_surface:
  protocol: probabilistically_aligned_world_modeling
  tracks:
  - calibration
  - coverage
  judge: Gemini 3.5 Flash through OpenRouter's OpenAI-compatible API for official PAWEval runs.
  notes:
  - Every scene requires 50 independent generated rollouts.
  - PAW-Calibration TVD and PAW-Coverage remain separate; upstream defines no combined scalar score.
metrics:
- id: calibration_tvd_percent
  name: PAW-Calibration TVD
  description: Total variation distance between generated and reference outcome distributions, reported as a percentage.
  higher_is_better: false
  leaderboard_key: calibration_tvd_percent
  aggregator: mean
  output_unit: percent
  normalizer: percent:0:100
- id: coverage_percent
  name: PAW-Coverage
  description: Percentage of the official physical-outcome support observed across repeated generated rollouts.
  higher_is_better: true
  leaderboard_key: coverage_percent
  aggregator: mean
  output_unit: percent
  normalizer: percent:0:100
runner:
  normalization:
    artifact_official_run: true
    pass_generated_artifact_dir: true
  official_script: worldfoundry/evaluation/tasks/execution/runners/pawbench/run_pawbench_official_runner.py
  workspace:
    module: worldfoundry.evaluation.tasks.execution.runners.pawbench.run_pawbench_official_runner
    generated_arg: --generated-artifact-dir
    dataset_root_arg: --dataset-root
    model_arg: --model-name
    supports_official_runtime: true
    accepts_generated_artifacts: true
    supports_fixture: true
    default_metrics: [calibration_tvd_percent, coverage_percent]
    input_kind: pawbench_dataset_rollouts_or_official_metrics
  runner_target: worldfoundry.evaluation.tasks.contracts.external:PAWBenchContract
  validation_command:
  - worldfoundry-eval
  - zoo
  - benchmark-run
  - --benchmark-id
  - pawbench
  - --mode
  - official-validation
  - --official-results-path
  - <pawbench_metrics.json_or_run_dir>
  - --output-dir
  - <out>
  - --json
  run_command:
  - worldfoundry-eval
  - zoo
  - benchmark-run
  - --benchmark-id
  - pawbench
  - --mode
  - official-run
  - --benchmark-data-root
  - <pawbench_dataset_root>
  - --generated-artifact-dir
  - <rollout_root>
  - --output-dir
  - <out>
  - --json
  expected_artifacts:
  - scorecard.json
  - raw_metric_table.jsonl
  - per_sample_scores.jsonl
  - benchmark_contract.json
  runtime:
    kind: in_tree_official_runtime_hosted_judges
    root: worldfoundry/evaluation/tasks/execution/runners/pawbench
    runtime_root: worldfoundry/evaluation/tasks/execution/runners/pawbench/runtime/pawbench
    repo_url: https://github.com/Andrew0613/PAWBench.git
    repo_revision: f9ae040227a5b76ee50e37871fbbefc89fcc7fea
    root_env: WORLDFOUNDRY_PAWBENCH_ROOT
    results_path_env: WORLDFOUNDRY_PAWBENCH_RESULTS_PATH
    dataset_root_env: WORLDFOUNDRY_PAWBENCH_DATA_ROOT
    generated_artifact_dir_env: WORLDFOUNDRY_GENERATED_ARTIFACT_DIR
    judge_model_env: WORLDFOUNDRY_PAWBENCH_JUDGE_MODEL
    vlm_base_url_env: WORLDFOUNDRY_PAWBENCH_VLM_BASE_URL
    vlm_api_key_env_name_env: WORLDFOUNDRY_PAWBENCH_VLM_API_KEY_ENV
  verification_status: in_tree_runtime_cpu_contract_verified
integration:
  status: integrated
  tier: model_backed
  hf_dataset_id: Andrew613/PAWBench
  judge_model_id: google/gemini-3.5-flash
  implementation_scope: vendored_official_evaluator_with_hosted_paweval_judge
  source_files_copied: true
  full_dataset_verified: false
  notes:
  - The official metric/evaluator package and all outcome/trustworthiness rubrics are vendored read-only in-tree.
  - Existing complete metrics.json reports can be normalized on CPU without media, credentials, or network access.
  - Official execution requires the external dataset, a complete 50-rollout grid, network access, and an OpenRouter API key.
release_status: experimental
maturity: verified_runner
open_source_status: in_tree_runtime
official_benchmark_verified: false
integration_evidence: false
leaderboard_valid: false
requires:
- Andrew613/PAWBench dataset containing manifest.json, scene metadata, source images, and scoring policy.
- Fifty generated rollout videos for each of the 50 released scenes in the official directory layout.
- OPENROUTER_API_KEY and outbound network access for the official Gemini 3.5 Flash PAWEval judge.
blockers:
- Full 2,500-rollout official execution and leaderboard parity are not verified in this CPU-only workspace.
- Hosted judge availability and model versioning affect reproducibility of fresh PAWEval judgments.
data_refs:
  task_yaml: worldfoundry/data/benchmarks/tasks/external/pawbench.yaml
  fixture: worldfoundry/data/benchmarks/assets/pawbench/sample_results.json
  upstream_repository: https://github.com/Andrew0613/PAWBench
  dataset_repo: Andrew613/PAWBench
  in_tree_runtime_paths:
  - worldfoundry/evaluation/tasks/execution/runners/pawbench
runner_availability:
  available: true
  runner_target: worldfoundry.evaluation.tasks.contracts.external:PAWBenchContract
  runner_script_available: true
  task_yaml_available: true
  runtime_verified: false
  normalizer_verified: true
  surface: pawbench_official_in_tree
checkpoint_refs: []
base_model_dependencies: []
optional_base_model_dependencies: []
validation_command: worldfoundry-eval zoo benchmark-run --benchmark-id pawbench --mode official-validation
  --official-results-path <pawbench_metrics.json_or_run_dir> --output-dir <out> --json
artifact_layout:
  generated_artifact_dir_env: WORLDFOUNDRY_GENERATED_ARTIFACT_DIR
  output_artifact: benchmark_scorecard
  filename_template: scorecard.json
