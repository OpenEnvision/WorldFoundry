id: rbench
name: RBench
publisher: Peking University
publisher_kind: university
aliases:
- ReVidgen
benchmark_kind:
- image-to-video
- robotics-video-generation
- embodied-world-model
domains:
- robotics
- embodied-ai
- physical-reasoning
- manipulation
- motion-quality
modalities:
- image
- text
- video
status: confirmed_official_code_and_hf_data
official_sources:
  github:
    url: https://github.com/DAGroup-PKU/ReVidgen
    verified_by: git clone --depth 1 https://github.com/DAGroup-PKU/ReVidgen
    default_branch: main
  paper_url: https://arxiv.org/abs/2601.15282
  huggingface_datasets:
  - repo_id: DAGroup-PKU/RBench
    verified_by: HEAD https://huggingface.co/api/datasets/DAGroup-PKU/RBench
    sha: 6bdccf349ff5a8f68302428351e94f34ecd62450
    license: cc-by-4.0
    private: false
    gated: false
    role: benchmark_prompt_and_image_suite
  - repo_id: DAGroup-PKU/RoVid-X
    verified_by: HEAD https://huggingface.co/api/datasets/DAGroup-PKU/RoVid-X
    sha: 32faf783ba532e1107881b29c612be0aec16b888
    license: cc-by-4.0
    private: false
    gated: false
    role: training_corpus_not_required_for_evaluation
benchmark_assets:
  prompt_suite:
    status: confirmed_hf_dataset
    path_or_ref: prompts/<split>_prompts.json
  conditioning_images:
    status: confirmed_hf_dataset
    path_or_ref: imgs/<split>/<split>_NNNN.jpg
evaluation_surface:
  purpose: Fine-grained robotics image-to-video evaluation across robot embodiments and task categories.
  prompt_count: 650
  embodiment_track_prompts: 400
  task_track_prompts: 250
  requires_vlm_judge: true
  requires_operator_stack: true
  protocol: VLM rubric scoring plus motion operators, aggregated into penalized task and visual-quality scores.
metrics:
- id: rbench_overall
  name: RBench Overall
  description: WorldFoundry composite mean of the two official track scores; not a published RBench number.
  higher_is_better: true
  leaderboard_key: rbench_overall
  aggregator: mean
  output_unit: score
  primary: true
- id: embodiment_overall
  name: Embodiment Track Overall
  description: Task completion and visual quality pooled across the four robot embodiments.
  higher_is_better: true
  leaderboard_key: embodiment_overall
  aggregator: mean
  output_unit: score
- id: task_completion
  name: Task Completion
  description: Mean of normalized physical plausibility and task adherence consistency.
  higher_is_better: true
  leaderboard_key: task_completion
  aggregator: mean
  output_unit: score
- id: visual_quality
  name: Visual Quality
  description: Weighted stability and smoothness score after amplitude and consistency penalties.
  higher_is_better: true
  leaderboard_key: visual_quality
  aggregator: mean
  output_unit: score
- id: visual_quality_base
  name: Visual Quality (Unpenalized)
  description: 0.8 x robot subject stability + 0.2 x motion smoothness before penalties.
  higher_is_better: true
  leaderboard_key: visual_quality_base
  aggregator: mean
  output_unit: score
- id: physical_plausibility
  name: Physical Plausibility
  description: VLM physical plausibility score normalized from the 1-5 scale.
  higher_is_better: true
  leaderboard_key: physical_plausibility
  aggregator: mean
  output_unit: score
- id: task_adherence_consistency
  name: Task Adherence Consistency
  description: VLM task adherence score normalized from the 1-5 scale.
  higher_is_better: true
  leaderboard_key: task_adherence_consistency
  aggregator: mean
  output_unit: score
- id: robot_subject_stability
  name: Robot Subject Stability
  description: VLM robot and object stability score normalized from the 1-15 option-mapped scale.
  higher_is_better: true
  leaderboard_key: robot_subject_stability
  aggregator: mean
  output_unit: score
- id: motion_smoothness
  name: Motion Smoothness
  description: Motion smoothness operator score.
  higher_is_better: true
  leaderboard_key: motion_smoothness
  aggregator: mean
  output_unit: score
- id: motion_amplitude
  name: Perceptible Motion Amplitude
  description: Robotic-manipulator perceptible amplitude operator score driving the PAS penalty.
  higher_is_better: true
  leaderboard_key: motion_amplitude
  aggregator: mean
  output_unit: score
- id: task_track_overall
  name: Task Track Overall
  description: ALL_TASKS_MEAN pooled over every scored video across the five task splits.
  higher_is_better: true
  leaderboard_key: task_track_overall
  aggregator: mean
  output_unit: score
- id: common_manipulation
  name: Common Manipulation
  description: Normalized rubric score for the common manipulation split.
  higher_is_better: true
  leaderboard_key: common_manipulation
  aggregator: mean
  output_unit: score
- id: long_horizon_planning
  name: Long-Horizon Planning
  description: Normalized rubric score for the long-horizon planning split.
  higher_is_better: true
  leaderboard_key: long_horizon_planning
  aggregator: mean
  output_unit: score
- id: multi_entity_collaboration
  name: Multi-Entity Collaboration
  description: Normalized rubric score for the multi-entity collaboration split.
  higher_is_better: true
  leaderboard_key: multi_entity_collaboration
  aggregator: mean
  output_unit: score
- id: spatial_relationship
  name: Spatial Relationship
  description: Normalized rubric score for the spatial relationship split.
  higher_is_better: true
  leaderboard_key: spatial_relationship
  aggregator: mean
  output_unit: score
- id: visual_reasoning
  name: Visual Reasoning
  description: Normalized rubric score for the visual reasoning split.
  higher_is_better: true
  leaderboard_key: visual_reasoning
  aggregator: mean
  output_unit: score
runner:
  scoring:
    engines: [physics_contract]
    hooks:
      physics_contract: worldfoundry.evaluation.tasks.execution.runners.rbench.rbench_contract_evaluator:write_rbench_evaluation
  official_script: worldfoundry/evaluation/tasks/execution/runners/rbench/run_rbench_official_runner.py
  workspace:
    module: worldfoundry.evaluation.tasks.execution.runners.rbench.run_rbench_official_runner
    generated_arg: --generated-artifact-dir
    dataset_root_arg: --benchmark-data-root
    prompt_manifest_arg: --prompt-manifest
    benchmark_id_arg: --benchmark-id
    model_arg: --result-model-id
    default_metrics: [rbench_overall]
    input_kind: rbench_official_results_tree
  runner_target: worldfoundry.evaluation.tasks.contracts.external:RBenchContract
  official_runner_script: worldfoundry/evaluation/tasks/execution/runners/rbench/run_rbench_official_runner.py
  validation_command:
  - worldfoundry-eval
  - zoo
  - benchmark-run
  - --benchmark-id
  - rbench
  - --mode
  - official-validation
  - --official-results-path
  - <rbench_results_root>
  - --result-model-id
  - <model_id>
  - --output-dir
  - <out>
  - --json
  runtime:
    kind: in_tree_official_source
    root: worldfoundry/evaluation/tasks/execution/runners/rbench
    repo_url: https://github.com/DAGroup-PKU/ReVidgen.git
    results_path_env: WORLDFOUNDRY_RBENCH_RESULTS_PATH
    data_root_env: WORLDFOUNDRY_RBENCH_DATA_ROOT
    vlm_backend_env: WORLDFOUNDRY_RBENCH_VLM_BACKEND
    generated_artifact_dir_env: WORLDFOUNDRY_GENERATED_ARTIFACT_DIR
  expected_artifacts:
  - scorecard.json
  - benchmark_contract.json
  - raw_metric_table.jsonl
  - track_breakdown.json
  verification_status: in_tree_official_aggregation_ready_judge_external
  notes:
  - The in-tree scorer reproduces eval/4_embodiments and eval/5_tasks aggregation from per-video outputs, including the option-to-score mapping, min-max normalization, PAS and consistency penalties, and the amplitude filter that drops videos with no measured motion amplitude.
  - VLM judging (GPT or Qwen3-VL) and the GroundingDINO/SAM2/CoTracker/Q-Align operator stack run upstream.
  - gpt and qwen judge outputs are never mixed; one backend is aggregated per run.
integration:
  status: integrated
  tier: model_backed
  hf_dataset_id: DAGroup-PKU/RBench
  judge_model_id: gpt-4o+Qwen3-VL
  blocked_reasons:
  - Producing results requires an external VLM judge and the low-level operator stack with their checkpoints.
  - rbench_overall is a WorldFoundry composite; RBench publishes the two tracks separately.
release_status: experimental
maturity: contract_ready
open_source_status: normalizer_only
official_benchmark_verified: false
integration_evidence: false
leaderboard_valid: false
requires:
- RBench results tree with VQA results.csv per embodiment question and per task rubric
- motion/results.json per embodiment for amplitude and smoothness scores
- --result-model-id <model_id> when the results tree holds several generation models
- --vlm-backend when both gpt and qwen judge outputs are present
blockers:
- WorldFoundry aggregates supplied judge and operator outputs; it does not run the VLM judge or the GroundingDINO/SAM2/CoTracker/Q-Align stack.
data_refs:
  task_yaml: worldfoundry/data/benchmarks/tasks/external/rbench.yaml
  dataset_refs:
  - hf_dataset_id: DAGroup-PKU/RBench
    split: standard
    role: benchmark_prompt_and_image_suite
  local_dataset_layout:
  - <rbench_data_root>/prompts/<split>_prompts.json
  - <rbench_data_root>/imgs/<split>/
  local_results_layout:
  - <results_root>/4_embodiments/<model>/<embodiment>/VQA/<vlm>/<question>/results.csv
  - <results_root>/4_embodiments/<model>/<embodiment>/motion/results.json
  - <results_root>/5_tasks/<model>/<task>/<vlm>/results.csv
official_runner_script: worldfoundry/evaluation/tasks/execution/runners/rbench/run_rbench_official_runner.py
runner_availability:
  available: true
  runner_target: worldfoundry.evaluation.tasks.contracts.external:RBenchContract
  runner_script_available: true
  task_yaml_available: true
  runtime_verified: false
  surface: in_tree_official_aggregation
  normalizer_verified: true
base_model_dependencies: []
optional_base_model_dependencies:
- rbench_dataset_assets
validation_command:
- worldfoundry-eval
- zoo
- benchmark-run
- --benchmark-id
- rbench
- --mode
- official-validation
- --official-results-path
- <rbench_results_root>
- --result-model-id
- <model_id>
- --output-dir
- <out>
- --json
checkpoint_refs: []
artifact_layout:
  generated_artifact_dir_env: WORLDFOUNDRY_GENERATED_ARTIFACT_DIR
  output_artifact: benchmark_scorecard
  filename_template: scorecard.json
