benchmark: sana-wm-bench
name: SANA-WM 80-Scene Benchmark
description: Official 60-second camera-trajectory evaluation for world-model video generation.
tags: [benchmark-zoo, external-official, sana-wm, camera-controlled-video]
splits: [simple_60s, hard_60s]
metrics:
  vbench_overall: {aggregation: mean, primary: true}
  vbench_total_score: {aggregation: mean}
  revisit_psnr: {aggregation: mean}
  revisit_ssim: {aggregation: mean}
  revisit_lpips: {aggregation: mean}
  rot_err_deg: {aggregation: mean}
  trans_err_rel: {aggregation: mean}
  cam_mc_rel: {aggregation: mean}
  delta_iq: {aggregation: mean}
metadata:
  source_kind: benchmark_zoo
  benchmark_id: sana-wm-bench
  official_runner_target: worldfoundry.evaluation.tasks.contracts.external:SanaWMBenchContract
  official_runner_script: worldfoundry/evaluation/tasks/execution/runners/sana_wm_bench/run_sana_wm_bench_official_runner.py
  integration_status: integrated
  status: in_tree_runtime_ready
  input_contract: [prompt, first_frame, camera_npz, generated_video]
  output_contract: [scorecard, raw_metric_table, vbench_scores, revisit_consistency, temporal_degradation, eval_poses]
  runtime:
    kind: in_tree_composite_evaluator
    generated_artifact_dir_env: WORLDFOUNDRY_GENERATED_ARTIFACT_DIR
    dataset_root_env: WORLDFOUNDRY_SANA_WM_BENCH_DATASET_ROOT
  source_provenance:
    official_repo: {url: https://github.com/NVlabs/Sana, revision: 6298508fcb511762a11c42cff45b2fc9fd930325}
    dataset: {repo_id: Efficient-Large-Model/SANA-WM-Bench}
tasks:
  sana_wm_bench_simple_60s:
    benchmark_name: sana-wm-bench
    protocol: sana_wm_80scene_v2
    capability_track: camera_controlled_world_model
    input_keys: [prompt, first_frame, camera_path, intrinsics, generated_video]
    output_keys: [generated_video, scorecard, eval_poses]
    metric_ids: [vbench_overall, vbench_total_score, revisit_psnr, revisit_ssim, revisit_lpips, rot_err_deg, trans_err_rel, cam_mc_rel, delta_iq]
    dataset: {hf_dataset_id: Efficient-Large-Model/SANA-WM-Bench, split: simple_60s, expected_rows: 80}
  sana_wm_bench_hard_60s:
    benchmark_name: sana-wm-bench
    protocol: sana_wm_80scene_v2
    capability_track: camera_controlled_world_model
    input_keys: [prompt, first_frame, camera_path, intrinsics, generated_video]
    output_keys: [generated_video, scorecard, eval_poses]
    metric_ids: [vbench_overall, vbench_total_score, revisit_psnr, revisit_ssim, revisit_lpips, rot_err_deg, trans_err_rel, cam_mc_rel, delta_iq]
    dataset: {hf_dataset_id: Efficient-Large-Model/SANA-WM-Bench, split: hard_60s, expected_rows: 80}

