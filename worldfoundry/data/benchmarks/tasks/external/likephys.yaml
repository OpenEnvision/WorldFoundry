benchmark: likephys
name: LikePhys
description: Task manifest and in-tree mis-rank scorer for LikePhys likelihood-preference probing of video diffusion models.
tags:
- benchmark-zoo
- external-official
- likephys
- text-to-video
- physical-understanding
- model-likelihood-probe
splits:
- standard
metrics:
  likephys_misrank_rate:
    aggregation: mean
    primary: true
  likephys_dataset_weighted_misrank_rate:
    aggregation: mean
  rigid_body_misrank_rate:
    aggregation: mean
  fluid_misrank_rate:
    aggregation: mean
  deformable_misrank_rate:
    aggregation: mean
  optics_misrank_rate:
    aggregation: mean
  temporal_disorder_misrank_rate:
    aggregation: mean
metadata:
  source_kind: benchmark_zoo
  benchmark_id: likephys
  contract_validation_command: worldfoundry-eval zoo benchmark-run --benchmark-id likephys --mode contract --output-dir tmp/benchmark_zoo/benchmark_contract/likephys --json
  name: LikePhys
  domain:
  - physics
  - intuitive-physics
  - rigid-body
  - fluid-dynamics
  - deformable
  - optics
  task_type: video_diffusion_likelihood_preference_probe
  status: integrated
  integration_status: integrated
  maturity: contract_ready
  release_status: experimental
  open_source_status: experimental
  official_benchmark_verified: false
  integration_evidence: false
  leaderboard_valid: false
  base_model_dependencies: []
  optional_base_model_dependencies:
  - likephys_dataset_assets
  source_provenance:
    official_repo:
      url: https://github.com/YuanJianhao508/LikePhys
      verified_by: git clone --depth 1 https://github.com/YuanJianhao508/LikePhys
      default_branch: main
      role: probe_runtime_dependency_supplied_by_caller
    hf_dataset:
      repo_id: JianhaoDYDY/LikePhys-Benchmark
      verified_by: HEAD https://huggingface.co/api/datasets/JianhaoDYDY/LikePhys-Benchmark
      sha: 30fc7a194a7c4eb1de9102f49c7355121ba79b1f
      license: apache-2.0
      private: false
      gated: false
      role: benchmark_clip_dataset
    paper:
      url: https://arxiv.org/abs/2510.11512
    project_page:
      url: https://yuanjianhao508.github.io/LikePhys/
  input_contract:
  - probe_model
  - likephys_dataset_root
  - scenario_id
  - variation_id
  output_contract:
  - per_clip_denoising_loss
  - misrank_rate
  evaluation_requirements:
  - Probe the model under test with the official ELBO surrogate over the 12 paired scenarios.
  - Compute mis-rank per (subgroup, variation) as the fraction of valid/impossible loss pairs where the valid clip received the higher loss.
  - Exclude the read_exp_final.py filter_config variations from reported aggregates.
  - Treat mis-rank as an error rate; lower is better for every metric.
  requires:
  - results_<model>.json artifacts under <results_root>/<scenario>/, or --run-official with a LikePhys checkout
  - --probe-model <model_key> when a results root holds several probe backends
  - JianhaoDYDY/LikePhys-Benchmark clips for the probe stage
  blockers:
  - The probe stage needs an official LikePhys checkout, CUDA, and the probed diffusion checkpoints.
  - WorldFoundry does not vendor the upstream forked diffusers pipelines and schedulers.
  data_refs:
    task_yaml: worldfoundry/data/benchmarks/tasks/external/likephys.yaml
    dataset_refs:
    - hf_dataset_id: JianhaoDYDY/LikePhys-Benchmark
      split: standard
      role: user_supplied_data_root
    local_dataset_layout:
    - <likephys_data_root>/<scenario>_videos/subgroup_XXX/valid_00.mp4
    - <likephys_data_root>/<scenario>_videos/subgroup_XXX/<variation>_00.mp4
    local_results_layout:
    - <likephys_results_root>/<scenario>/results_<probe_model>.json
  runner_availability:
    available: true
    runner_target: worldfoundry.evaluation.tasks.contracts.external:LikePhysContract
    runner_script_available: true
    task_yaml_available: true
    runtime_verified: false
    surface: in_tree_misrank_scorer_with_external_probe
    normalizer_verified: true
  official_runner_target: worldfoundry.evaluation.tasks.contracts.external:LikePhysContract
  official_runner_script: worldfoundry/evaluation/tasks/execution/runners/likephys/run_likephys_official_runner.py
  metric_evaluator_target: worldfoundry.evaluation.tasks.execution.runners.likephys.likephys_contract_evaluator:write_likephys_evaluation
  metric_protocol:
    official_definition: For each scenario subgroup, all (valid, impossible) pairs of ELBO-surrogate denoising losses are formed; a pair is mis-ranked when the valid clip has the higher loss. Per-variation rates are averaged over subgroups, then pooled variation-weighted (published ranking) or scenario-weighted.
    official_results_fields:
    - scene_evaluations.<subgroup>.<variation>.<clip>.loss
    - scene_evaluations.<subgroup>.<variation>.<clip>.loss_array
    - misrank_metrics.<variation>.misrank_ratio
    required_artifacts:
    - LikePhys-Benchmark clips for all 12 scenarios
    - results_<model>.json per scenario
    official_metric_blocked_reason: white_box_model_probe_required
  artifact_layout:
    generated_artifact_dir_env: WORLDFOUNDRY_GENERATED_ARTIFACT_DIR
    output_artifact: benchmark_scorecard
    filename_template: scorecard.json
  runtime:
    kind: in_tree_official_runner
    root: worldfoundry/evaluation/tasks/execution/runners/likephys
    repo_url: https://github.com/YuanJianhao508/LikePhys.git
    evaluator_root_env: WORLDFOUNDRY_LIKEPHYS_EVALUATOR_ROOT
    root_env: WORLDFOUNDRY_LIKEPHYS_ROOT
  official_result_entrypoint: worldfoundry-eval zoo benchmark-run
  local_evaluator:
    target: worldfoundry.evaluation.tasks.execution.runners.likephys.likephys_contract_evaluator:write_likephys_evaluation
    status: implemented
    protocol: local_artifact_checks_and_official_misrank_recomputation
    official_result_normalization:
      status: implemented
      input_keys:
      - benchmark_data_root
      - WORLDFOUNDRY_LIKEPHYS_DATA_ROOT
      - official_results_path
      - WORLDFOUNDRY_LIKEPHYS_RESULTS_PATH
      formats:
      - directory
      - json
      provenance: recomputes official mis-rank formulas from caller-provided results_<model>.json artifacts
  validation_command:
  - worldfoundry-eval
  - zoo
  - benchmark-run
  - --benchmark-id
  - likephys
  - --mode
  - official-validation
  - --official-results-path
  - <likephys_results_root>
  - --output-dir
  - <out>
  - --json
  checkpoint_refs: []
tasks:
  likephys_standard:
    benchmark_name: likephys
    protocol: likelihood_preference_probe
    capability_track: text_to_video
    schema_type: model_probe_result_set
    input_keys:
    - probe_model
    - likephys_dataset_root
    - scenario_id
    - variation_id
    output_keys:
    - per_clip_denoising_loss
    - misrank_rate
    metric_ids:
    - likephys_misrank_rate
    - likephys_dataset_weighted_misrank_rate
    - rigid_body_misrank_rate
    - fluid_misrank_rate
    - deformable_misrank_rate
    - optics_misrank_rate
    - temporal_disorder_misrank_rate
    metric_groups:
    - likephys_metrics
    tags:
    - benchmark-zoo
    - external-official
    - likephys
    - text-to-video
    - physical-understanding
    metadata:
      source_kind: benchmark_zoo
      benchmark_id: likephys
      domain:
      - physics
      - intuitive-physics
      task_type: video_diffusion_likelihood_preference_probe
      status: contract_ready
      artifact_contract:
        required:
          official_results:
            kind: json
      evaluation_requirements:
      - Recompute official mis-rank from results_<model>.json, or execute the probe with --run-official.
      official_benchmark_verified: false
      integration_evidence: false
      leaderboard_valid: false
    dataset:
      status: official_hf_dataset_required
      hf_dataset_id: JianhaoDYDY/LikePhys-Benchmark
      split: standard
      source: benchmark_clip_dataset
    artifact_contract:
      required:
        official_results:
          kind: json
    evaluation_protocol:
    - name: result_normalizer
      metric_ids:
      - likephys_misrank_rate
      - likephys_dataset_weighted_misrank_rate
      - rigid_body_misrank_rate
      - fluid_misrank_rate
      - deformable_misrank_rate
      - optics_misrank_rate
      - temporal_disorder_misrank_rate
      evaluator_target: worldfoundry.evaluation.tasks.execution.runners.likephys.likephys_contract_evaluator:write_likephys_evaluation
      status: implemented
    - name: official_probe
      metric_ids:
      - likephys_misrank_rate
      - likephys_dataset_weighted_misrank_rate
      - rigid_body_misrank_rate
      - fluid_misrank_rate
      - deformable_misrank_rate
      - optics_misrank_rate
      - temporal_disorder_misrank_rate
      runner_target: worldfoundry.evaluation.tasks.contracts.external:LikePhysContract
      evaluator_target: worldfoundry.evaluation.tasks.execution.runners.likephys.likephys_contract_evaluator:write_likephys_evaluation
      runner_script: worldfoundry/evaluation/tasks/execution/runners/likephys/run_likephys_official_runner.py
      status: requires_external_checkout_and_cuda
      official_validation_command: worldfoundry-eval zoo benchmark-run --benchmark-id likephys --mode official-validation --official-results-path <likephys_results_root> --output-dir <out> --json
    - name: external_official_runner
      metric_ids:
      - likephys_misrank_rate
      - likephys_dataset_weighted_misrank_rate
      - rigid_body_misrank_rate
      - fluid_misrank_rate
      - deformable_misrank_rate
      - optics_misrank_rate
      - temporal_disorder_misrank_rate
      runner_target: worldfoundry.evaluation.tasks.contracts.external:LikePhysContract
      runner_script: worldfoundry/evaluation/tasks/execution/runners/likephys/run_likephys_official_runner.py
    runtime_requirements:
      benchmark_data_root_env: WORLDFOUNDRY_LIKEPHYS_DATA_ROOT
      results_path_env: WORLDFOUNDRY_LIKEPHYS_RESULTS_PATH
      evaluator_root_env: WORLDFOUNDRY_LIKEPHYS_EVALUATOR_ROOT
      generated_artifact_dir_env: WORLDFOUNDRY_GENERATED_ARTIFACT_DIR
