benchmark: worldmembench
name: WorldMemBench
description: Official WorldMemBench memory and camera-control evaluation for video world models.
tags:
- benchmark-zoo
- external-official
- worldmembench
- video-world-model
- visual-memory
splits:
- standard
metrics:
  imaging_quality:
    aggregation: mean
  aesthetic_quality:
    aggregation: mean
  human_identity:
    aggregation: mean
  human_appearance:
    aggregation: mean
  object_geometry:
    aggregation: mean
  object_appearance:
    aggregation: mean
  environment_visible_memory:
    aggregation: mean
  environment_depth_fidelity:
    aggregation: mean
  environment_scene_reconstruction:
    aggregation: mean
  dynamic_memory:
    aggregation: mean
  camera_rotation:
    aggregation: mean
  camera_translation:
    aggregation: mean
metadata:
  source_kind: benchmark_zoo
  benchmark_id: worldmembench
  official_runner_target: worldfoundry.evaluation.tasks.contracts.external:WorldMemBenchContract
  official_runner_script: worldfoundry/evaluation/tasks/execution/runners/worldmembench/run_worldmembench_official_runner.py
  official_runner_command: worldfoundry-eval zoo benchmark-run
  contract_validation_command: worldfoundry-eval zoo benchmark-run --benchmark-id worldmembench --mode contract --output-dir tmp/benchmark_zoo/benchmark_contract/worldmembench --json
  task_type: video_world_model_memory_evaluation
  status: integrated
  maturity: contract_ready
  release_status: experimental
  open_source_status: experimental
  checkpoint_refs: []
  requires:
  - Official result summaries, or generated videos with a provisioned upstream runtime and selected metric assets.
  blockers:
  - Complete-dataset and checkpoint replay remain pending.
  validation_command:
  - worldfoundry-eval
  - zoo
  - benchmark-run
  - --benchmark-id
  - worldmembench
  - --mode
  - official-validation
  - --official-results-path
  - <official_eval_output>
  - --output-dir
  - <out>
  - --json
  official_benchmark_verified: false
  integration_evidence: false
  leaderboard_valid: false
  source_provenance:
    official_repo:
      url: https://github.com/ZJU-REAL/WorldMemBench
      revision: 1b79840143a98e017891e893b5d3ef75b93078a3
      license: MIT
      role: external_runtime_dependency
    paper:
      url: https://arxiv.org/abs/2610.19063
    huggingface_dataset:
      repo_id: rescuerz/WorldMemBench
  input_contract:
  - generated_video_dir
  - official_results_path
  - worldmembench_config
  - weights_dir
  output_contract:
  - scorecard
  - raw_metric_table
  - per_sample_scores
  - official_metric_summaries
  evaluation_requirements:
  - Use official JSONL manifests or the upstream model/category/trajectory/case video layout.
  - Import official metrics/<metric>/summary.json outputs or execute a provisioned upstream runtime.
  - Keep one model group per scorecard and retain official per-case statuses and camera-error directions.
  - Official metric computation requires the selected checkpoint stacks and DA3/ViPE environments; Dynamic Memory requires a VLM endpoint.
  data_refs:
    task_yaml: worldfoundry/data/benchmarks/tasks/external/worldmembench.yaml
    hf_dataset_ids:
    - rescuerz/WorldMemBench
  runner_availability:
    available: true
    runner_target: worldfoundry.evaluation.tasks.contracts.external:WorldMemBenchContract
    runner_script_available: true
    task_yaml_available: true
    runtime_verified: false
    full_suite_verified: false
    surface: external_official_runtime_with_result_normalizer
  runtime:
    kind: external_official_repo
    root_env: WORLDFOUNDRY_WORLDMEMBENCH_ROOT
    results_path_env: WORLDFOUNDRY_WORLDMEMBENCH_RESULTS_PATH
  artifact_layout:
    generated_artifact_dir_env: WORLDFOUNDRY_GENERATED_ARTIFACT_DIR
    output_artifact: benchmark_scorecard
    filename_template: scorecard.json
tasks:
  worldmembench_standard:
    benchmark_name: worldmembench
    protocol: external_official_benchmark
    capability_track: video_world_model_memory
    schema_type: generated_artifact_set
    input_keys:
    - generated_video_dir
    - official_results_path
    - worldmembench_config
    - weights_dir
    output_keys:
    - scorecard
    - raw_metric_table
    - per_sample_scores
    - official_metric_summaries
    metric_ids: &worldmembench_metric_ids
    - imaging_quality
    - aesthetic_quality
    - human_identity
    - human_appearance
    - object_geometry
    - object_appearance
    - environment_visible_memory
    - environment_depth_fidelity
    - environment_scene_reconstruction
    - dynamic_memory
    - camera_rotation
    - camera_translation
    tags:
    - benchmark-zoo
    - external-official
    - worldmembench
    - video-world-model
    metadata:
      source_kind: benchmark_zoo
      benchmark_id: worldmembench
      official_benchmark_verified: false
      integration_evidence: false
      leaderboard_valid: false
    dataset:
      hf_dataset_id: rescuerz/WorldMemBench
      split: standard
    runtime_requirements:
      generated_artifact_dir_env: WORLDFOUNDRY_GENERATED_ARTIFACT_DIR
      results_path_env: WORLDFOUNDRY_WORLDMEMBENCH_RESULTS_PATH
    artifact_contract:
      required:
        generated_video:
          kind: video
      optional:
        official_results_path:
          kind: directory
    evaluation_protocol:
    - name: external_official_runner
      metric_ids: *worldmembench_metric_ids
      runner_target: worldfoundry.evaluation.tasks.contracts.external:WorldMemBenchContract
      runner_script: worldfoundry/evaluation/tasks/execution/runners/worldmembench/run_worldmembench_official_runner.py
