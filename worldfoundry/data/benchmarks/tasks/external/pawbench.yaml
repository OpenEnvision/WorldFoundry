benchmark: pawbench
name: PAWBench
description: Distributional physical-outcome evaluation for repeated video-world-model rollouts across calibration and coverage tracks.
tags:
- benchmark-zoo
- external-official
- world-model
- probabilistic-alignment
- image-to-video
splits:
- standard
metrics:
  calibration_tvd_percent: {aggregation: mean}
  coverage_percent: {aggregation: mean}
metadata:
  source_kind: benchmark_zoo
  benchmark_id: pawbench
  official_runner_target: worldfoundry.evaluation.tasks.contracts.external:PAWBenchContract
  official_runner_script: worldfoundry/evaluation/tasks/execution/runners/pawbench/run_pawbench_official_runner.py
  contract_validation_command: worldfoundry-eval zoo benchmark-run --benchmark-id pawbench --mode contract
    --output-dir tmp/benchmark_zoo/benchmark_contract/pawbench --json
  validation_command: worldfoundry-eval zoo benchmark-run --benchmark-id pawbench --mode official-validation
    --official-results-path <pawbench_metrics.json_or_run_dir> --output-dir <out> --json
  checkpoint_refs: []
  base_model_dependencies: []
  optional_base_model_dependencies: []
  runtime:
    kind: in_tree_official_runtime_hosted_judges
    root: worldfoundry/evaluation/tasks/execution/runners/pawbench
    runtime_root: worldfoundry/evaluation/tasks/execution/runners/pawbench/runtime/pawbench
    root_env: WORLDFOUNDRY_PAWBENCH_ROOT
    results_path_env: WORLDFOUNDRY_PAWBENCH_RESULTS_PATH
    dataset_root_env: WORLDFOUNDRY_PAWBENCH_DATA_ROOT
    generated_artifact_dir_env: WORLDFOUNDRY_GENERATED_ARTIFACT_DIR
    judge_model_env: WORLDFOUNDRY_PAWBENCH_JUDGE_MODEL
  release_status: experimental
  maturity: verified_runner
  open_source_status: in_tree_runtime
  official_benchmark_verified: false
  integration_evidence: false
  leaderboard_valid: false
  requires:
  - Andrew613/PAWBench dataset and a complete 50-rollout-per-scene generated video tree.
  - OPENROUTER_API_KEY plus network access for official Gemini 3.5 Flash PAWEval judging.
  blockers:
  - Full 2,500-rollout official execution and leaderboard parity are unverified in this workspace.
  data_refs:
    task_yaml: worldfoundry/data/benchmarks/tasks/external/pawbench.yaml
    fixture: worldfoundry/data/benchmarks/assets/pawbench/sample_results.json
    upstream_repository: https://github.com/Andrew0613/PAWBench
    dataset_repo: Andrew613/PAWBench
  artifact_layout:
    generated_artifact_dir_env: WORLDFOUNDRY_GENERATED_ARTIFACT_DIR
    output_artifact: benchmark_scorecard
    filename_template: scorecard.json
  runner_availability:
    available: true
    runner_target: worldfoundry.evaluation.tasks.contracts.external:PAWBenchContract
    runner_script_available: true
    task_yaml_available: true
    runtime_verified: false
    normalizer_verified: true
    surface: pawbench_official_in_tree
tasks:
  pawbench_standard:
    benchmark_name: pawbench
    protocol: external_official_benchmark
    capability_track: video_world_model
    schema_type: generated_artifact_set
    input_keys:
    - dataset_root
    - generated_video
    - official_results_path
    output_keys:
    - scorecard
    - raw_metric_table
    - per_sample_scores
    metric_ids:
    - calibration_tvd_percent
    - coverage_percent
    tags:
    - benchmark-zoo
    - external-official
    - pawbench
    - probabilistic-alignment
    metadata:
      source_kind: benchmark_zoo
      benchmark_id: pawbench
      official_benchmark_verified: false
      integration_evidence: false
      leaderboard_valid: false
    dataset:
      hf_dataset_id: Andrew613/PAWBench
      split: standard
      scenes: 50
      rollouts_per_scene: 50
    runtime_requirements:
      dataset_root_env: WORLDFOUNDRY_PAWBENCH_DATA_ROOT
      generated_artifact_dir_env: WORLDFOUNDRY_GENERATED_ARTIFACT_DIR
      results_path_env: WORLDFOUNDRY_PAWBENCH_RESULTS_PATH
      judge_model_env: WORLDFOUNDRY_PAWBENCH_JUDGE_MODEL
      api_key_env: OPENROUTER_API_KEY
    artifact_contract:
      required:
        dataset_root:
          kind: directory
        generated_video:
          kind: video
      optional:
        official_results_path:
          kind: json
    evaluation_protocol:
    - name: in_tree_official_runtime
      metric_ids:
      - calibration_tvd_percent
      - coverage_percent
      runner_target: worldfoundry.evaluation.tasks.contracts.external:PAWBenchContract
      runner_script: worldfoundry/evaluation/tasks/execution/runners/pawbench/run_pawbench_official_runner.py
