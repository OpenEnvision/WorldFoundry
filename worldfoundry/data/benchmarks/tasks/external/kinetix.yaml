benchmark: kinetix
description: Kinetix external benchmark manifest for JAX physics embodied action evaluation.
tags:
- benchmark-zoo
- external-official
- kinetix
- vla
- embodied-action
- physics
splits:
- eval
- realtime
metrics:
  success_rate:
    aggregation: mean
    primary: true
  task_success:
    aggregation: mean
  episode_success:
    aggregation: mean
  reward:
    aggregation: mean
metadata:
  base_model_dependencies:
  - kinetix_official_runtime_assets
  source_kind: benchmark_zoo
  benchmark_id: kinetix
  status: integrated
  official_runner_target: worldfoundry.evals.tasks.contracts.external:kinetix
  runtime:
    kind: external_official_results_runner
    root_env: WORLDFOUNDRY_KINETIX_ROOT
    results_path_env: WORLDFOUNDRY_KINETIX_RESULTS_PATH
    preflight_profile: kinetix
  local_evaluator:
    target: worldfoundry.evals.tasks.embodied.normalizer:normalize_results
    status: implemented
    protocol: official_embodied_result_normalizer
  contract_validation_command: wf zoo benchmark-run --benchmark-id kinetix --mode contract --output-dir 
    tmp/benchmark_zoo/benchmark_contract/kinetix --json
  release_status: normalizer_only
  maturity: contract_ready
  open_source_status: normalizer_only
  official_benchmark_verified: false
  integration_evidence: true
  leaderboard_valid: false
  requires:
  - Official simulator runtime
  - benchmark assets
  - policy checkpoint
  - official result dump
  blockers:
  - Full leaderboard parity is not claimed until official rollouts are executed and imported.
  runner_availability:
    available: true
    runner_target: worldfoundry.evals.tasks.contracts.external:kinetix
    task_yaml_available: true
    runtime_verified: false
    normalizer_verified: true
    surface: official_result_normalizer
    runner_script_available: false
  artifact_layout:
    generated_artifact_dir_env: WORLDFOUNDRY_KINETIX_RESULTS_PATH
    output_artifact: benchmark_scorecard
    filename_template: scorecard.json
  data_refs:
    task_yaml: worldfoundry/data/benchmarks/tasks/external/kinetix.yaml
  checkpoint_refs: []
  validation_command:
  - wf
  - zoo
  - benchmark-run
  - --benchmark-id
  - kinetix
  - --mode
  - official-validation
  - --official-results-path
  - <official_results.json>
  - --output-dir
  - <out>
  - --json
tasks:
  kinetix_policy_rollouts:
    benchmark_name: kinetix
    protocol: external_official_benchmark
    capability_track: vla,embodied-action,physics
    input_keys:
    - dataset_root
    - simulator_root
    - task_manifest
    - policy_results_path
    - official_results_path
    output_keys:
    - scorecard
    - raw_results
    - per_sample_metrics
    - rollout_logs
    metric_ids:
    - success_rate
    - task_success
    - episode_success
    - reward
    tags:
    - benchmark-zoo
    - external-official
    - kinetix
    - vla
    metadata:
      benchmark_id: kinetix
      leaderboard_valid: false

      source_kind: benchmark_zoo
      official_benchmark_verified: false
      integration_evidence: true
    artifact_contract:
      required:
        benchmark_scorecard:
          kind: benchmark_result
    evaluation_protocol:
    - name: external_official_runner
      metric_ids:
      - success_rate
      - task_success
      - episode_success
      - reward
      runner_target: worldfoundry.evals.tasks.contracts.external:kinetix
