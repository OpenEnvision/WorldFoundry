benchmark: robocerebra
description: RoboCerebra external benchmark manifest for cognitive embodied manipulation tasks.
tags:
- benchmark-zoo
- external-official
- robocerebra
- vla
- embodied-action
- robot-manipulation
splits:
- eval
metrics:
  success_rate:
    aggregation: mean
    primary: true
  task_success:
    aggregation: mean
  episode_success:
    aggregation: mean
  reward:
    aggregation: mean
metadata:
  base_model_dependencies:
  - robocerebra_official_runtime_assets
  source_kind: benchmark_zoo
  benchmark_id: robocerebra
  status: integrated
  official_runner_target: worldfoundry.evals.tasks.contracts.external:robocerebra
  runtime:
    kind: external_official_results_runner
    root_env: WORLDFOUNDRY_ROBOCEREBRA_ROOT
    results_path_env: WORLDFOUNDRY_ROBOCEREBRA_RESULTS_PATH
    preflight_profile: robocerebra
  local_evaluator:
    target: worldfoundry.evals.tasks.embodied.normalizer:normalize_results
    status: implemented
    protocol: official_embodied_result_normalizer
  contract_validation_command: wf zoo benchmark-run --benchmark-id robocerebra --mode contract 
    --output-dir tmp/benchmark_zoo/benchmark_contract/robocerebra --json
  release_status: normalizer_only
  maturity: contract_ready
  open_source_status: normalizer_only
  official_benchmark_verified: false
  integration_evidence: true
  leaderboard_valid: false
  requires:
  - Official simulator runtime
  - benchmark assets
  - policy checkpoint
  - official result dump
  blockers:
  - Full leaderboard parity is not claimed until official rollouts are executed and imported.
  runner_availability:
    available: true
    runner_target: worldfoundry.evals.tasks.contracts.external:robocerebra
    task_yaml_available: true
    runtime_verified: false
    normalizer_verified: true
    surface: official_result_normalizer
    runner_script_available: false
  artifact_layout:
    generated_artifact_dir_env: WORLDFOUNDRY_ROBOCEREBRA_RESULTS_PATH
    output_artifact: benchmark_scorecard
    filename_template: scorecard.json
  data_refs:
    task_yaml: worldfoundry/data/benchmarks/tasks/external/robocerebra.yaml
  checkpoint_refs: []
  validation_command:
  - wf
  - zoo
  - benchmark-run
  - --benchmark-id
  - robocerebra
  - --mode
  - official-validation
  - --official-results-path
  - <official_results.json>
  - --output-dir
  - <out>
  - --json
tasks:
  robocerebra_policy_rollouts:
    benchmark_name: robocerebra
    protocol: external_official_benchmark
    capability_track: vla,robot-manipulation
    input_keys:
    - dataset_root
    - simulator_root
    - task_manifest
    - policy_results_path
    - official_results_path
    output_keys:
    - scorecard
    - raw_results
    - per_sample_metrics
    - rollout_logs
    - videos
    metric_ids:
    - success_rate
    - task_success
    - episode_success
    - reward
    tags:
    - benchmark-zoo
    - external-official
    - robocerebra
    - vla
    metadata:
      benchmark_id: robocerebra
      leaderboard_valid: false

      source_kind: benchmark_zoo
      official_benchmark_verified: false
      integration_evidence: true
    artifact_contract:
      required:
        benchmark_scorecard:
          kind: benchmark_result
    evaluation_protocol:
    - name: external_official_runner
      metric_ids:
      - success_rate
      - task_success
      - episode_success
      - reward
      runner_target: worldfoundry.evals.tasks.contracts.external:robocerebra
