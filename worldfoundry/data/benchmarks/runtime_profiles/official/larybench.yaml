benchmark_ids:
- larybench
id: larybench
name: LARYBench
environment_id: worldfoundry-unified-cu128
needs_new_env: false
status: in_tree_runtime_ready_full_data_validation_pending
notes:
- The official extraction/classification/regression pipelines are checked in under the runner; --run-official
  needs no external checkout.
- Existing official outputs (classification_summary.json / best_result.json) can be normalized on CPU without
  datasets or checkpoints.
- Full official runs need the LARYBench dataset shards staged through DATA_DIR, checkpoints for the selected
  representation model, and GPUs (classification uses one process per GPU; regression uses Accelerate).
python_path: ${WORLDFOUNDRY_UNIFIED_PYTHON:-python}
pythonpath_roots:
- .
preflight_command: PYTHONPATH=. ${WORLDFOUNDRY_UNIFIED_PYTHON:-python} -m
  worldfoundry.evaluation.tasks.execution.orchestration.runtime_preflight --profile larybench --manifest
  worldfoundry/data/benchmarks/runtime_profiles/official/larybench.yaml --output-dir
  tmp/worldfoundry_preflight/larybench --json
required_assets:
  in_tree_runtime_paths:
  - worldfoundry/evaluation/tasks/execution/runners/larybench
  task_yaml: worldfoundry/data/benchmarks/tasks/external/larybench.yaml
  hf_dataset_ids:
  - meituan-longcat/LARYBench
required_env: []
optional_env:
- WORLDFOUNDRY_LARYBENCH_RESULTS_PATH
- DATA_DIR
- LARY_METADATA_DIR
- LARY_LA_DIR
- MODEL_DIR
- CUDA_VISIBLE_DEVICES
required_packages:
- numpy
optional_packages:
- torch
- accelerate
- decord
optional_imports:
- numpy
required_paths:
- id: official_runner_script
  path: worldfoundry/evaluation/tasks/execution/runners/larybench/run_larybench_official_runner.py
- id: in_tree_runtime_cli
  path: worldfoundry/evaluation/tasks/execution/runners/larybench/cli.py
- id: task_yaml
  path: worldfoundry/data/benchmarks/tasks/external/larybench.yaml
requires_cuda_visibility: false
optional_base_model_dependencies:
- spatial_perception_core_stack
validation_command:
- worldfoundry-eval
- zoo
- benchmark-run
- --benchmark-id
- larybench
- --mode
- official-validation
- --official-results-path
- <classification_summary.json_or_best_result.json>
- --output-dir
- <out>
- --json
