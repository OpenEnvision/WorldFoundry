benchmark_ids:
- pawbench
id: pawbench
name: PAWBench
environment_id: worldfoundry-unified-cu128
needs_new_env: false
status: in_tree_official_runtime_hosted_judges_full_suite_pending
notes:
- Existing complete metrics.json reports normalize on CPU without benchmark media, credentials, network, or CUDA.
- --run-official executes the vendored PAWBench evaluate.py and writes all checkpoints, rows, metrics, logs, and temporary evidence below --output-dir.
- Fresh official PAWEval execution requires the Andrew613/PAWBench dataset, 2,500 generated rollouts, outbound network access, and OPENROUTER_API_KEY for Gemini 3.5 Flash through OpenRouter.
- The dataset, generated videos, API credentials, and evaluator outputs are never vendored.
python_path: ${WORLDFOUNDRY_UNIFIED_PYTHON:-python}
pythonpath_roots:
- .
- worldfoundry/evaluation/tasks/execution/runners/pawbench/runtime/pawbench
preflight_command: PYTHONPATH=. ${WORLDFOUNDRY_UNIFIED_PYTHON:-python} -m
  worldfoundry.evaluation.tasks.execution.orchestration.runtime_preflight --profile pawbench --manifest
  worldfoundry/data/benchmarks/runtime_profiles/official/pawbench.yaml --output-dir
  tmp/worldfoundry_preflight/pawbench --json
required_assets:
  in_tree_runtime_paths:
  - worldfoundry/evaluation/tasks/execution/runners/pawbench
  - worldfoundry/evaluation/tasks/execution/runners/pawbench/runtime/pawbench
  pip_requirements:
  - worldfoundry/data/benchmarks/requirements/pawbench.txt
  task_yaml: worldfoundry/data/benchmarks/tasks/external/pawbench.yaml
  fixture: worldfoundry/data/benchmarks/assets/pawbench/sample_results.json
  hf_dataset_ids:
  - Andrew613/PAWBench
required_env: []
optional_env:
- WORLDFOUNDRY_PAWBENCH_ROOT
- WORLDFOUNDRY_PAWBENCH_RESULTS_PATH
- WORLDFOUNDRY_PAWBENCH_DATA_ROOT
- WORLDFOUNDRY_PAWBENCH_VLM_BASE_URL
- WORLDFOUNDRY_PAWBENCH_JUDGE_MODEL
- WORLDFOUNDRY_PAWBENCH_VLM_API_KEY_ENV
- WORLDFOUNDRY_GENERATED_ARTIFACT_DIR
- OPENROUTER_API_KEY
- HF_ENDPOINT
required_paths:
- id: official_runner_script
  path: worldfoundry/evaluation/tasks/execution/runners/pawbench/run_pawbench_official_runner.py
- id: vendored_official_evaluator
  path: worldfoundry/evaluation/tasks/execution/runners/pawbench/runtime/pawbench/evaluate.py
- id: vendored_metric_runtime
  path: worldfoundry/evaluation/tasks/execution/runners/pawbench/runtime/pawbench/pawbench/metrics.py
- id: vendored_outcome_rubrics
  path: worldfoundry/evaluation/tasks/execution/runners/pawbench/runtime/pawbench/pawbench/paweval/rubrics/outcome
- id: vendored_trustworthiness_rubrics
  path: worldfoundry/evaluation/tasks/execution/runners/pawbench/runtime/pawbench/pawbench/paweval/rubrics/trustworthiness
- id: pip_requirements
  path: worldfoundry/data/benchmarks/requirements/pawbench.txt
- id: task_yaml
  path: worldfoundry/data/benchmarks/tasks/external/pawbench.yaml
requires_cuda_visibility: false
required_imports:
- yaml
optional_imports:
- cv2
checkpoint_refs: []
base_model_dependencies: []
optional_base_model_dependencies: []
validation_command: worldfoundry-eval zoo benchmark-run --benchmark-id pawbench --mode official-validation
  --official-results-path <pawbench_metrics.json_or_run_dir> --output-dir <out> --json
