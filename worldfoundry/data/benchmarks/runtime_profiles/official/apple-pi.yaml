benchmark_ids: [apple-pi]
id: apple-pi
name: Apple-PI
environment_id: worldfoundry-unified-cu128
needs_new_env: false
readiness_note: >-
  The evaluator is in-tree and reuses WorldFoundry SAM3 and MoGe-2. Full scoring
  additionally needs the Apple-PI GT directory and a Gemini API key; the mock
  judge is wiring-only and is never benchmark evidence.

notes:
- No Apple-PI source checkout is imported at runtime.
- SAM3 and MoGe-2 are resolved through the existing base-model capability registry.
- The public release documents the GT layout, but the complete GT set is not vendored here.
- Apple-PI requires three rollouts for every case and subtrack.

python_path: ${WORLDFOUNDRY_UNIFIED_PYTHON:-python}
pythonpath_roots: [.]
preflight_command: >-
  PYTHONPATH=. ${WORLDFOUNDRY_UNIFIED_PYTHON:-python} -m
  worldfoundry.evaluation.tasks.execution.orchestration.runtime_preflight
  --profile apple-pi
  --manifest worldfoundry/data/benchmarks/runtime_profiles/official/apple-pi.yaml
  --output-dir tmp/worldfoundry_preflight/apple-pi --json

required_assets:
  in_tree_runtime_paths:
  - worldfoundry/evaluation/tasks/execution/runners/apple_pi/run_apple_pi_official_runner.py
  - worldfoundry/evaluation/tasks/execution/runners/apple_pi/apple_pi_runtime.py
  task_yaml: worldfoundry/data/benchmarks/tasks/external/apple-pi.yaml

required_env: []
optional_env:
- WORLDFOUNDRY_APPLE_PI_GT_DIR
- WORLDFOUNDRY_APPLE_PI_PREDICTION_DIR
- WORLDFOUNDRY_APPLE_PI_RESULTS_PATH
- WORLDFOUNDRY_APPLE_PI_JUDGE_BACKEND
- WORLDFOUNDRY_APPLE_PI_GEMINI_API_KEY
- WORLDFOUNDRY_APPLE_PI_SAM3_CHECKPOINT
- WORLDFOUNDRY_APPLE_PI_MOGE_CHECKPOINT
- GEMINI_API_KEY

required_imports:
- numpy
- PIL
- cv2
- torch
required_packages:
- numpy
- Pillow
- opencv-python
- torch
- huggingface-hub

required_paths:
- id: official_runner_script
  path: worldfoundry/evaluation/tasks/execution/runners/apple_pi/run_apple_pi_official_runner.py
- id: in_tree_runtime
  path: worldfoundry/evaluation/tasks/execution/runners/apple_pi/apple_pi_runtime.py
- id: task_yaml
  path: worldfoundry/data/benchmarks/tasks/external/apple-pi.yaml

optional_paths:
- id: apple_pi_gt_dir
  env: WORLDFOUNDRY_APPLE_PI_GT_DIR
- id: sam3_checkpoint
  env: WORLDFOUNDRY_APPLE_PI_SAM3_CHECKPOINT
- id: moge_checkpoint
  env: WORLDFOUNDRY_APPLE_PI_MOGE_CHECKPOINT

requires_cuda_visibility: false
status: in_tree_model_backed_runtime_ready
base_model_dependency_preflight:
  status: integrated
  shared_implementations:
  - worldfoundry.base_models.perception_core.segment.sam3
  - worldfoundry.base_models.three_dimensions.depth.moge
  model_ids:
  - facebook/sam3
  - Ruicheng/moge-2-vitl-normal
base_model_dependencies:
- sam3
- moge_v2_vitl_normal
optional_base_model_dependencies: []

bounded_fixture_validation:
  status: contract_and_mock_judge_ready
  official_benchmark_verified: false
  integration_evidence: false
  leaderboard_valid: false
  runtime_env: worldfoundry-unified-cu128

validation_command:
- ${WORLDFOUNDRY_UNIFIED_PYTHON:-python}
- -m
- worldfoundry.evaluation.tasks.execution.runners.apple_pi.run_apple_pi_official_runner
- --run-official
- --gt-dir
- ${WORLDFOUNDRY_APPLE_PI_GT_DIR}
- --pred-dir
- ${WORLDFOUNDRY_APPLE_PI_PREDICTION_DIR}
- --judge-backend
- mock
- --output-dir
- <out>
- --json
