benchmark_ids:
- mind
environment_id: worldfoundry-unified-cu128
id: mind
name: MIND
needs_new_env: false
notes:
- MIND validation can run the checked-in metric runtime with --run-official or import an existing MIND
  result JSON with --official-results-path.
- --run-fixture normalizes a bundled synthetic fixture, so result normalization needs no GPU, weights, or
  dataset.
- The lcm, visual, dino, and gsc metrics need CUDA plus lpips, torchmetrics, pyiqa, openai-clip, and av;
  the action metric additionally needs the ViPE CLI and checkout passed through --vipe-repo.
- MUSIQ-SPAQ, CLIP ViT-L/14, and LAION aesthetic weights are downloaded on demand into MIND_CACHE_DIR,
  which the runner pins under --output-dir.
- Use WORLDFOUNDRY_MIND_RESULTS_PATH for result normalization, or WORLDFOUNDRY_MIND_GT_ROOT plus
  WORLDFOUNDRY_GENERATED_ARTIFACT_DIR for --run-official.
python_path: ${WORLDFOUNDRY_UNIFIED_PYTHON:-python}
pythonpath_roots:
- .
required_assets:
  pip_requirements:
  - worldfoundry/data/benchmarks/requirements/mind.txt
  task_yaml: worldfoundry/data/benchmarks/tasks/external/mind.yaml
  hf_dataset_ids:
  - CSU-JPG/MIND
required_env: []
optional_env:
- WORLDFOUNDRY_GENERATED_ARTIFACT_DIR
- WORLDFOUNDRY_MIND_ROOT
- WORLDFOUNDRY_MIND_RESULTS_PATH
- WORLDFOUNDRY_MIND_GT_ROOT
- WORLDFOUNDRY_MIND_WEIGHTS_DIR
- WORLDFOUNDRY_MIND_DINO_PATH
- WORLDFOUNDRY_MIND_VIPE_REPO
- WORLDFOUNDRY_MIND_METRICS
required_imports: []
required_packages: []
required_paths:
- id: official_runner_script
  path: worldfoundry/evaluation/tasks/execution/runners/mind/run_mind_official_runner.py
- id: metrics_module
  path: worldfoundry/evaluation/tasks/execution/runners/mind/mind_metrics.py
- id: runtime_root
  path: worldfoundry/evaluation/tasks/execution/runners/mind/runtime/mind
- id: runtime_entrypoint
  path: worldfoundry/evaluation/tasks/execution/runners/mind/runtime/mind/src/process.py
- id: fixture
  path: worldfoundry/data/benchmarks/assets/mind/fixtures/mind_result_fixture.json
- id: pip_requirements
  path: worldfoundry/data/benchmarks/requirements/mind.txt
- id: task_yaml
  path: worldfoundry/data/benchmarks/tasks/external/mind.yaml
requires_cuda_visibility: true
status: normalizer_verified_official_runtime_pending
optional_base_model_dependencies:
- mind_metric_stack
validation_command:
- python
- worldfoundry/evaluation/tasks/execution/runners/mind/run_mind_official_runner.py
- --run-fixture
- --output-dir
- <out>
- --json
full_runtime_command:
- python
- worldfoundry/evaluation/tasks/execution/runners/mind/run_mind_official_runner.py
- --run-official
- --gt-root
- <MIND-Data>
- --generated-artifact-dir
- <model_outputs>
- --dino-path
- <dinov3_vitb16>
- --vipe-repo
- <vipe_checkout>
- --metrics
- lcm,visual,dino,action,gsc
- --output-dir
- <out>
- --json
full_runtime_requires:
- WORLDFOUNDRY_MIND_GT_ROOT
- WORLDFOUNDRY_GENERATED_ARTIFACT_DIR
- dinov3_vitb16 weights
- vipe CLI and checkout
- mind_metric_stack base-model assets
normalization_command:
- worldfoundry-eval
- zoo
- benchmark-run
- --benchmark-id
- mind
- --mode
- official-validation
- --official-results-path
- <mind_result.json>
- --output-dir
- <out>
- --json
