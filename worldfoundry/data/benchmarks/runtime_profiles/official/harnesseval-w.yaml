id: harnesseval-w
name: HarnessEval-W
benchmark_ids:
- harnesseval-w
environment_id: worldfoundry-unified-cu128
needs_new_env: false
status: normalizer_verified_full_suite_pending
python_path: ${WORLDFOUNDRY_UNIFIED_PYTHON:-python}
pythonpath_roots:
- .
required_assets:
  in_tree_runtime_paths:
  - worldfoundry/evaluation/tasks/execution/runners/harnesseval_w/runtime
  task_yaml: worldfoundry/data/benchmarks/tasks/external/harnesseval-w.yaml
  fixture: worldfoundry/data/benchmarks/assets/harnesseval-w
  hf_dataset_ids:
  - MirroS-Lab/HarnessEval-W
required_env: []
optional_env:
- WORLDFOUNDRY_HARNESSEVAL_RESULTS_PATH
- WORLDFOUNDRY_HARNESSEVAL_MANIFEST
- WORLDFOUNDRY_HARNESSEVAL_PLAN_ROOT
- WORLDFOUNDRY_HARNESSEVAL_MODEL_ID
- WORLDFOUNDRY_HARNESSEVAL_BACKEND_CONFIG
- WORLDFOUNDRY_HARNESSEVAL_PYTHON
- WORLDFOUNDRY_GENERATED_ARTIFACT_DIR
- HARNESSEVAL_WEIGHTS_ROOT
- HARNESSEVAL_UNIDEPTH_WEIGHTS
- HARNESSEVAL_VLM_API_KEY
required_paths:
- id: runner
  path: worldfoundry/evaluation/tasks/execution/runners/harnesseval_w/run_harnesseval_w.py
- id: task_yaml
  path: worldfoundry/data/benchmarks/tasks/external/harnesseval-w.yaml
- id: fixture
  path: worldfoundry/data/benchmarks/assets/harnesseval-w
requires_cuda_visibility: false
optional_base_model_dependencies:
- clip_vit_b32
- raft
- vbench_metric_checkpoint_assets
- wbench_quality_metric_assets
- wbench_hpsv3
- wbench_pavrm_qwen3vl
- wbench_megasam
- unidepth_v2_vitl14
validation_command:
- python
- -m
- worldfoundry.evaluation.tasks.execution.runners.harnesseval_w.run_harnesseval_w
- --run-fixture
- --strict
- --output-dir
- <out>
- --json
normalization_command:
- worldfoundry-eval
- zoo
- benchmark-run
- --benchmark-id
- harnesseval-w
- --mode
- official-validation
- --official-results-path
- <official_results>
- --output-dir
- <out>
- --json
full_runtime_command:
- python
- -m
- worldfoundry.evaluation.tasks.execution.runners.harnesseval_w.run_harnesseval_w
- --run-official
- --generated-artifact-dir
- <generation_root>
- --manifest
- <manifest.json>
- --plan-root
- <official_plans>
- --assets-root
- <dataset_root>
- --model-id
- <model_id>
- --backend-config
- <backend_config.json>
- --output-dir
- <out>
- --json
full_runtime_requires:
- Official manifests, initial observations and unmodified skill plans from MirroS-Lab/HarnessEval-W.
- Generated videos and metadata in the official outputs/<axis>/<family>/<model>/<case>
  layout.
- Scored inference requires CUDA, staged CLIP/RAFT/AMT/HPSv3/PAVRM/MegaSAM weights
  and an OpenAI-compatible VLM judge.
- Reuse registered MegaSAM and UniDepth base models and their assets, including
  WORLDFOUNDRY_UNIDEPTH_V2_VITL14_MODEL_DIR. All required inference sources are in-tree;
  build MegaSAM CUDA extensions and provide compatible weights before inference.
notes:
- CPU fixture, report normalization and cached scoring do not load model weights.
- The unified runtime must have the selected GPU backends and MegaSAM CUDA extensions
  installed; this integration does not install environments.
- HPSv3 uses registered base_models assets. Other weight paths follow the backend
  config, with registered AMT/RAFT/CLIP/aesthetic assets reused when staged.
- GPU smoke verified on a 12-frame synthetic video; repeated HarnessEval-W LocalBackend inference reuses one network load.
