benchmark_ids:
- ai2thor
id: ai2thor
name: AI2-THOR
environment_id: ai2thor-cloudrendering
needs_new_env: true
blocked_reason: Native closed-loop wiring is in tree; full official rollouts still need the AI2-THOR Python package,
  the Unity simulator build/cache, a CloudRendering or X11 display backend, and a policy checkpoint.
notes:
- Closed-loop execution is dispatched through worldfoundry-eval embodied run with the bundled FloorPlan wiring
  config; policies emit discrete simulator tokens such as forward/left/pickup.
- Official task suites such as ALFRED/TEACh are not bundled; the default scene tasks only validate the wiring.
- Recorded rollout results can be normalized on CPU through the embodied result normalizer without the simulator.
python_path: ${WORLDFOUNDRY_UNIFIED_PYTHON:-python}
pythonpath_roots:
- .
preflight_command: PYTHONPATH=. ${WORLDFOUNDRY_UNIFIED_PYTHON:-python} -m
  worldfoundry.evaluation.tasks.execution.orchestration.runtime_preflight --profile ai2thor --manifest
  worldfoundry/data/benchmarks/runtime_profiles/official/ai2thor.yaml --output-dir tmp/worldfoundry_preflight/ai2thor
  --json
required_assets:
  task_yaml: worldfoundry/data/benchmarks/tasks/external/ai2thor.yaml
  eval_config: worldfoundry/data/benchmarks/eval_configs/embodied/ai2thor/floorplan1.yaml
  local_repo_paths:
  - ${WORLDFOUNDRY_CACHE_DIR}/repos/allenai--ai2thor
required_env:
- WORLDFOUNDRY_AI2THOR_ROOT
- WORLDFOUNDRY_AI2THOR_RESULTS_PATH
optional_env:
- CUDA_VISIBLE_DEVICES
- DISPLAY
required_packages:
- numpy
optional_imports:
- numpy
- ai2thor
required_paths:
- id: official_result_normalizer
  path: worldfoundry/evaluation/tasks/embodied/normalizer.py
- id: eval_config
  path: worldfoundry/data/benchmarks/eval_configs/embodied/ai2thor/floorplan1.yaml
- id: task_yaml
  path: worldfoundry/data/benchmarks/tasks/external/ai2thor.yaml
requires_cuda_visibility: false
status: native_closed_loop_wiring_ready_full_runtime_pending
optional_base_model_dependencies:
- spatial_perception_core_stack
validation_command:
- worldfoundry-eval
- embodied
- run
- --config
- worldfoundry/data/benchmarks/eval_configs/embodied/ai2thor/floorplan1.yaml
