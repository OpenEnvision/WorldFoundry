benchmark_ids:
- likephys
blocked_reason: WorldFoundry recomputes LikePhys mis-rank from results_<model>.json; executing the ELBO probe
  additionally requires an official LikePhys checkout, CUDA, and the probed diffusion checkpoints.
environment_id: worldfoundry-unified-cu128
id: likephys
name: LikePhys
needs_new_env: false
notes:
- LikePhys scores a video diffusion model rather than generated videos, so no candidate-video directory is
  required for the normalizer path.
- The normalizer reads results_<model>.json from WORLDFOUNDRY_LIKEPHYS_RESULTS_PATH, an explicit path, or an
  experiment directory laid out as <results_root>/<scenario>/results_<model>.json.
- The --run-official probe drives the upstream evaluator.py from WORLDFOUNDRY_LIKEPHYS_EVALUATOR_ROOT inside a scratch
  workspace of symlinks, so the checkout and dataset are never mutated.
- Mis-rank is an error rate; lower is better for every metric in this profile.
preflight_command: PYTHONPATH=. ${WORLDFOUNDRY_UNIFIED_PYTHON:-python} -m
  worldfoundry.evaluation.tasks.execution.orchestration.runtime_preflight --profile likephys --manifest
  worldfoundry/data/benchmarks/runtime_profiles/official/likephys.yaml --output-dir
  tmp/worldfoundry_preflight/likephys --json
python_path: ${WORLDFOUNDRY_UNIFIED_PYTHON:-python}
pythonpath_roots:
- .
required_assets:
  user_supplied_data_layout:
  - <likephys_data_root>/<scenario>_videos/subgroup_XXX/valid_00.mp4
  - <likephys_data_root>/<scenario>_videos/subgroup_XXX/<variation>_00.mp4
  user_supplied_result_layout:
  - <likephys_results_root>/<scenario>/results_<probe_model>.json
  task_yaml: worldfoundry/data/benchmarks/tasks/external/likephys.yaml
required_env: []
optional_env:
- WORLDFOUNDRY_LIKEPHYS_EVALUATOR_ROOT
- WORLDFOUNDRY_LIKEPHYS_DATA_ROOT
- WORLDFOUNDRY_LIKEPHYS_DATASET_ROOT
- WORLDFOUNDRY_LIKEPHYS_RESULTS_PATH
- WORLDFOUNDRY_LIKEPHYS_STRICT
- WORLDFOUNDRY_BENCHMARK_DATA_ROOT
- WORLDFOUNDRY_GENERATED_ARTIFACT_DIR
required_packages: []
required_paths:
- id: official_runner_script
  path: worldfoundry/evaluation/tasks/execution/runners/likephys/run_likephys_official_runner.py
- id: task_yaml
  path: worldfoundry/data/benchmarks/tasks/external/likephys.yaml
requires_cuda_visibility: false
status: in_tree_misrank_scorer_ready_probe_requires_external_checkout
optional_imports:
- torch
- diffusers
base_model_dependencies: []
optional_base_model_dependencies:
- likephys_dataset_assets
validation_command:
- worldfoundry-eval
- zoo
- benchmark-run
- --benchmark-id
- likephys
- --mode
- official-validation
- --official-results-path
- <likephys_results_root>
- --output-dir
- <out>
- --json
