
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenEnvision Workspace</title>
  <link rel="icon" href="/assets/openenvision-logo.png" type="image/png" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d0d0f;
      --panel: #161719;
      --panel-2: #1e1f22;
      --line: #2b2d31;
      --line-hover: #3a3d42;
      --text: #ecedef;
      --muted: #8b929a;
      --accent: #10b981;
      --accent-hover: #059669;
      --accent-2: #f59e0b;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --warn: #f59e0b;
      --radius: 12px;
      --radius-sm: 8px;
      font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #3a3d42; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #4b5057; }
    .app {
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr);
      min-height: 100vh;
    }
    .sidebar {
      border-right: 1px solid var(--line);
      background: #111214;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 8px 16px;
      border-bottom: 1px solid var(--line);
    }
    .brandLogo {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-sm);
      background: #fff;
      object-fit: contain;
      padding: 2px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .brand strong { display: block; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
    .brand span { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
    .navGroup { display: grid; gap: 4px; }
    .navLabel {
      padding: 6px 12px;
      color: #6b7280;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .navBtn {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      text-align: left;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.15s ease;
    }
    .navBtn.active {
      background: #232529;
      color: #fff;
    }
    .navBtn:hover:not(.active) {
      background: #1a1c1e;
      color: var(--text);
    }
    .main {
      min-width: 0;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    .topbar {
      height: 64px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      background: rgba(13, 13, 15, 0.8);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .topbar h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
    .topbarRight { display: flex; align-items: center; gap: 16px; }
    .statusDot {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
    }
    .statusDot:before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
    }
    button, input, textarea, select {
      font: inherit;
    }
    .btn {
      border: 1px solid var(--line);
      background: #232529;
      color: var(--text);
      border-radius: var(--radius-sm);
      padding: 8px 14px;
      font-weight: 500;
      font-size: 13px;
      cursor: pointer;
      min-height: 36px;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:hover { border-color: var(--line-hover); background: #2b2d31; }
    .btn.primary {
      border-color: transparent;
      background: var(--accent);
      color: #fff;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }
    .btn.primary:hover { background: var(--accent-hover); }
    .btn.danger {
      border-color: transparent;
      background: var(--danger);
      color: #fff;
    }
    .btn.danger:hover { background: var(--danger-hover); }
    .content {
      padding: 24px 28px 40px;
      overflow: auto;
    }
    .view { display: none; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .view.active { display: block; }
    .toolbar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }
    .filters {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    label {
      display: grid;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
    }
    input, textarea, select {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: #09090b;
      color: var(--text);
      padding: 8px 12px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.15);
    }
    textarea {
      min-height: 100px;
      resize: vertical;
      line-height: 1.5;
    }
    .split {
      --split-left: 360px;
      --split-handle: 10px;
      display: grid;
      grid-template-columns: var(--split-left) var(--split-handle) minmax(0, 1fr);
      gap: 0;
      align-items: stretch;
      min-width: 0;
    }
    .splitHandle {
      position: relative;
      width: var(--split-handle);
      cursor: col-resize;
      touch-action: none;
      user-select: none;
      border-radius: 999px;
      background: transparent;
      align-self: stretch;
      z-index: 2;
    }
    .splitHandle::before {
      content: "";
      position: absolute;
      top: 12px;
      bottom: 12px;
      left: 50%;
      width: 3px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: var(--line);
      transition: background 0.15s ease, box-shadow 0.15s ease;
    }
    .splitHandle:hover::before,
    .splitHandle:focus-visible::before,
    .split.is-resizing .splitHandle::before {
      background: var(--accent);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.18);
    }
    .splitHandle:focus-visible {
      outline: none;
    }
    .split.is-resizing {
      cursor: col-resize;
      user-select: none;
    }
    .split.is-resizing .panel {
      pointer-events: none;
    }
    .panel {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: var(--radius);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      overflow: hidden;
      min-width: 0;
    }
    .panelHead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-2);
    }
    .panelHead strong { font-size: 15px; font-weight: 600; }
    .jobList { display: grid; }
    .jobRow {
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      color: inherit;
      text-align: left;
      padding: 16px 20px;
      cursor: pointer;
      display: grid;
      gap: 8px;
      transition: background 0.15s ease;
    }
    .jobRow:last-child { border-bottom: 0; }
    .jobRow:hover, .jobRow.active { background: #1c1e22; }
    .jobRow.active { border-left: 3px solid var(--accent); padding-left: 17px; }
    .jobTitleLine {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }
    .jobTitleLine strong { font-size: 14px; font-weight: 500; }
    .pill {
      display: inline-flex;
      align-items: center;
      background: #232529;
      border-radius: 999px;
      padding: 4px 10px;
      color: var(--text);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    .pill.running { background: rgba(16, 185, 129, 0.15); color: #34d399; }
    .pill.completed { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
    .pill.failed, .pill.cancelled { background: rgba(239, 68, 68, 0.15); color: #f87171; }
    .muted { color: var(--muted); }
    .tiny { font-size: 12px; }
    .detail {
      align-content: start;
      display: grid;
      gap: 14px;
      padding: 16px 20px 20px;
      min-height: 0;
    }
    .detailTabs {
      align-items: center;
      align-self: start;
      display: flex;
      flex-wrap: wrap;
      flex: none;
      gap: 8px;
      margin: 0;
    }
    .detailTab {
      appearance: none;
      align-items: center;
      border: 1px solid var(--line);
      background: #111214;
      color: var(--muted);
      border-radius: 999px;
      display: inline-flex;
      flex: none;
      gap: 2px;
      height: auto;
      line-height: 1.2;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .detailTab:hover { border-color: var(--line-hover); color: var(--text); }
    .detailTab.active {
      background: rgba(16, 185, 129, 0.12);
      border-color: rgba(16, 185, 129, 0.45);
      color: #34d399;
    }
    .detailTabPanel { display: none; gap: 16px; min-width: 0; }
    .detailTabPanel.active { display: grid; align-content: start; }
    .logToolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .logFilter {
      appearance: none;
      border: 1px solid var(--line);
      background: #111214;
      color: var(--muted);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .logFilter.active {
      color: var(--text);
      border-color: var(--line-hover);
      background: #1a1c1e;
    }
    .logFilter.system.active { color: #fbbf24; border-color: rgba(251, 191, 36, 0.35); }
    .logFilter.stdout.active { color: #60a5fa; border-color: rgba(96, 165, 250, 0.35); }
    .logFilter.stderr.active { color: #f87171; border-color: rgba(248, 113, 113, 0.35); }
    .logFollow {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
    }
    .logFollow input {
      width: 14px;
      height: 14px;
      min-height: 0;
      margin: 0;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .logPanel {
      margin: 0;
      border: 1px solid var(--line);
      background: #09090b;
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      color: #e5e7eb;
      overflow: auto;
      min-height: 50vh;
      max-height: min(72vh, 900px);
      font-family: 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', monospace;
      font-size: 12px;
      line-height: 1.55;
    }
    .logLine {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 8px;
      align-items: start;
      padding: 2px 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .logMeta {
      color: #71717a;
      font-weight: 600;
      white-space: nowrap;
    }
    .logLine.log-stream-system .logMeta { color: #fbbf24; }
    .logLine.log-stream-stdout .logMeta { color: #60a5fa; }
    .logLine.log-stream-stderr .logMeta { color: #f87171; }
    .logText { color: #e5e7eb; }
    .logBadge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 18px;
      margin-left: 4px;
      padding: 0 5px;
      border-radius: 999px;
      background: #232529;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
    }
    .detailTab.active .logBadge { background: rgba(16, 185, 129, 0.18); color: #6ee7b7; }
    .detailGrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .metric {
      border: 1px solid var(--line);
      background: #111214;
      border-radius: var(--radius-sm);
      padding: 14px;
      min-height: 64px;
    }
    .metric span { display: block; color: var(--muted); font-size: 12px; margin-bottom: 6px; font-weight: 500; }
    .metric strong { font-size: 14px; font-weight: 500; overflow-wrap: anywhere; }
    .metric-wide { grid-column: 1 / -1; }
    .pathMetric { min-height: 0; }
    .pathRow {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .pathBasename {
      font-size: 14px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
      flex: 1;
    }
    .pathParent {
      margin-top: 6px;
      font-family: 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', monospace;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .btn.tiny {
      min-height: 28px;
      padding: 4px 10px;
      font-size: 11px;
      flex-shrink: 0;
    }
    .artifactLinks {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      align-self: start;
      gap: 8px;
    }
    .artifactLink {
      appearance: none;
      box-sizing: border-box;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      height: 32px;
      min-height: 32px;
      max-height: 32px;
      border: 1px solid var(--line);
      background: #111214;
      color: var(--text);
      border-radius: var(--radius-sm);
      padding: 0 10px;
      font-size: 12px;
      font-weight: 500;
      line-height: 1;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
    }
    .artifactLink:hover { border-color: var(--line-hover); background: #1a1c1e; }
    .artifactLink.galleryDelete { color: #fca5a5; }
    .artifactLink.galleryDelete:hover { border-color: #ef4444; background: #1c1010; }
    pre {
      margin: 0;
      border: 1px solid var(--line);
      background: #09090b;
      border-radius: var(--radius-sm);
      padding: 16px;
      color: #e5e7eb;
      overflow: auto;
      min-height: 240px;
      max-height: min(72vh, 900px);
      font-family: 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', monospace;
      font-size: 12px;
      line-height: 1.6;
    }
    .gridCards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .itemCard {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
      min-height: 160px;
      min-width: 0;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .itemCard > .artifactLinks {
      margin-top: auto;
      align-self: stretch;
    }
    .itemCard:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--line-hover);
    }
    .itemCard strong { font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
    .itemCard p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .catalogCard .catalogName {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      overflow: hidden;
      line-height: 1.3;
      min-height: calc(15px * 1.3 * 2);
    }
    .catalogCard .catalogSummary {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      line-clamp: 3;
      overflow: hidden;
      min-height: calc(13px * 1.5 * 3);
    }
    .galleryPrompt {
      display: grid;
      gap: 6px;
      min-width: 0;
    }
    .galleryPromptText {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      line-clamp: 3;
      overflow: hidden;
    }
    .galleryPrompt.is-expanded .galleryPromptText,
    .galleryPrompt.is-short .galleryPromptText {
      display: block;
      -webkit-line-clamp: unset;
      line-clamp: unset;
      overflow: visible;
    }
    .galleryPromptToggle {
      appearance: none;
      border: 0;
      background: none;
      padding: 0;
      margin: 0;
      width: fit-content;
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
    }
    .galleryPromptToggle:hover { color: var(--accent-hover); }
    #galleryGrid.gridCards { align-items: stretch; }
    .galleryCard { height: 100%; }
    .galleryCard > strong {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      overflow: hidden;
      line-height: 1.3;
      min-height: calc(15px * 1.3 * 2);
    }
    .galleryCard .mediaBox,
    .galleryCard .mediaStack { flex-shrink: 0; }
    .galleryCard .galleryPrompt {
      flex: 1 1 auto;
      min-height: calc(13px * 1.5 * 3 + 24px);
    }
    .galleryCard .galleryPromptText {
      min-height: calc(13px * 1.5 * 3);
    }
    .galleryCard > .artifactLinks {
      min-height: 32px;
      flex-shrink: 0;
    }
    .visualizerCard {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 100%;
      height: 100%;
    }
    #visualizerGrid.gridCards {
      align-items: stretch;
    }
    .visualizerHead {
      display: grid;
      gap: 8px;
    }
    .visualizerHead strong {
      min-height: 2.5em;
      line-height: 1.25;
    }
    .visualizerAliases {
      margin: 0;
      min-height: 2.8em;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
    .visualizerControls {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      min-height: 214px;
      align-content: start;
    }
    .visualizerControls label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }
    .visualizerControls .wide { grid-column: 1 / -1; }
    .visualizerControls textarea {
      min-height: 118px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
    }
    .visualizerFieldReserved {
      opacity: 0;
      pointer-events: none;
      user-select: none;
    }
    .visualizerFooter {
      margin-top: auto;
      display: grid;
      gap: 10px;
    }
    .visualizerActions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .visualizerStatus {
      border: 1px solid var(--line);
      background: #111214;
      border-radius: var(--radius-sm);
      padding: 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }
    .visualizerPreviewPanel {
      margin-top: 16px;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-md);
    }
    .visualizerPreviewPanel.hidden { display: none; }
    .visualizerPreviewPanel .panelHead {
      flex-wrap: wrap;
      gap: 12px;
    }
    .visualizerPreviewTabs {
      display: flex;
      flex: 1 1 auto;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }
    .visualizerPreviewTab {
      appearance: none;
      border: 1px solid var(--line);
      background: #111214;
      color: var(--text);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }
    .visualizerPreviewTab:hover { border-color: var(--line-hover); background: #1a1c1e; }
    .visualizerPreviewTab.active {
      border-color: var(--accent);
      background: rgba(16, 185, 129, 0.12);
      color: #6ee7b7;
    }
    .visualizerPreviewFrame {
      width: 100%;
      height: min(68vh, 720px);
      min-height: 420px;
      border: 0;
      display: block;
      background: #050505;
    }
    .mediaBox {
      border: 1px solid var(--line);
      background: #09090b;
      border-radius: var(--radius-sm);
      aspect-ratio: 16 / 9;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      min-height: 180px;
      display: grid;
      grid-template: 1fr / 1fr;
      overflow: hidden;
      position: relative;
      contain: layout paint style;
      isolation: isolate;
    }
    .mediaBox > * {
      grid-area: 1 / 1;
    }
    .mediaBox video, .mediaBox img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #09090b;
    }
    .mediaBox video:not([src]) { visibility: hidden; }
    .mediaPoster {
      z-index: 1;
      pointer-events: none;
    }
    .mediaBox video[src] {
      visibility: visible;
      z-index: 0;
      background: transparent;
    }
    .media-has-frame video {
      z-index: 2;
      background: #09090b;
    }
    .mediaStack {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 8px;
      min-width: 0;
    }
    .mediaLoad {
      appearance: none;
      align-self: flex-start;
      border: 1px solid var(--line);
      background: #111214;
      color: var(--text);
      border-radius: var(--radius-sm);
      height: 32px;
      padding: 0 10px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }
    .mediaLoad:hover { border-color: var(--line-hover); background: #1a1c1e; }
    .mediaHint {
      position: absolute;
      right: 10px;
      bottom: 10px;
      color: var(--muted);
      font-size: 11px;
      background: rgba(0,0,0,0.45);
      border-radius: 999px;
      padding: 4px 8px;
      z-index: 2;
      pointer-events: none;
    }
    .media-loaded .mediaLoad, .media-loaded .mediaHint { display: none; }
    dialog {
      width: min(800px, calc(100vw - 32px));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      color: var(--text);
      padding: 0;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    dialog::backdrop { background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); }
    .modalHead, .modalFoot {
      padding: 16px 24px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--panel-2);
    }
    .modalFoot { border-top: 1px solid var(--line); border-bottom: 0; justify-content: flex-end; gap: 12px; }
    .modalBody { padding: 24px; display: grid; gap: 16px; max-height: calc(100vh - 160px); overflow-y: auto; }
    .formGrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .formGrid .wide { grid-column: 1 / -1; }
    .dynamicGrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .dynamicGrid .wide { grid-column: 1 / -1; }
    .checks {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 8px;
    }
    .check {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--line);
      background: #111214;
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .check:hover { background: #1a1c1e; border-color: var(--line-hover); }
    .check input { width: 16px; height: 16px; min-height: 0; margin: 0; cursor: pointer; accent-color: var(--accent); }
    .hidden { display: none !important; }
    @media (max-width: 920px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { position: sticky; top: 0; z-index: 20; flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 12px 16px; gap: 12px; align-items: center; }
      .brand { border-bottom: 0; min-width: max-content; padding: 0 12px 0 0; }
      .navGroup { display: flex; align-items: center; gap: 8px; }
      .navLabel { display: none; }
      .navBtn { white-space: nowrap; }
      .split { grid-template-columns: 1fr; gap: 16px; }
      .splitHandle { display: none; }
      .formGrid, .checks, .visualizerControls { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <dialog id="createDialog">

      <div class="modalBody">
        <div class="formGrid">
          <label>Job Type<select id="jobType"><option value="inference">Inference</option><option value="evaluation">Evaluation</option></select></label>
          <label>Workload<select id="workloadType"><option value="t2v">T2V</option><option value="i2v">I2V</option><option value="v2v">V2V</option><option value="3d">3D</option><option value="geometry">Geometry</option><option value="action">Action</option><option value="api">API</option><option value="world">World</option></select></label>

          <label>Attention<select id="attention"><option value="auto">auto</option><option value="torch">torch</option><option value="flash_attn_2">flash_attn_2</option><option value="flash_attn_3">flash_attn_3</option><option value="sage">sage</option><option value="xformers">xformers</option></select></label>

        </div>

          <label class="check"><input type="checkbox" id="torchCompile" /> Torch Compile</label>

  </dialog>
  <script>
    const studioAuthToken = new URLSearchParams(window.location.search).get("token") || "";
    const state = { view: "inference", jobs: [], models: [], evaluationCatalog: {benchmarks: [], metrics: [], models: []}, visualizers: [], visualizerPreviewMode: "", activeJob: "", detailRenderKey: "", detailTab: "preview", detailLogCount: 0, logStreamFilter: "all", logFollowTail: true, settings: {}, lazyVideoObserver: null, autoVideoPreloads: 0, visualizerRefreshInFlight: false, visualizerLastSync: 0 };
    const MAX_AUTO_VIDEO_PRELOADS = 4;
    const JOB_VIEWS = new Set(["inference", "evaluation"]);
    const INFER_INFRA_FIELDS = ["workloadType","modelSelect","variantSelect","taskProfile","device","backend","attention","modelRef","endpoint","apiKey","callJson","loadJson"];
    const INFER_TASK_FIELD_CONTROLS = {
      prompt: ["prompt"],
      negativePrompt: ["negative_prompt", "negative-prompt"],
      inputPath: ["input_path", "image", "video", "last_frame", "reference_file", "reference_files"],
      numFrames: ["frames", "num_frames", "num-frames"],
      fps: ["fps"],
      height: ["height"],
      width: ["width"],
      steps: ["steps", "num_inference_steps", "num-inference-steps", "sampling_steps", "sampling-steps"],
      guidance: ["guidance", "guidance_scale", "guidance-scale"],
      seed: ["seed"]
    };
    const DEDICATED_INFER_FIELD_IDS = new Set(Object.values(INFER_TASK_FIELD_CONTROLS).flat().map(normalizeFieldId));
    const PARAM_KEY_BY_FIELD_ID = {
      frames: "num_frames",
      "num-frames": "num_frames",
      num_frames: "num_frames",
      steps: "num_inference_steps",
      "num-inference-steps": "num_inference_steps",
      num_inference_steps: "num_inference_steps",
      "sampling-steps": "num_inference_steps",
      sampling_steps: "num_inference_steps",
      guidance: "guidance_scale",
      "guidance-scale": "guidance_scale",
      guidance_scale: "guidance_scale"
    };
    const RUNTIME_CHECK_OPTIONS = {
      torchCompile: "torch_compile",
      cpuOffload: "cpu_offload",
      vaeOffload: "vae_cpu_offload",
      textOffload: "text_encoder_cpu_offload",
      fuseQkv: "fuse_qkv",
      inplaceResidual: "inplace_residual",
      staticCrossKv: "static_cross_kv",
      fusedRope: "fused_rope"
    };
    const RUNTIME_VALUE_CONTROLS = {
      qkvStrategy: {key: "qkv_strategy", kind: "choice", fallback: "auto"},
      qkvSplitThreshold: {key: "qkv_split_threshold", kind: "integer", fallback: 8192},
      ropePrecision: {key: "rope_precision", kind: "choice", fallback: "fp32"},
      rmsNormPrecision: {key: "rms_norm_precision", kind: "choice", fallback: "input"}
    };
    const VIEW_TITLES = {
      inference: "Inference",
      evaluation: "Evaluation",
      catalog: "Catalog",
      gallery: "Gallery",
      artifacts: "Artifacts",
      visualizers: "Visualizers"
    };
    const $ = (id) => document.getElementById(id);
    function isSameOriginHttpUrl(raw) {
      try {
        const url = new URL(String(raw || ""), window.location.href);
        return url.origin === window.location.origin && ["http:", "https:"].includes(url.protocol);
      } catch {
        return false;
      }
    }
    function authenticatedUrl(raw) {
      const value = String(raw || "");
      if (!studioAuthToken || !value) return value;
      try {
        const url = new URL(value, window.location.href);
        if (isSameOriginHttpUrl(url)) {
          url.searchParams.set("token", studioAuthToken);
        }
        return url.toString();
      } catch {
        return value;
      }
    }
    async function api(path, opts = {}) {
      const headers = new Headers(opts.headers || {});
      const url = authenticatedUrl(path);
      if (studioAuthToken && isSameOriginHttpUrl(url)) {
        headers.set("Authorization", `Bearer ${studioAuthToken}`);
      }
      const res = await fetch(url, { ...opts, headers });
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }
    function splitList(value) {
      return String(value || "").split(",").map(item => item.trim()).filter(Boolean);
    }
    function parseJsonField(id, fallback) {
      const text = $(id).value || "";
      if (!text.trim()) return fallback;
      return JSON.parse(text);
    }
    function optionInArgs(args, ...names) {
      return args.some(arg => names.some(name => arg === name || arg.startsWith(`${name}=`)));
    }
    function normalizeFieldId(value) {
      return String(value || "").trim().toLowerCase().replaceAll("_", "-");
    }
    function fieldControlVisible(id) {
      const el = $(id);
      if (!el) return false;
      const wrapper = el.closest("label") || el;
      return !wrapper.classList.contains("hidden");
    }
    function runtimeCheckVisible(id) {
      const el = $(id);
      if (!el) return false;
      const wrapper = el.closest(".check") || el;
      return !wrapper.classList.contains("hidden");
    }
    function inferTaskFields() {
      const task = selectedTaskProfile();
      return task && Array.isArray(task.inputs) ? task.inputs : [];
    }
    function inferTaskFieldIds() {
      return new Set(inferTaskFields().map(field => normalizeFieldId(field.field_id)));
    }
    function coerceInferFieldValue(input) {
      if (input.type === "checkbox") return input.checked;
      const raw = input.value;
      const kind = input.dataset.kind || "string";
      if (raw === "" && input.dataset.required !== "true") return undefined;
      if (kind === "integer") return Number.parseInt(raw || "0", 10);
      if (kind === "number") return Number(raw || "0");
      if (kind === "interaction_tokens") {
        try {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) return parsed.map(String).filter(Boolean);
          if (typeof parsed === "string") return splitList(parsed);
        } catch {}
        return splitList(raw);
      }
      if (kind === "json") return JSON.parse(raw || "null");
      if (kind === "boolean") return Boolean(input.checked);
      return raw;
    }
    function applyInferValue(target, fieldId, value, payload) {
      if (value === undefined || value === null || value === "") return;
      const key = PARAM_KEY_BY_FIELD_ID[fieldId] || fieldId.replaceAll("-", "_");
      if (target === "prompt") payload.prompt = String(value);
      else if (target === "input_path") payload.input_path = String(value);
      else if (target === "params") payload.params[key] = value;
      else if (target === "load_kwargs") payload.load_kwargs[key] = value;
      else payload.call_kwargs[key] = value;
    }
    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[ch]);
    }
    function safeClassToken(value) {
      return String(value ?? "").toLowerCase().replace(/[^a-z0-9_-]+/g, "-");
    }
    function optionHtml(value, label, attrs = {}) {
      const extra = Object.entries(attrs)
        .map(([key, attrValue]) => ` ${safeClassToken(key)}="${escapeHtml(attrValue)}"`)
        .join("");
      return `<option value="${escapeHtml(value)}"${extra}>${escapeHtml(label ?? value)}</option>`;
    }
    function pillHtml(value, extraClass = "") {
      return `<span class="pill ${safeClassToken(extraClass || value)}">${escapeHtml(value)}</span>`;
    }
    function renderVideoBox(url, options = {}) {
      const src = escapeHtml(authenticatedUrl(url));
      const posterUrl = options.poster ? authenticatedUrl(options.poster) : "";
      const poster = posterUrl ? ` poster="${escapeHtml(posterUrl)}"` : "";
      const posterImg = posterUrl
        ? `<img class="mediaPoster" loading="lazy" decoding="async" src="${escapeHtml(posterUrl)}" alt="" onerror="this.remove()" />`
        : "";
      const eager = !!options.eager;
      return `<div class="mediaStack ${eager ? "media-loaded" : ""}" data-media-box>
        <div class="mediaBox">
          ${posterImg}
          <video controls playsinline controlsList="nodownload" preload="${eager ? "metadata" : "none"}"${poster} data-src="${src}" data-eager="${eager ? "true" : "false"}"></video>
          ${eager ? "" : `<span class="mediaHint">video</span>`}
        </div>
        ${eager ? "" : `<button class="mediaLoad" type="button" data-load-video>Play preview</button>`}
      </div>`;
    }
    function gallerySubtitle(row) {
      const prompt = String(row.prompt || "").trim();
      if (prompt) return prompt;
      const runId = String(row.run_id || "").trim();
      if (runId) return runId;
      return pathBasename(row.output_dir || "");
    }
    function renderGalleryPrompt(row) {
      return `<div class="galleryPrompt">
        <p class="galleryPromptText">${escapeHtml(gallerySubtitle(row))}</p>
        <button type="button" class="galleryPromptToggle" hidden aria-expanded="false">Show more</button>
      </div>`;
    }
    function bindGalleryPrompts(root) {
      if (!root) return;
      root.querySelectorAll(".galleryPrompt").forEach(box => {
        const textEl = box.querySelector(".galleryPromptText");
        const btn = box.querySelector(".galleryPromptToggle");
        if (!textEl || !btn) return;
        const text = (textEl.textContent || "").trim();
        const overflows = textEl.scrollHeight > textEl.clientHeight + 2;
        if (!overflows && text.length < 120) {
          box.classList.add("is-short");
          btn.hidden = true;
          return;
        }
        btn.hidden = false;
        btn.onclick = () => {
          const expanded = box.classList.toggle("is-expanded");
          btn.setAttribute("aria-expanded", expanded ? "true" : "false");
          btn.textContent = expanded ? "Show less" : "Show more";
        };

          dragging = true;
          activePointerId = event.pointerId;
          split.classList.add("is-resizing");
          handle.setPointerCapture(event.pointerId);
          handle.addEventListener("pointermove", onPointerMove);
          handle.addEventListener("pointerup", stopDrag);
          handle.addEventListener("pointercancel", stopDrag);
          onPointerMove(event);
        });
        handle.addEventListener("dblclick", () => {
          if (getComputedStyle(handle).display === "none") return;
          applySplitLeft(split, defaultWidth);
        });
        handle.addEventListener("keydown", (event) => {
          if (getComputedStyle(handle).display === "none") return;
          const current = currentSplitLeft(split, defaultWidth);
          if (event.key === "ArrowLeft") {
            event.preventDefault();
            applySplitLeft(split, current - 24);
          } else if (event.key === "ArrowRight") {
            event.preventDefault();
            applySplitLeft(split, current + 24);
          } else if (event.key === "Home") {
            event.preventDefault();
            applySplitLeft(split, defaultWidth);
          }
        });
      });

      // One shared resize listener reclamps all splits when the viewport changes.
      if (!window.__wfSplitResizeBound) {
        window.__wfSplitResizeBound = true;
        let resizeTimer = 0;
        window.addEventListener("resize", () => {
          window.clearTimeout(resizeTimer);
          resizeTimer = window.setTimeout(() => {
            document.querySelectorAll(".split[data-split-key]").forEach(split => {
              const fallback = Number(split.dataset.splitDefault || 360);
              applySplitLeft(split, currentSplitLeft(split, fallback), { persist: false });
            });
          }, 50);
        });
      }
    }
    initResizableSplits();
    initializeWorkspace()
      .catch(err => { $("serverState").textContent = err.message; });
    setInterval(refreshJobs, 3000);
    setInterval(() => refreshVisualizersRealtime(), 1500);
  </script>
</body>
</html>
