[tool.setuptools_scm]

[tool.pytest.ini_options]
# A CPU gate that runs in a public checkout with the test extra. Select other
# suites explicitly; they can require model-specific or local-only resources.
testpaths = [
    "tests/core/test_core_module_boundaries.py",
    "tests/core/test_process_logging.py",
    "tests/runtime/test_device_pool.py",
    "tests/runtime/test_geometry_regression.py",
    "tests/runtime/test_local_checkpoint_cache.py",
    "tests/runtime/test_jobs_store_persistence.py",
    "tests/runtime/test_jobs_logging.py",
    "tests/studio/test_conda_dispatch.py",
    "tests/studio/test_inference_lifecycle.py",
    "tests/studio/test_module_boundaries.py",
    "tests/studio/test_workspace_app_subprocess_safety.py",
    "tests/studio/test_execution_pipeline_cleanup.py",
    "tests/studio/test_job_store_shutdown.py",
    "tests/eval_core/test_packaging_license_gate.py",
    "tests/test_worldfoundry_studio_pipeline_cache.py",
    "tests/test_worldfoundry_studio_resident_workers.py",
]
addopts = "--import-mode=importlib"
norecursedirs = [".*", "__pycache__", "build", "dist", "manual", "stream"]
markers = [
    "fast_eval_core: evaluation framework contracts",
    "unit: focused unit tests",
    "gpu: requires a CUDA device and model-specific dependencies",
]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
    "thirdparty",
    "cache",
    "tmp",
    "outputs",
    "runs",
    "benchmark_results",
    "inspatio_world_output",
    "docs/fumadocs/.next",
    "docs/fumadocs/node_modules",
    "docs/fumadocs/out",
    "apps",
    "worldfoundry/base_models",
    "worldfoundry/synthesis",
    "worldfoundry/evaluation/tasks/execution/runners/*/runtime",
    "worldfoundry/evaluation/tasks/metrics/*/vendor",
    "worldfoundry/evaluation/tasks/execution/runners/*/runtime",
    "worldfoundry/evaluation/tasks/execution/runners/*/official",
    "worldfoundry/evaluation/tasks/metrics/*/vendor",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
]
ignore = [
    "E501",
]

[tool.setuptools]
# Package discovery deliberately uses setuptools namespace semantics: every
# directory below worldfoundry/ is a candidate, even without __init__.py.
# `make packaging-check` rejects dead excludes and any license-gated package
# that reaches the final wheel set.
packages = { find = { where = ["."], namespaces = true, include = ["worldfoundry*"], exclude = [

    # Reserved public-distribution boundaries; these stay excluded even when absent.
    "worldfoundry.training",
    "worldfoundry.training.*",
    "worldfoundry.cli.training_commands",
    "worldfoundry.cli.training_commands.*",
    "*.tests",
    "*.tests.*",
    "*.test",
    "*.test.*",
    "*.testing",
    "*.testing.*",
    # Structural: upstream runtime mirrors and inner checkouts never ship.
    "worldfoundry.synthesis.visual_generation.*.runtime*",
    "worldfoundry.synthesis.visual_generation.*.*_runtime*",
    "worldfoundry.base_models.*.*.*_runtime.src*",
    "worldfoundry.base_models.*.*.*_runtime.*.src*",
    "worldfoundry.base_models.*.*.pixelsplat.src*",
    "worldfoundry.base_models.*.vggt_omega.vggt_omega",
    "worldfoundry.base_models.*.vggt_omega.vggt_omega.*",
    "worldfoundry.base_models.*.pixelsplat",
    "worldfoundry.base_models.*.eastern_journalist.utils3d",
    "worldfoundry.base_models.*.eastern_journalist.utils3d.*",
    "worldfoundry.base_models.*.*_runtime",
    "worldfoundry.base_models.*.*_runtime.*",
    # License-gated vendored trees (local checkouts only; see MANIFEST.in).
    "worldfoundry.base_models.three_dimensions.depth.unik3d",
    "worldfoundry.base_models.three_dimensions.depth.unik3d.*",
    "worldfoundry.base_models.three_dimensions.general_3d.dust3r",
    "worldfoundry.base_models.three_dimensions.general_3d.dust3r.*",
    "worldfoundry.base_models.three_dimensions.general_3d.four_d_gaussians",
    "worldfoundry.base_models.three_dimensions.general_3d.four_d_gaussians.*",
    "worldfoundry.base_models.three_dimensions.general_3d.mast3r",
    "worldfoundry.base_models.three_dimensions.general_3d.mast3r.*",
    "worldfoundry.base_models.three_dimensions.general_3d.monst3r",
    "worldfoundry.base_models.three_dimensions.general_3d.monst3r.*",
    "worldfoundry.base_models.three_dimensions.general_3d.stable_virtual_camera",
    "worldfoundry.base_models.three_dimensions.general_3d.stable_virtual_camera.*",
    "worldfoundry.base_models.three_dimensions.point_clouds.gaussian_splatting",
    "worldfoundry.base_models.three_dimensions.point_clouds.gaussian_splatting.*",
    "worldfoundry.base_models.three_dimensions.point_clouds.pi3",
    "worldfoundry.base_models.three_dimensions.point_clouds.pi3.*",
    "worldfoundry.synthesis.visual_generation.hunyuan_world.hunyuan_game_craft",
    "worldfoundry.synthesis.visual_generation.hunyuan_world.hunyuan_game_craft.*",
    "worldfoundry.synthesis.visual_generation.hunyuan_world.hunyuan_world_voyager",
    "worldfoundry.synthesis.visual_generation.hunyuan_world.hunyuan_world_voyager.*",
] } }
include-package-data = true

