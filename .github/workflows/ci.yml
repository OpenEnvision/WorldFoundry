name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  geometry-impact:
    name: geometry-impact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout with diff history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Plan affected 3D, video and world-model replays without weights or GPU
        env:
          IMPACT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$IMPACT_BASE_SHA" ] \
            && [ "$IMPACT_BASE_SHA" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${IMPACT_BASE_SHA}^{commit}" 2>/dev/null; then
            python tests/manual/geometry_regression_impact.py --base "$IMPACT_BASE_SHA" --output tmp/geometry-impact.json
          else
            python tests/manual/geometry_regression_impact.py --changed-file worldfoundry/core/__init__.py --output tmp/geometry-impact.json
          fi
      - name: Publish required replay plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geometry-impact
          path: tmp/geometry-impact.json
          retention-days: 14
          if-no-files-found: error
      - name: Install declaration reader
        if: always()
        run: python -m pip install "PyYAML>=6"
      - name: Check native replay declaration coverage (advisory)
        id: coverage
        if: always()
        continue-on-error: true
        env:
          IMPACT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$IMPACT_BASE_SHA" ] \
            && [ "$IMPACT_BASE_SHA" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${IMPACT_BASE_SHA}^{commit}" 2>/dev/null; then
            python tests/manual/inference_regression_coverage.py --base "$IMPACT_BASE_SHA" --output tmp/inference-coverage.json
          else
            python tests/manual/inference_regression_coverage.py --output tmp/inference-coverage.json
          fi
      - name: Write PR GPU validation summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          lines = ["## GPU Regression Impact & Coverage Summary", ""]
          impact_path = Path("tmp/geometry-impact.json")
          if impact_path.is_file():
              impact = json.loads(impact_path.read_text(encoding="utf-8"))
              selected = impact.get("selected_cases", [])
              lines.append(f"- **Impact status**: `{impact.get('status', 'unknown')}` (`{len(selected)}` affected case(s))")
              if selected:
                  lines.append("- **Affected cases**: " + ", ".join(f"`{c}`" for c in selected[:20]))
                  if len(selected) > 20:
                      lines.append(f"  _(+{len(selected) - 20} more in `geometry-impact` artifact)_")
          cov_path = Path("tmp/inference-coverage.json")
          if cov_path.is_file():
              cov = json.loads(cov_path.read_text(encoding="utf-8"))
              lines.append(
                  f"- **Declaration coverage**: `{cov.get('status', 'unknown')}` "
                  f"(`{cov.get('native_variants_with_replay_recipes', '?')}` covered / "
                  f"`{cov.get('frozen_native_variants', '?')}` frozen)"
              )
          lines += [
              "",
              "### Local GPU Validation Commands",
              "```bash",
              "make test-infer-cuda-contracts",
              "make test-infer-sol-cuda-contracts",
              "make plan-inference INFERENCE_BASE=$(git merge-base origin/main HEAD)",
              "```",
          ]
          summary.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - name: Publish coverage definitions and gaps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inference-coverage
          path: tmp/inference-coverage.json
          retention-days: 14
          if-no-files-found: error

  cpu-tests:
    name: cpu-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run public CPU inference and packaging tests
        run: make test
      - name: Validate documented commands and catalog claims without weights
        run: make test-docs-contracts
      - name: Publish complete CPU selection and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-cpu-contracts
          path: |
            tmp/public-cpu-selection.json
            tmp/public-cpu-contracts.xml
            tmp/docs-contract-selection.json
            tmp/docs-contracts.xml
          retention-days: 14
          if-no-files-found: error

  inference-tensors:
    name: inference-tensors
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CUDA_VISIBLE_DEVICES: ""
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU Torch and tensor test dependencies
        run: |
          python -m pip install "torch==2.9.0+cpu" "torchvision==0.24.0+cpu" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[test,mcp]" \
            "safetensors>=0.4" "einops>=0.7,<0.9" "omegaconf>=2.3,<3" "triton==3.5.0" \
            "transformers>=4.57,<4.58" ftfy regex opencv-python-headless "aiohttp>=3.10,<4" scikit-image accelerate \
            av imageio imageio-ffmpeg easydict loguru matplotlib dm-tree "timm>=0.9,<2" "aiortc>=1.9,<2" "diffusers>=0.39,<0.40" \
            beautifulsoup4 decord "einops-exts==0.0.4" gdown hydra-core kornia lightning-utilities msgspec \
            open-clip-torch plyfile "pytorch-lightning==2.6.1" rich sentencepiece trimesh
      - name: Set up Node for realtime client contracts
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Run inference tensors and streaming contracts without model weights
        run: make test-infer-tensors
      - name: Validate browser presentation correlation and WebRTC stats
        run: make test-realtime-client
      - name: Publish inference contract results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inference-cpu-contracts
          path: |
            tmp/inference-cpu-selection.json
            tmp/inference-cpu-contracts.xml
          retention-days: 14
          if-no-files-found: error

  public-surface:
    name: public-surface
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: docs/fumadocs/.nvmrc
          cache: npm
          cache-dependency-path: docs/fumadocs/package-lock.json

      - name: Install quality gate dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "ruff==0.12.7"

      - name: Build docs
        run: bash scripts/docs/build.sh

      - name: Check generated docs
        run: make docs-check

      - name: Run lightweight quality gates
        run: make lint

      - name: Compile package and scripts
        run: make compile-eval

      - name: Run CLI check
        run: make cli-check

      - name: Run documented CLI entrypoint checks
        run: make cli-entrypoint-check

  packaging-license-gate:
    name: packaging-license-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: sh

    steps:
      - name: Checkout clean source tree
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install wheel build and audit tooling
        run: python -m pip install --upgrade build "setuptools>=77" "setuptools-scm[toml]" wheel

      - name: Build and audit clean distributions
        run: |
          test -z "$(git status --porcelain)"
          test ! -e build
          audit_dir="$(mktemp -d)"
          python -m build --outdir "$audit_dir"
          set -- "$audit_dir"/*.whl
          test "$#" -eq 1
          test -f "$1"
          wheel_path="$1"
          set -- "$audit_dir"/*.tar.gz
          test "$#" -eq 1
          test -f "$1"
          make packaging-check WHEEL="$wheel_path" SDIST="$1"
          python -m pip install "${wheel_path}[test]"
          source_dir="$audit_dir/source"
          mkdir "$source_dir"
          tar -xzf "$1" -C "$source_dir"
          cd "$source_dir"/*
          make test
