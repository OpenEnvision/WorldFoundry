name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install CPU test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run public CPU inference and packaging tests
        run: make test

  inference-tensors:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ""
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install CPU Torch and tensor test dependencies
        run: |
          python -m pip install "torch==2.7.1" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[test]" "safetensors>=0.4"
      - name: Run fast inference tensor contracts without model weights
        run: make test-infer-tensors

  public-surface:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          activate-environment: worldfoundry-ci
          auto-activate-base: false

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          cache: npm
          cache-dependency-path: docs/fumadocs/package-lock.json

      - name: Build docs
        run: bash scripts/docs/build.sh --skip-bootstrap

      - name: Install quality gate dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyYAML "ruff==0.12.7"

      - name: Check generated docs
        run: make docs-check

      - name: Run lightweight quality gates
        run: make lint

      - name: Compile package and scripts
        run: make compile-eval

      - name: Run CLI check
        run: make cli-check

      - name: Run documented CLI entrypoint checks
        run: make cli-entrypoint-check


  packaging-license-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: sh

    steps:
      - name: Checkout clean source tree
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install wheel build and audit tooling
        run: python -m pip install --upgrade build "setuptools>=77" "setuptools-scm[toml]" wheel

      - name: Build and audit clean distributions
        run: |
          test -z "$(git status --porcelain)"
          test ! -e build
          audit_dir="$(mktemp -d)"
          python -m build --outdir "$audit_dir"
          set -- "$audit_dir"/*.whl
          test "$#" -eq 1
          test -f "$1"
          wheel_path="$1"
          set -- "$audit_dir"/*.tar.gz
          test "$#" -eq 1
          test -f "$1"
          make packaging-check WHEEL="$wheel_path" SDIST="$1"
          python -m pip install "${wheel_path}[test]"
          source_dir="$audit_dir/source"
          mkdir "$source_dir"
          tar -xzf "$1" -C "$source_dir"
          cd "$source_dir"/*
          make test
