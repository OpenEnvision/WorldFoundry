name: PR checks

on:
  pull_request:

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dco:
    name: DCO
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout pull request commits
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check contribution sign-offs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/dev/check_dco.py --base "$BASE_SHA" --head "$HEAD_SHA"

  python-quality:
    name: Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull request source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.9.0+cpu" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[lint,test,mcp]" imageio
      - name: Check changed Python files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/dev/check_python_changes.py --base "$BASE_SHA" --head "$HEAD_SHA"
