name: Deploy Docs

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-docs.yml"
      - "docs/**"
      - "scripts/docs/**"
      # Site content is generated from these catalog and public API surfaces.
      - "worldfoundry/data/models/**"
      - "worldfoundry/data/benchmarks/**"
      - "worldfoundry/evaluation/api/**"
  workflow_dispatch:

# Keep the OIDC token out of the npm/Next.js build job. Only deploy-pages
# needs it; configure-pages needs Pages write when enablement is requested.
permissions:
  contents: read

concurrency:
  group: github-pages
  # Queue a newer publish instead of terminating a deployment in flight.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
    env:
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io
      NEXT_PUBLIC_DEMO_ASSET_BASE_URL: https://media.githubusercontent.com/media/${{ github.repository }}/${{ github.ref_name }}/docs/fumadocs/public

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: docs/fumadocs/.nvmrc
          cache: npm
          cache-dependency-path: docs/fumadocs/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          enablement: true

      - name: Build Fumadocs site
        run: bash scripts/docs/build.sh

      - name: Drop demos from Pages artifact and add .nojekyll
        run: |
          rm -rf docs/fumadocs/out/demos
          touch docs/fumadocs/out/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: docs/fumadocs/out

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
