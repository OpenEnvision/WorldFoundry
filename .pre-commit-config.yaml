default_language_version:
  python: python3
exclude: |
  (?x)(
    ^thirdparty/|
    ^cache/|
    ^tmp/|
    ^outputs?/|
    ^runs/|
    ^benchmark_results/|
    ^inspatio_world_output/|
    ^docs/fumadocs/(\.next|node_modules|out)/|
    ^apps/[^/]+/(\.next|node_modules|out)/|
    \.(patch|diff)$
  )
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.0.1
    hooks:
      - id: trailing-whitespace
        exclude_types: [python]
        exclude: ^THIRD-PARTY-NOTICES$
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
        exclude_types: [python]
      - id: check-merge-conflict
      - id: check-symlinks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.7
    hooks:
      - alias: ruff-import-sort
        name: ruff import sort
        id: ruff-check
        args: ["--fix", "--select", "I"]
        files: ^(worldfoundry|scripts|tests)/.*\.py$
      - id: ruff-check
        files: ^(worldfoundry|scripts|tests)/.*\.py$
      - id: ruff-format
        files: ^(worldfoundry|scripts|tests)/.*\.py$
  - repo: local
    hooks:
      - id: ty
        name: ty type check
        entry: python -m ty check --force-exclude
        language: system
        types: [python]
        files: ^(worldfoundry|scripts|tests)/.*\.py$
      - id: worldfoundry-lightweight-lint
        name: worldfoundry lightweight lint
        entry: make lint
        language: system
        pass_filenames: false
